<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KBTV - Submit Payment</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<nav>

<div class="logo">
<span>K</span>BTV
</div>

<ul>

<li>
<a href="index.html">Home</a>
</li>

<li>
<a href="moovie.html">Movies</a>
</li>

<li id="loginLink">
<a href="login.html">Login</a>
</li>

<li id="userInfo" style="display:none;">
<span id="userEmail" style="color:white;margin-right:10px;"></span>
</li>

<li id="logoutLi" style="display:none;">
<button
id="logoutBtn"
type="button"
style="
padding:10px 18px;
background:red;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
">
Logout
</button>
</li>

</ul>

</nav>


<section class="payment-page">

<div class="payment-card">

<h1>Submit Payment</h1>

<h2 id="uploadMovieTitle">Movie</h2>

<p>
Rental Price:
<strong>₹100</strong>
</p>

<label for="transactionId">
Transaction / Reference Number
</label>

<input
type="text"
id="transactionId"
placeholder="Enter transaction number"
required>


<label for="paymentScreenshot">
Payment Screenshot
</label>

<input
type="file"
id="paymentScreenshot"
accept="image/*"
required>


<p class="note">
Upload the screenshot showing your successful payment.
</p>


<button
id="submitPayment"
class="pay-btn"
type="button">

Submit Payment

</button>


<p
id="uploadMessage"
style="margin-top:20px;">
</p>

</div>

</section>

<!-- =========================
     FIREBASE AUTH - UPDATED
========================= -->

<script type="module">

// ============ IMPORT FROM FIREBASE.JS ============
import { auth, db } from "./firebase.js";
import { 
    onAuthStateChanged,
    signOut 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================================
   MOVIE INFORMATION
================================ */

const params = new URLSearchParams(window.location.search);
const movieNumber = params.get("movieId") || params.get("movie") || "1";
const movieTitle = params.get("movieTitle") || params.get("title") || "Movie";
const moviePrice = params.get("price") || "100";
const paymentMethod = params.get("method") || "UPI";

// Update movie title
document.getElementById("uploadMovieTitle").textContent = movieTitle;

/* ================================
   DOM ELEMENTS
================================ */

const loginLink = document.getElementById('loginLink');
const userInfo = document.getElementById('userInfo');
const userEmail = document.getElementById('userEmail');
const logoutLi = document.getElementById('logoutLi');
const logoutBtn = document.getElementById('logoutBtn');
const submitBtn = document.getElementById('submitPayment');
const message = document.getElementById('uploadMessage');

/* ================================
   CURRENT USER
================================ */

let currentUser = null;

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    if (user) {
        // User is logged in
        loginLink.style.display = 'none';
        userInfo.style.display = 'inline-block';
        logoutLi.style.display = 'inline-block';
        userEmail.textContent = '👤 ' + user.email;
        message.textContent = '';
        message.style.color = '';
    } else {
        // User is logged out
        loginLink.style.display = 'inline-block';
        userInfo.style.display = 'none';
        logoutLi.style.display = 'none';
        message.textContent = '⚠️ Please login before submitting payment.';
        message.style.color = '#856404';
    }
});

/* ================================
   LOGOUT
================================ */

logoutBtn.addEventListener('click', async () => {
    try {
        await signOut(auth);
        window.location.href = 'login.html';
    } catch (error) {
        console.error('Logout error:', error);
        alert('Logout error: ' + error.message);
    }
});

/* ================================
   SUBMIT PAYMENT
================================ */

submitBtn.addEventListener('click', async function () {
    const transactionId = document.getElementById('transactionId').value.trim();
    const screenshot = document.getElementById('paymentScreenshot').files[0];
    
    // Clear previous messages
    message.textContent = '';
    message.style.color = '';

    /* CHECK LOGIN */
    if (!currentUser) {
        message.textContent = '⚠️ Please login before submitting payment.';
        message.style.color = '#856404';
        return;
    }

    /* CHECK TRANSACTION ID */
    if (!transactionId) {
        message.textContent = '⚠️ Please enter your transaction/reference number.';
        message.style.color = '#856404';
        return;
    }

    /* CHECK SCREENSHOT */
    if (!screenshot) {
        message.textContent = '⚠️ Please select your payment screenshot.';
        message.style.color = '#856404';
        return;
    }

    /* CHECK IMAGE */
    if (!screenshot.type.startsWith('image/')) {
        message.textContent = '⚠️ Please select an image file.';
        message.style.color = '#856404';
        return;
    }

    /* LIMIT SCREENSHOT SIZE (5MB) */
    if (screenshot.size > 5 * 1024 * 1024) {
        message.textContent = '⚠️ Screenshot must be smaller than 5 MB.';
        message.style.color = '#856404';
        return;
    }

    /* DISABLE BUTTON AND SHOW LOADING */
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Submitting...';
    message.textContent = '⏳ Submitting payment details...';
    message.style.color = '#856404';

    try {
        /* SAVE PAYMENT INFORMATION TO FIRESTORE */
        const paymentData = {
            amount: parseInt(moviePrice),
            currency: 'INR',
            movieId: movieNumber,
            movieTitle: movieTitle,
            paymentMethod: paymentMethod,
            transactionId: transactionId,
            userId: currentUser.uid,
            userEmail: currentUser.email || '',
            screenshotName: screenshot.name,
            screenshotSize: screenshot.size,
            screenshotType: screenshot.type,
            status: 'pending',
            submittedAt: serverTimestamp()
        };

        /* CREATE FIRESTORE DOCUMENT */
        const paymentRef = await addDoc(collection(db, 'payments'), paymentData);
        
        console.log('✅ Payment submitted successfully! Payment ID:', paymentRef.id);
        console.log('📊 Payment Method:', paymentMethod);

        /* SUCCESS */
        message.textContent = '✅ Payment submitted successfully! Your payment is now pending verification.';
        message.style.color = '#155724';
        
        /* CLEAR FORM */
        document.getElementById('transactionId').value = '';
        document.getElementById('paymentScreenshot').value = '';

        /* RE-ENABLE BUTTON */
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Payment';

        /* Redirect to confirmation after 3 seconds */
        setTimeout(() => {
            window.location.href = 'payment-confirmation.html?movie=' + movieNumber;
        }, 3000);

    } catch (error) {
        console.error('Payment submission error:', error);
        message.textContent = '❌ Payment submission failed: ' + error.message;
        message.style.color = '#721c24';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Payment';
    }
});

console.log('✅ payment-upload.html - Firebase imported from firebase.js');
console.log('🎬 Movie:', movieTitle);
console.log('💰 Amount: ₹' + moviePrice);
console.log('💳 Payment Method:', paymentMethod);

</script>

</body>
</html>
