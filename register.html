<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Tambola House</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(
                145deg,
                #f5f0eb 0%,
                #e8e0d8 100%
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;

            background: white;

            border-radius: 40px;

            padding: 40px;

            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.1);

            border:
                1px solid rgba(255, 215, 175, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header .logo {
            font-size: 3rem;
            color: #b35e2e;
        }

        .auth-header h2 {
            color: #2d1f14;
            font-size: 1.8rem;
            margin-top: 10px;
        }

        .auth-header p {
            color: #7b6856;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #2d1f14;

            font-weight: 600;

            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;

            padding: 14px 16px;

            border:
                2px solid #e0d5c8;

            border-radius: 16px;

            font-size: 1rem;

            transition: 0.3s;

            background: #faf8f6;
        }

        .form-group input:focus {
            border-color: #b35e2e;

            outline: none;

            box-shadow:
                0 0 0 4px rgba(179, 94, 46, 0.1);
        }

        .btn-submit {
            width: 100%;

            padding: 16px;

            background: #b35e2e;

            color: white;

            border: none;

            border-radius: 16px;

            font-size: 1.1rem;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #8f4a24;

            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }

        .auth-footer {
            text-align: center;

            margin-top: 20px;

            color: #7b6856;
        }

        .auth-footer a {
            color: #b35e2e;

            text-decoration: none;

            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #f8d7da;

            color: #721c24;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 15px;

            display: none;

            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        .toast {
            position: fixed;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            padding: 12px 30px;

            border-radius: 50px;

            font-weight: 500;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.2);

            z-index: 2000;

            display: none;

            align-items: center;

            gap: 10px;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            background: #1f7a4b;
            color: white;
        }

        .toast.error {
            background: #b13e3e;
            color: white;
        }

        @media (max-width: 480px) {

            .auth-container {
                padding: 25px;

                border-radius: 30px;
            }

        }

    </style>

</head>


<body>


<div class="auth-container">


    <!-- HEADER -->

    <div class="auth-header">

        <div class="logo">
            🎱
        </div>

        <h2>
            Create Account
        </h2>

        <p>
            Join the fun and start playing!
        </p>

    </div>


    <!-- ERROR -->

    <div
        class="error-msg"
        id="errorMsg"
    >

        <i class="fas fa-exclamation-circle"></i>

        <span id="errorText">
            Error message
        </span>

    </div>


    <!-- REGISTER FORM -->

    <form id="registerForm">


        <!-- FULL NAME -->

        <div class="form-group">

            <label for="fullName">

                <i class="fas fa-user"></i>

                Full Name

            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">

                <i class="fas fa-envelope"></i>

                Email

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">

                <i class="fas fa-lock"></i>

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password (min 6 chars)"
                required
                minlength="6"
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">

                <i class="fas fa-lock"></i>

                Confirm Password

            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
                minlength="6"
            >

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            class="btn-submit"
            id="registerButton"
        >

            <i class="fas fa-user-plus"></i>

            Register

        </button>


    </form>


    <!-- LOGIN LINK -->

    <div class="auth-footer">

        Already have an account?

        <a href="login.html">
            Login here
        </a>

    </div>


</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
>

    <i
        class="fas fa-check-circle"
        id="toastIcon"
    ></i>

    <span id="toastMessage">
        Success!
    </span>

</div>


<!-- =====================================================
     FIREBASE SDK
====================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>


<!-- =====================================================
     FIREBASE CONFIG
====================================================== -->

<script>

    const firebaseConfig = {

        apiKey:
            "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",

        authDomain:
            "tambola-house-3dc56.firebaseapp.com",

        projectId:
            "tambola-house-3dc56",

        storageBucket:
            "tambola-house-3dc56.firebasestorage.app",

        messagingSenderId:
            "267918174188",

        appId:
            "1:267918174188:web:ec27684544c286c044c2c9"

    };


    // Initialize Firebase

    firebase.initializeApp(firebaseConfig);


    // Firebase Authentication

    const auth = firebase.auth();


    // Firestore

    const db = firebase.firestore();

</script>


<!-- =====================================================
     REGISTRATION
====================================================== -->

<script>

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const errorMsg =
        document.getElementById("errorMsg");

    const errorText =
        document.getElementById("errorText");


    // ============================================
    // ERROR MESSAGE
    // ============================================

    function showError(message) {

        errorText.textContent = message;

        errorMsg.classList.add("show");

        setTimeout(() => {

            errorMsg.classList.remove("show");

        }, 4000);

    }


    // ============================================
    // TOAST
    // ============================================

    function showToast(
        message,
        type = "success"
    ) {

        const toast =
            document.getElementById("toast");

        const toastMessage =
            document.getElementById("toastMessage");

        const toastIcon =
            document.getElementById("toastIcon");


        toastMessage.textContent =
            message;


        toast.className = "toast";


        if (type === "success") {

            toast.classList.add("success");

            toastIcon.className =
                "fas fa-check-circle";

        } else {

            toast.classList.add("error");

            toastIcon.className =
                "fas fa-exclamation-circle";

        }


        toast.classList.add("show");


        setTimeout(() => {

            toast.classList.remove("show");

        }, 3000);

    }


    // ============================================
    // REGISTRATION
    // ============================================

    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // ====================================
            // VALIDATION
            // ====================================

            if (!fullName) {

                showError(
                    "Please enter your full name."
                );

                return;

            }


            if (!email) {

                showError(
                    "Please enter your email."
                );

                return;

            }


            if (password.length < 6) {

                showError(
                    "Password must be at least 6 characters."
                );

                return;

            }


            if (password !== confirmPassword) {

                showError(
                    "Passwords do not match."
                );

                return;

            }


            // Disable button

            registerButton.disabled = true;

            registerButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Creating Account...';


            try {


                // ====================================
                // CREATE FIREBASE USER
                // ====================================

                const userCredential =
                    await auth
                        .createUserWithEmailAndPassword(
                            email,
                            password
                        );


                const user =
                    userCredential.user;


                // ====================================
                // SAVE DISPLAY NAME
                // ====================================

                await user.updateProfile({

                    displayName: fullName

                });


                // ====================================
                // CREATE FIRESTORE USER DOCUMENT
                // ====================================

                await db
                    .collection("users")
                    .doc(user.uid)
                    .set({

                        uid: user.uid,

                        fullName: fullName,

                        email: email,

                        tokens: 50,

                        balance: 0,

                        role: "user",

                        status: "active",

                        createdAt:
                            firebase
                                .firestore
                                .FieldValue
                                .serverTimestamp()

                    });


                // ====================================
                // SUCCESS
                // ====================================

                showToast(
                    "Registration successful!",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 1500);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                // ====================================
                // FIREBASE ERRORS
                // ====================================

                switch (error.code) {

                    case "auth/email-already-in-use":

                        showError(
                            "This email is already registered."
                        );

                        break;


                    case "auth/invalid-email":

                        showError(
                            "Please enter a valid email address."
                        );

                        break;


                    case "auth/weak-password":

                        showError(
                            "Password is too weak. Use at least 6 characters."
                        );

                        break;


                    case "auth/operation-not-allowed":

                        showError(
                            "Email/password authentication is not enabled in Firebase."
                        );

                        break;


                    default:

                        showError(
                            error.message ||
                            "Registration failed. Please try again."
                        );

                }


                registerButton.disabled = false;

                registerButton.innerHTML =
                    '<i class="fas fa-user-plus"></i> Register';

            }

        }
    );

</script>


</body>

</html>
