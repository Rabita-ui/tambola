<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Schedule - Tambola House</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 20px 30px; background: white; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .back-btn { color: #b35e2e; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e0d5c8; }
        .draw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .status-badge { background: #d4edc9; color: #1f5a3b; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <h2>Draw Schedule</h2>
    </div>

    <div class="card">
        <div class="draw-header">
            <h3 style="color:#2d1f14;">Draw #001 (Active)</h3>
            <span class="status-badge">LIVE TODAY</span>
        </div>
        <p style="color:#7b6856; margin-bottom:15px;">Daily Game - Prize Pool: 500 Tokens</p>
        <p><strong>Time:</strong> 8:00 PM IST</p>
    </div>
</div>

</body>
</html>
