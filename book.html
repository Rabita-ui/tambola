<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Draws - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Latest Game Draws</h2>
            <a href="user.html" class="btn btn-secondary btn-sm">Back to Dashboard</a>
        </div>

        <div class="card p-3 mb-4">
            <h4>Game Sessions (Showing up to 3)</h4>
            <div id="available-games-container">
                <p class="text-muted">Loading game draws...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loadLatestGames();
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadLatestGames() {
            const container = document.getElementById('available-games-container');
            try {
                const now = new Date();
                const q = query(collection(db, "games"), orderBy("createdAt", "desc"), limit(3));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = "<p class='text-muted'>No game draws available right now.</p>";
                    return;
                }

                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const game = docSnap.data();
                    const gameId = docSnap.id;
                    const startTime = new Date(game.startTime);
                    
                    const isPast = startTime <= now;
                    const statusColor = isPast ? "border-danger text-danger bg-light" : "border-primary text-primary bg-white";
                    const badgeText = isPast ? "<span class='badge bg-danger'>Past / Finished</span>" : "<span class='badge bg-primary'>Upcoming</span>";

                    const gameCard = document.createElement('div');
                    gameCard.className = `border p-3 mb-3 rounded shadow-sm ${statusColor}`;
                    gameCard.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <div>
                                <h5 class="mb-1">Draw Time: ${startTime.toLocaleString()} ${badgeText}</h5>
                                <p class="mb-0 text-muted"><strong>Prizes:</strong> ${game.prizes}</p>
                            </div>
                            <div>
                                <a href="ticketdata.html?gameId=${gameId}" class="btn btn-outline-primary btn-sm">View Related Tickets</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(gameCard);
                });
            } catch (err) {
                console.error("Error loading games:", err);
                container.innerHTML = "<p class='text-danger'>Failed to load game draws.</p>";
            }
        }
    </script>
</body>
</html>
