<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Book Game Tickets</h2>
            <div class="d-flex gap-2">
                <a href="ticketdata.html" class="btn btn-info btn-sm text-white">📊 View Game Ticket Data</a>
                <a href="user.html" class="btn btn-secondary btn-sm">Back to Dashboard</a>
            </div>
        </div>

        <div class="card p-3 mb-4">
            <h4>Available Game Draws</h4>
            <div id="available-games-container">
                <p class="text-muted">Loading available draws...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, query, where, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await cleanupExpiredGamesAndTickets();
                loadAvailableDraws();
            } else {
                window.location.href = "index.html";
            }
        });

        async function cleanupExpiredGamesAndTickets() {
            try {
                const now = new Date().toISOString();
                const gamesRef = collection(db, "games");
                const expiredQuery = query(gamesRef, where("status", "==", "upcoming"), where("startTime", "<=", now));
                const expiredSnap = await getDocs(expiredQuery);

                for (const gameDoc of expiredSnap.docs) {
                    const gameId = gameDoc.id;

                    const ticketsQuery = query(collection(db, "booked_tickets"), where("gameId", "==", gameId));
                    const ticketsSnap = await getDocs(ticketsQuery);

                    for (const ticketDoc of ticketsSnap.docs) {
                        await deleteDoc(doc(db, "booked_tickets", ticketDoc.id));
                    }

                    await deleteDoc(doc(db, "games", gameId));
                }
            } catch (error) {
                console.error("Cleanup Error:", error);
            }
        }

        async function loadAvailableDraws() {
            const container = document.getElementById('available-games-container');
            try {
                const now = new Date().toISOString();
                const q = query(collection(db, "games"), where("status", "==", "upcoming"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = "<p class='text-muted'>No upcoming game draws available right now.</p>";
                    return;
                }

                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const game = docSnap.data();
                    const gameId = docSnap.id;

                    if (game.startTime && game.startTime <= now) return;

                    const gameCard = document.createElement('div');
                    gameCard.className = "border p-3 mb-3 rounded bg-white shadow-sm d-flex justify-content-between align-items-center flex-wrap gap-2";
                    gameCard.innerHTML = `
                        <div>
                            <h5>Draw Time: ${new Date(game.startTime).toLocaleString()}</h5>
                            <p class="mb-0 text-muted"><strong>Prizes:</strong> ${game.prizes}</p>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="ticketdata.html" class="btn btn-outline-primary btn-sm">View Tickets</a>
                            <button class="btn btn-success btn-sm" onclick="bookTicket('${gameId}')">Generate & Book Ticket</button>
                        </div>
                    `;
                    container.appendChild(gameCard);
                });
            } catch (err) {
                console.error("Error loading draws:", err);
                container.innerHTML = "<p class='text-danger'>Failed to load game draws.</p>";
            }
        }

        function generateTicketNumbers() {
            let nums = Array.from({length: 27}, () => Math.floor(Math.random() * 90) + 1);
            return nums.join(',');
        }

        window.bookTicket = async function(gameId) {
            if (!currentUser) return;

            try {
                const ticketNo = Math.floor(1000 + Math.random() * 9000);
                const numbersString = generateTicketNumbers();

                await addDoc(collection(db, "booked_tickets"), {
                    userId: currentUser.uid,
                    email: currentUser.email,
                    gameId: gameId,
                    ticketNo: ticketNo,
                    numbersString: numbersString,
                    bookedAt: new Date().toISOString()
                });

                alert(`Ticket #${ticketNo} successfully booked for this draw!`);
                window.location.href = "user.html";
            } catch (err) {
                console.error("Booking Error:", err);
                alert("Failed to book ticket: " + err.message);
            }
        };
    </script>
</body>
</html>
