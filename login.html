<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Tambola House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #ff6b00;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <h1>Tambola House</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            required
            placeholder="Enter your email"
        >


        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            required
            placeholder="Enter your password"
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="message"></div>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register here
        </a>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import { firebaseConfig }
        from "./firebase-config.js";


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Login form

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        message.style.color = "#333";

        message.textContent =
            "Logging in...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.style.color = "green";

            message.textContent =
                "Login successful!";


            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            message.style.color = "red";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "Incorrect email or password.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "No account found with this email.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "Incorrect password.";

            } else {

                message.textContent =
                    "Login failed: " +
                    error.message;

            }

        }

    });

</script>

</body>
</html>
