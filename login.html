<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Tambola House</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 215, 175, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header .logo {
            font-size: 3rem;
            color: #b35e2e;
        }

        .auth-header h2 {
            color: #2d1f14;
            font-size: 1.8rem;
            margin-top: 10px;
        }

        .auth-header p {
            color: #7b6856;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2d1f14;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0d5c8;
            border-radius: 16px;
            font-size: 1rem;
            transition: 0.3s;
            background: #faf8f6;
        }

        .form-group input:focus {
            border-color: #b35e2e;
            outline: none;
            box-shadow: 0 0 0 4px rgba(179, 94, 46, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #1f7a4b;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #16633b;
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #7b6856;
        }

        .auth-footer a {
            color: #b35e2e;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .error-msg.show {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            background: #1f7a4b;
            color: white;
        }

        .toast.error {
            background: #b13e3e;
            color: white;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px;
                border-radius: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-header">
            <div class="logo">🎱</div>

            <h2>Welcome Back!</h2>

            <p>Login to continue playing</p>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Invalid credentials</span>
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-submit"
                id="loginButton"
            >
                <i class="fas fa-sign-in-alt"></i>
                Login
            </button>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>

    </div>

    <div class="toast" id="toast">

        <i class="fas fa-check-circle" id="toastIcon"></i>

        <span id="toastMessage">
            Success!
        </span>

    </div>


    <!-- =========================================
         FIREBASE SDK
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>


    <!-- =========================================
         FIREBASE CONFIGURATION
    ========================================== -->

    <script>

        const firebaseConfig = {

            apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",

            authDomain: "tambola-house-3dc56.firebaseapp.com",

            projectId: "tambola-house-3dc56",

            storageBucket: "tambola-house-3dc56.firebasestorage.app",

            messagingSenderId: "267918174188",

            appId: "1:267918174188:web:ec27684544c286c044c2c9"

        };


        // Initialize Firebase

        firebase.initializeApp(firebaseConfig);


        // Firebase Authentication

        const auth = firebase.auth();


        // Firestore Database

        const db = firebase.firestore();

    </script>


    <!-- =========================================
         LOGIN SYSTEM
    ========================================== -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const errorMsg =
            document.getElementById("errorMsg");

        const errorText =
            document.getElementById("errorText");

        const toast =
            document.getElementById("toast");

        const toastMessage =
            document.getElementById("toastMessage");


        // =========================================
        // SHOW ERROR
        // =========================================

        function showError(message) {

            errorText.textContent = message;

            errorMsg.classList.add("show");

            setTimeout(() => {

                errorMsg.classList.remove("show");

            }, 4000);
        }


        // =========================================
        // SHOW TOAST
        // =========================================

        function showToast(message) {

            toastMessage.textContent = message;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 2500);
        }


        // =========================================
        // CHECK CURRENT LOGIN
        // =========================================

        auth.onAuthStateChanged(async (user) => {

            if (!user) {
                return;
            }

            try {

                const userDoc = await db
                    .collection("users")
                    .doc(user.uid)
                    .get();

                if (userDoc.exists) {

                    const userData = userDoc.data();

                    if (userData.role === "admin") {

                        window.location.href =
                            "admin-dashboard.html";

                    } else {

                        window.location.href =
                            "dashboard.html";

                    }

                } else {

                    window.location.href =
                        "dashboard.html";

                }

            } catch (error) {

                console.error(
                    "User check error:",
                    error
                );

                window.location.href =
                    "dashboard.html";
            }

        });


        // =========================================
        // LOGIN
        // =========================================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showError(
                        "Please enter your email and password."
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Logging in...';


                try {

                    const userCredential =
                        await auth.signInWithEmailAndPassword(
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    showToast(
                        "Login successful!"
                    );


                    // Check Firestore user document

                    const userDoc =
                        await db
                            .collection("users")
                            .doc(user.uid)
                            .get();


                    if (userDoc.exists) {

                        const userData =
                            userDoc.data();


                        if (
                            userData.role === "admin"
                        ) {

                            window.location.href =
                                "admin-dashboard.html";

                        } else {

                            window.location.href =
                                "dashboard.html";

                        }

                    } else {

                        window.location.href =
                            "dashboard.html";

                    }


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    switch (error.code) {

                        case "auth/user-not-found":

                            showError(
                                "No account found with this email."
                            );

                            break;


                        case "auth/wrong-password":

                            showError(
                                "Incorrect password."
                            );

                            break;


                        case "auth/invalid-email":

                            showError(
                                "Please enter a valid email address."
                            );

                            break;


                        case "auth/user-disabled":

                            showError(
                                "This account has been disabled."
                            );

                            break;


                        case "auth/too-many-requests":

                            showError(
                                "Too many login attempts. Please try again later."
                            );

                            break;


                        case "auth/invalid-credential":

                            showError(
                                "Invalid email or password."
                            );

                            break;


                        default:

                            showError(
                                error.message ||
                                "Login failed. Please try again."
                            );

                    }


                    loginButton.disabled = false;

                    loginButton.innerHTML =
                        '<i class="fas fa-sign-in-alt"></i> Login';

                }

            }
        );

    </script>

</body>
</html>
