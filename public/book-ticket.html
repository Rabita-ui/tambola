<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola House - My Books</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }
        .navbar h1 { font-size: 1.8em; }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .ticket-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .ticket-card:hover { transform: translateY(-3px); }
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
            margin: 10px 0;
            max-width: 500px;
        }
        .ticket-cell {
            background: #f8f9fa;
            padding: 6px;
            text-align: center;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.85em;
        }
        .ticket-cell.has-number { background: #667eea; color: white; }
        .ticket-cell.claimed { background: #27ae60; color: white; }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ticket-id { font-weight: 600; color: #333; }
        .claimed-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .claimed-badge.pending { background: #f39c12; color: white; }
        .claimed-badge.claimed { background: #27ae60; color: white; }
        .claimed-badge.winning { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .no-books {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .no-books h2 { font-size: 2em; margin-bottom: 10px; }
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: #667eea; }
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .game-name {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 Tambola House</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="game.html">Join Game</a>
            <a href="book.html">My Books</a>
            <a href="deposit.html">Deposit</a>
        </div>
    </nav>

    <div class="container">
        <h2>📖 My Tickets</h2>
        
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">⏳ Pending</button>
            <button class="filter-btn" data-filter="claimed">✅ Claimed</button>
        </div>

        <div id="ticketsList"></div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, db, collection, query, where, onSnapshot, doc, getDoc } from './firebase-config.js';

        let currentFilter = 'all';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadTickets(user.uid);
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadTickets(auth.currentUser.uid);
            });
        });

        function loadTickets(userId) {
            const ticketsRef = collection(db, 'booked_tickets');
            const q = query(ticketsRef, where('userId', '==', userId));
            
            onSnapshot(q, async (snapshot) => {
                const ticketsList = document.getElementById('ticketsList');
                ticketsList.innerHTML = '';

                if (snapshot.empty) {
                    ticketsList.innerHTML = `
                        <div class="no-books">
                            <h2>📚 No Tickets Yet</h2>
                            <p>Join a game to purchase tickets!</p>
                        </div>
                    `;
                    return;
                }

                let tickets = [];
                for (const docSnapshot of snapshot.docs) {
                    const ticket = docSnapshot.data();
                    const ticketId = docSnapshot.id;
                    
                    // Get game details
                    let gameName = 'Unknown Game';
                    if (ticket.gameId) {
                        const gameDoc = await getDoc(doc(db, 'game_session', ticket.gameId));
                        if (gameDoc.exists()) {
                            gameName = gameDoc.data().name || gameName;
                        }
                    }
                    
                    tickets.push({
                        id: ticketId,
                        ...ticket,
                        gameName: gameName
                    });
                }

                // Filter tickets
                if (currentFilter === 'pending') {
                    tickets = tickets.filter(t => !t.claimed);
                } else if (currentFilter === 'claimed') {
                    tickets = tickets.filter(t => t.claimed);
                }

                if (tickets.length === 0) {
                    ticketsList.innerHTML = `
                        <div class="no-books">
                            <h2>${currentFilter === 'all' ? '📚 No Tickets' : 'No ' + currentFilter + ' tickets'}</h2>
                            <p>${currentFilter === 'all' ? 'Join a game to purchase tickets!' : 'No tickets in this category'}</p>
                        </div>
                    `;
                    return;
                }

                tickets.forEach((ticket) => {
                    const numbers = ticket.numbersString ? ticket.numbersString.split(',').map(Number) : [];
                    
                    const card = document.createElement('div');
                    card.className = 'ticket-card';
                    
                    let gridHtml = '';
                    if (numbers.length === 27) {
                        gridHtml = '<div class="ticket-grid">';
                        numbers.forEach(num => {
                            const cellClass = num !== 0 ? 'has-number' : '';
                            gridHtml += `<div class="ticket-cell ${cellClass}">${num || ''}</div>`;
                        });
                        gridHtml += '</div>';
                    }

                    const statusClass = ticket.claimed ? 'claimed' : 'pending';
                    const statusText = ticket.claimed ? '✅ Claimed' : '⏳ Pending';

                    card.innerHTML = `
                        <div class="ticket-header">
                            <div>
                                <span class="ticket-id">🎫 Ticket #${ticket.id.slice(0, 8)}</span>
                                <span style="margin-left:10px;font-size:0.9em;color:#666;">#${ticket.ticketNo || 1}</span>
                            </div>
                            <span class="claimed-badge ${statusClass}">${statusText}</span>
                        </div>
                        <p>🎮 Game: <span class="game-name">${ticket.gameName}</span></p>
                        <p>📅 Booked: ${ticket.bookedAt ? new Date(ticket.bookedAt).toLocaleString() : 'N/A'}</p>
                        ${gridHtml}
                    `;
                    ticketsList.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
