<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Control Panel</h2>
            <button id="btn-logout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>

        <!-- Game Creation Form -->
        <div class="card p-3">
            <h4>Create New Game</h4>
            <div class="mb-3">
                <label for="game-start-time" class="form-label">Start Time</label>
                <input type="datetime-local" id="game-start-time" class="form-control">
            </div>
            <div class="mb-3">
                <label for="game-prizes" class="form-label">Prizes (Comma-separated, e.g. 10,10,10,50)</label>
                <input type="text" id="game-prizes" placeholder="10,10,10,50" class="form-control">
            </div>
            <button id="btn-create-game" class="btn btn-primary">Create Game</button>
        </div>

        <!-- Live Game Host Launcher & Configuration -->
        <div class="card p-3">
            <h4>Live Game Host Controls</h4>
            <div class="mb-3">
                <label for="call-interval" class="form-label">Call Interval (Seconds)</label>
                <input type="number" id="call-interval" value="5" min="1" max="30" class="form-control">
            </div>
            <a href="game.html?role=host" id="dashboard-link" class="btn btn-warning w-100" target="_blank">Launch Live Game Host View</a>
        </div>

        <!-- Approvals Section -->
        <div class="card p-3">
            <h4>Token Requests Approval</h4>
            <div id="token-requests-container">
                <p class="text-muted">Loading requests...</p>
            </div>
        </div>

        <div class="card p-3">
            <h4>Withdrawal Requests Approval</h4>
            <div id="withdrawal-requests-container">
                <p class="text-muted">Loading requests...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addRef, getDocs, doc, setDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        });

        document.getElementById('btn-create-game').addEventListener('click', async () => {
            const startTime = document.getElementById('game-start-time').value;
            const prizes = document.getElementById('game-prizes').value;

            if (!startTime || !prizes) {
                alert("Please fill out all game fields.");
                return;
            }

            try {
                await setDoc(doc(db, "games", "active_game"), {
                    startTime: startTime,
                    prizes: prizes,
                    firstNumber: 5,
                    status: "upcoming",
                    createdAt: new Date().toISOString(),
                    currentNumber: "--",
                    calledNumbers: [],
                    isRunning: false
                }, { merge: true });

                alert("Game created and initialized successfully!");
            } catch (err) {
                console.error("Error creating game:", err);
                alert("Failed to create game: " + err.message);
            }
        });

        // Load Token Requests
        const tokenContainer = document.getElementById('token-requests-container');
        onSnapshot(collection(db, "token_requests"), (snapshot) => {
            if (snapshot.empty) {
                tokenContainer.innerHTML = "<p class='text-muted'>No pending token requests.</p>";
                return;
            }
            tokenContainer.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const req = docSnap.data();
                const div = document.createElement('div');
                div.className = "d-flex justify-content-between align-items-center border-bottom py-2";
                div.innerHTML = `<span>User: ${req.userId || 'Unknown'} - Amount: ${req.amount || 0}</span>
                                 <button class="btn btn-success btn-sm" onclick="approveToken('${docSnap.id}')">Approve</button>`;
                tokenContainer.appendChild(div);
            });
        });
    </script>
</body>
</html>
