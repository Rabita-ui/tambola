<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Tambola House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #logoutBtn {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome,
        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat {
            padding: 20px;
            border-radius: 10px;
            background: #f8f8f8;
            text-align: center;
        }

        .stat h3 {
            margin: 0 0 10px;
        }

        .statNumber {
            font-size: 30px;
            font-weight: bold;
        }

        .request {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-top: 15px;
        }

        .request p {
            margin: 7px 0;
        }

        .requestButtons {
            margin-top: 15px;
        }

        .approve,
        .reject {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
        }

        .approve {
            background: #2e7d32;
        }

        .reject {
            background: #d32f2f;
        }

        .empty {
            color: #777;
            padding: 15px 0;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        .ticketButton {
            background: #ff6600;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .ticketButton:hover {
            background: #e65c00;
        }

        .ticketInfo {
            margin-top: 15px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>

    <h1>Tambola House - Admin</h1>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h2>
            Welcome, <span id="adminName">Admin</span>
        </h2>

        <p>
            Administrator Control Panel
        </p>

    </div>


    <div class="section">

        <h2>Overview</h2>

        <div class="stats">

            <div class="stat">

                <h3>Registered Users</h3>

                <div
                    class="statNumber"
                    id="userCount">
                    0
                </div>

            </div>


            <div class="stat">

                <h3>Pending Deposits</h3>

                <div
                    class="statNumber"
                    id="pendingCount">
                    0
                </div>

            </div>


            <div class="stat">

                <h3>Tickets</h3>

                <div
                    class="statNumber"
                    id="ticketCount">
                    0
                </div>

            </div>

        </div>

    </div>


    <div class="section">

        <h2>Token Deposit Requests</h2>

        <div id="depositRequests">

            <div class="empty">
                Loading deposit requests...
            </div>

        </div>

    </div>


    <div class="section">

        <h2>Tambola Management</h2>

        <p>
            Generate the 300 tickets for the Tambola game.
        </p>

        <button
            id="generateTicketsBtn"
            class="ticketButton">

            Generate 300 Tickets

        </button>

        <div
            id="ticketInfo"
            class="ticketInfo">

            Checking tickets...

        </div>

    </div>


    <div id="message"></div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where,
        orderBy,
        updateDoc,
        increment,
        serverTimestamp,
        writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import { firebaseConfig }
        from "./firebase-config.js";


    // Firebase

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // Elements

    const adminName =
        document.getElementById("adminName");

    const userCount =
        document.getElementById("userCount");

    const pendingCount =
        document.getElementById("pendingCount");

    const ticketCount =
        document.getElementById("ticketCount");

    const depositRequests =
        document.getElementById("depositRequests");

    const message =
        document.getElementById("message");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const generateTicketsBtn =
        document.getElementById("generateTicketsBtn");

    const ticketInfo =
        document.getElementById("ticketInfo");


    let currentAdmin = null;


    // ==========================================
    // CHECK ADMIN
    // ==========================================

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        try {

            const userRef =
                doc(db, "users", user.uid);

            const userSnapshot =
                await getDoc(userRef);


            if (!userSnapshot.exists()) {

                alert("Admin profile not found.");

                await signOut(auth);

                window.location.href =
                    "login.html";

                return;
            }


            const userData =
                userSnapshot.data();


            if (userData.role !== "admin") {

                alert(
                    "Access denied. Admin account required."
                );

                window.location.href =
                    "dashboard.html";

                return;
            }


            currentAdmin = user;


            adminName.textContent =
                userData.name || "Admin";


            await loadStatistics();

            await loadDepositRequests();

            await checkTickets();


        } catch (error) {

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Unable to load admin panel.";

        }

    });


    // ==========================================
    // STATISTICS
    // ==========================================

    async function loadStatistics() {

        try {

            const usersSnapshot =
                await getDocs(
                    collection(db, "users")
                );


            userCount.textContent =
                usersSnapshot.size;


            const pendingQuery =
                query(
                    collection(db, "depositRequests"),
                    where("status", "==", "pending")
                );


            const pendingSnapshot =
                await getDocs(pendingQuery);


            pendingCount.textContent =
                pendingSnapshot.size;


            const ticketsSnapshot =
                await getDocs(
                    collection(db, "tickets")
                );


            ticketCount.textContent =
                ticketsSnapshot.size;


        } catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // DEPOSIT REQUESTS
    // ==========================================

    async function loadDepositRequests() {

        depositRequests.innerHTML =
            '<div class="empty">Loading...</div>';


        try {

            const requestQuery =
                query(
                    collection(db, "depositRequests"),
                    where("status", "==", "pending"),
                    orderBy("createdAt", "desc")
                );


            const snapshot =
                await getDocs(requestQuery);


            pendingCount.textContent =
                snapshot.size;


            if (snapshot.empty) {

                depositRequests.innerHTML =
                    '<div class="empty">No pending deposit requests.</div>';

                return;
            }


            depositRequests.innerHTML = "";


            snapshot.forEach((requestDoc) => {

                const data =
                    requestDoc.data();


                const div =
                    document.createElement("div");

                div.className =
                    "request";


                div.innerHTML = `

                    <p>
                        <strong>User:</strong>
                        ${escapeHtml(data.email || "")}
                    </p>

                    <p>
                        <strong>Amount:</strong>
                        ₹${Number(data.amount || 0)}
                    </p>

                    <p>
                        <strong>Transaction Reference:</strong>
                        ${escapeHtml(data.reference || "")}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${escapeHtml(data.status || "")}
                    </p>

                    <div class="requestButtons">

                        <button
                            class="approve"
                            data-id="${requestDoc.id}"
                            data-user="${data.userId}"
                            data-amount="${Number(data.amount || 0)}">

                            Approve

                        </button>


                        <button
                            class="reject"
                            data-id="${requestDoc.id}">

                            Reject

                        </button>

                    </div>

                `;


                depositRequests.appendChild(div);

            });


            document
                .querySelectorAll(".approve")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => approveDeposit(
                            button.dataset.id,
                            button.dataset.user,
                            Number(button.dataset.amount)
                        )
                    );

                });


            document
                .querySelectorAll(".reject")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => rejectDeposit(
                            button.dataset.id
                        )
                    );

                });


        } catch (error) {

            console.error(error);

            depositRequests.innerHTML =
                `<div class="empty">
                    Unable to load requests.
                    ${escapeHtml(error.message)}
                 </div>`;

        }

    }


    // ==========================================
    // APPROVE DEPOSIT
    // ==========================================

    async function approveDeposit(
        requestId,
        userId,
        amount
    ) {

        if (amount <= 0) {

            alert("Invalid deposit amount.");

            return;
        }


        const confirmed =
            confirm(
                `Approve ₹${amount} deposit?`
            );


        if (!confirmed) {
            return;
        }


        try {

            await updateDoc(
                doc(db, "users", userId),
                {
                    tokenBalance:
                        increment(amount)
                }
            );


            await updateDoc(
                doc(
                    db,
                    "depositRequests",
                    requestId
                ),
                {
                    status: "approved",
                    approvedBy: currentAdmin.uid,
                    approvedAt: serverTimestamp()
                }
            );


            alert(
                "Deposit approved and tokens added."
            );


            await loadStatistics();

            await loadDepositRequests();


        } catch (error) {

            console.error(error);

            alert(
                "Approval failed: " +
                error.message
            );

        }

    }


    // ==========================================
    // REJECT DEPOSIT
    // ==========================================

    async function rejectDeposit(requestId) {

        const confirmed =
            confirm(
                "Reject this deposit request?"
            );


        if (!confirmed) {
            return;
        }


        try {

            await updateDoc(
                doc(
                    db,
                    "depositRequests",
                    requestId
                ),
                {
                    status: "rejected",
                    rejectedBy: currentAdmin.uid,
                    rejectedAt: serverTimestamp()
                }
            );


            alert(
                "Deposit request rejected."
            );


            await loadStatistics();

            await loadDepositRequests();


        } catch (error) {

            console.error(error);

            alert(
                "Rejection failed: " +
                error.message
            );

        }

    }


    // ==========================================
    // CHECK TICKETS
    // ==========================================

    async function checkTickets() {

        try {

            const snapshot =
                await getDocs(
                    collection(db, "tickets")
                );


            ticketCount.textContent =
                snapshot.size;


            if (snapshot.size === 0) {

                ticketInfo.textContent =
                    "No tickets have been generated yet.";

                generateTicketsBtn.disabled =
                    false;

                return;
            }


            ticketInfo.textContent =
                `${snapshot.size} ticket(s) already exist.`;

            generateTicketsBtn.disabled =
                true;


        } catch (error) {

            console.error(error);

            ticketInfo.textContent =
                "Unable to check tickets.";

        }

    }


    // ==========================================
    // GENERATE 300 TICKETS
    // ==========================================

    generateTicketsBtn.addEventListener(
        "click",
        generateTickets
    );


    async function generateTickets() {

        const confirmed =
            confirm(
                "Generate 300 Tambola tickets now?"
            );


        if (!confirmed) {
            return;
        }


        generateTicketsBtn.disabled =
            true;

        ticketInfo.textContent =
            "Checking existing tickets...";


        try {

            // Check again before writing

            const existingSnapshot =
                await getDocs(
                    collection(db, "tickets")
                );


            if (existingSnapshot.size > 0) {

                alert(
                    "Tickets already exist. No new tickets were created."
                );

                await checkTickets();

                return;
            }


            ticketInfo.textContent =
                "Generating 300 tickets. Please wait...";


            // One Firestore batch can contain up to 500 writes.
            // Therefore all 300 tickets can be created in one batch.

            const batch =
                writeBatch(db);


            for (
                let ticketNumber = 1;
                ticketNumber <= 300;
                ticketNumber++
            ) {

                const ticket =
                    createTambolaTicket();


                const ticketRef =
                    doc(
                        db,
                        "tickets",
                        String(ticketNumber)
                    );


                batch.set(
                    ticketRef,
                    {
                        ticketNumber:
                            ticketNumber,

                        numbers:
                            ticket,

                        available:
                            true,

                        bookedBy:
                            null,

                        bookedAt:
                            null,

                        createdAt:
                            serverTimestamp()
                    }
                );

            }


            await batch.commit();


            alert(
                "300 Tambola tickets created successfully!"
            );


            ticketInfo.textContent =
                "300 tickets have been generated successfully.";


            await loadStatistics();

            await checkTickets();


        } catch (error) {

            console.error(error);

            alert(
                "Ticket generation failed: " +
                error.message
            );


            generateTicketsBtn.disabled =
                false;

            ticketInfo.textContent =
                "Ticket generation failed.";

        }

    }


    // ==========================================
    // CREATE STANDARD TAMBOLA TICKET
    // ==========================================

    function createTambolaTicket() {

        /*
            Standard Tambola ticket:

            3 rows
            9 columns
            15 numbers total

            Each column represents:

            Column 1 = 1-9
            Column 2 = 10-19
            Column 3 = 20-29
            ...
            Column 9 = 80-90
        */


        const ranges = [
            [1, 9],
            [10, 19],
            [20, 29],
            [30, 39],
            [40, 49],
            [50, 59],
            [60, 69],
            [70, 79],
            [80, 90]
        ];


        // Empty 3 x 9 grid

        const grid = [
            [null, null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null, null]
        ];


        // Choose 5 columns for each row initially

        const rowColumns = [
            randomColumns(5),
            randomColumns(5),
            randomColumns(5)
        ];


        /*
            Make sure every column gets at least one number.
        */

        for (let column = 0; column < 9; column++) {

            let hasNumber = false;

            for (let row = 0; row < 3; row++) {

                if (
                    rowColumns[row].includes(column)
                ) {

                    hasNumber = true;

                    break;
                }

            }


            if (!hasNumber) {

                const row =
                    Math.floor(
                        Math.random() * 3
                    );


                const replaceIndex =
                    Math.floor(
                        Math.random() *
                        rowColumns[row].length
                    );


                rowColumns[row][replaceIndex] =
                    column;

            }

        }


        /*
            Fill each selected column with numbers.
        */

        for (let column = 0; column < 9; column++) {

            const rows = [];


            for (let row = 0; row < 3; row++) {

                if (
                    rowColumns[row].includes(column)
                ) {

                    rows.push(row);

                }

            }


            const [min, max] =
                ranges[column];


            const numbers =
                randomNumbers(
                    min,
                    max,
                    rows.length
                );


            numbers.sort(
                (a, b) => a - b
            );


            rows.sort(
                (a, b) => a - b
            );


            for (
                let i = 0;
                i < rows.length;
                i++
            ) {

                grid[rows[i]][column] =
                    numbers[i];

            }

        }


        return grid;

    }


    // ==========================================
    // RANDOM COLUMNS
    // ==========================================

    function randomColumns(count) {

        const columns = [];


        while (
            columns.length < count
        ) {

            const column =
                Math.floor(
                    Math.random() * 9
                );


            if (
                !columns.includes(column)
            ) {

                columns.push(column);

            }

        }


        return columns;

    }


    // ==========================================
    // RANDOM NUMBERS
    // ==========================================

    function randomNumbers(
        min,
        max,
        count
    ) {

        const numbers = [];


        for (
            let number = min;
            number <= max;
            number++
        ) {

            numbers.push(number);

        }


        // Shuffle

        for (
            let i = numbers.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );


            [
                numbers[i],
                numbers[j]
            ] = [
                numbers[j],
                numbers[i]
            ];

        }


        return numbers.slice(
            0,
            count
        );

    }


    // ==========================================
    // HTML ESCAPING
    // ==========================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
        "click",
        async () => {

            await signOut(auth);

            window.location.href =
                "login.html";

        }
    );

</script>

</body>
</html>
