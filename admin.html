<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tambola House</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f3ee, #e9e1d7);
            color: #2d1f14;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header h1 i {
            color: #b35e2e;
        }

        .nav a {
            text-decoration: none;
            color: #7b6856;
            font-weight: 600;
            margin-left: 15px;
        }

        .nav a:hover {
            color: #b35e2e;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* FORM STYLES FOR DRAW SETUP */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #7b6856;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input {
            padding: 13px 15px;
            border: 2px solid #ded4c9;
            border-radius: 12px;
            font-size: 1rem;
            background: #faf8f5;
            outline: none;
        }

        input:focus {
            border-color: #b35e2e;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: .95rem;
        }

        .btn-save {
            background: #2b7a78;
            color: white;
        }

        .btn-save:hover {
            background: #205e5c;
        }

        .btn-start {
            background: #1f7a4b;
            color: white;
        }

        .btn-next {
            background: #b35e2e;
            color: white;
        }

        .btn-auto {
            background: #3878c7;
            color: white;
        }

        .btn-stop {
            background: #d29922;
            color: white;
        }

        .btn-reset {
            background: #b13e3e;
            color: white;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .status {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .status-box {
            background: #f6f1eb;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .status-box .label {
            color: #7b6856;
            font-size: .85rem;
            margin-bottom: 5px;
        }

        .status-box .value {
            font-size: 2rem;
            font-weight: 800;
            color: #2d1f14;
        }

        .last-number {
            font-size: 4rem !important;
            color: #b35e2e !important;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .drawn-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .number {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #b35e2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .number.latest {
            background: #1f7a4b;
            transform: scale(1.08);
        }

        .info {
            color: #7b6856;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .status {
                grid-template-columns: 1fr;
            }

            .nav {
                width: 100%;
            }

            .nav a {
                margin-left: 0;
                margin-right: 12px;
            }

            .last-number {
                font-size: 3rem !important;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>
            <i class="fas fa-shield-alt"></i>
            Tambola House — Admin
        </h1>

        <div class="nav">
            <a href="game.html">
                <i class="fas fa-gamepad"></i> Game Room
            </a>

            <a href="dashboard.html">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </div>
    </div>


    <!-- SETUP & CONFIGURATION -->

    <div class="card">
        <h2>
            <i class="fas fa-cog"></i>
            Draw Setup & Ticket Rules
        </h2>

        <form id="drawSetupForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="ticketPrice">Ticket Price (Tokens):</label>
                    <input type="number" id="ticketPrice" min="1" value="10" required>
                </div>

                <div class="form-group">
                    <label for="totalTickets">Total Available Tickets:</label>
                    <input type="number" id="totalTickets" min="1" max="600" value="100" required>
                </div>

                <div class="form-group">
                    <label for="prizeFullHouse">Full House Prize:</label>
                    <input type="number" id="prizeFullHouse" min="0" value="500" required>
                </div>

                <div class="form-group">
                    <label for="prizeTopLine">Top Line Prize:</label>
                    <input type="number" id="prizeTopLine" min="0" value="100" required>
                </div>

                <div class="form-group">
                    <label for="prizeMiddleLine">Middle Line Prize:</label>
                    <input type="number" id="prizeMiddleLine" min="0" value="100" required>
                </div>

                <div class="form-group">
                    <label for="prizeBottomLine">Bottom Line Prize:</label>
                    <input type="number" id="prizeBottomLine" min="0" value="100" required>
                </div>

                <div class="form-group">
                    <label for="prizeEarlyFive">Early 5 Prize:</label>
                    <input type="number" id="prizeEarlyFive" min="0" value="50" required>
                </div>
            </div>

            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i> Save Configuration
            </button>
        </form>
    </div>


    <!-- DRAW CONTROL -->

    <div class="card">

        <h2>
            <i class="fas fa-dice"></i>
            Draw Control
        </h2>

        <p class="info">
            The game state is stored in
            <strong>games / active_game</strong>.
            Both Admin and Game Room read the same document.
        </p>

        <br>

        <div id="firstPickControls">

            <div class="controls">

                <input
                    type="number"
                    id="firstNumber"
                    min="1"
                    max="90"
                    placeholder="First number 1-90"
                >

                <button
                    class="btn-start"
                    onclick="startGame()"
                >
                    <i class="fas fa-play"></i>
                    Start Game
                </button>

            </div>

        </div>


        <div
            id="drawControls"
            style="display:none;"
        >

            <div class="controls">

                <button
                    class="btn-next"
                    onclick="drawNext()"
                >
                    <i class="fas fa-bullhorn"></i>
                    Draw Next
                </button>

                <button
                    id="autoButton"
                    class="btn-auto"
                    onclick="startAutoDraw()"
                >
                    <i class="fas fa-forward"></i>
                    Auto Draw — 4s
                </button>

                <button
                    id="stopButton"
                    class="btn-stop"
                    onclick="stopAutoDraw()"
                    style="display:none;"
                >
                    <i class="fas fa-pause"></i>
                    Stop
                </button>

            </div>

        </div>


        <div class="status">

            <div class="status-box">

                <div class="label">
                    Last Drawn
                </div>

                <div
                    class="value last-number"
                    id="lastNumber"
                >
                    --
                </div>

            </div>


            <div class="status-box">

                <div class="label">
                    Numbers Drawn
                </div>

                <div
                    class="value"
                    id="drawnCount"
                >
                    0
                </div>

            </div>


            <div class="status-box">

                <div class="label">
                    Game Status
                </div>

                <div
                    class="value"
                    id="gameStatus"
                    style="font-size:1.3rem;"
                >
                    READY
                </div>

            </div>

        </div>


        <div
            id="message"
            class="message"
        ></div>

        <br>

        <button
            class="btn-reset"
            onclick="resetGame()"
        >
            <i class="fas fa-undo"></i>
            Reset Game
        </button>

    </div>


    <!-- DRAWN NUMBERS -->

    <div class="card">

        <h2>
            <i class="fas fa-list-ol"></i>
            Numbers Already Drawn
        </h2>

        <div
            id="drawnNumbers"
            class="drawn-list"
        >
            <span class="info">
                No numbers drawn yet.
            </span>
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",

    authDomain:
        "tambola-house-3dc56.firebaseapp.com",

    projectId:
        "tambola-house-3dc56",

    storageBucket:
        "tambola-house-3dc56.firebasestorage.app",

    messagingSenderId:
        "267918174188",

    appId:
        "1:267918174188:web:ec27684544c286c044c2c9"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const gameRef =
    db.collection("games").doc("active_game");


let autoTimer = null;


/* AUTH */

auth.onAuthStateChanged(async (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;

    }

    listenToGame();

});


/* SAVE DRAW & TICKET SETUP */

document.getElementById('drawSetupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const price = Number(document.getElementById('ticketPrice').value);
    const total = Number(document.getElementById('totalTickets').value);

    const prizes = {
        fullHouse: Number(document.getElementById('prizeFullHouse').value),
        topLine: Number(document.getElementById('prizeTopLine').value),
        middleLine: Number(document.getElementById('prizeMiddleLine').value),
        bottomLine: Number(document.getElementById('prizeBottomLine').value),
        earlyFive: Number(document.getElementById('prizeEarlyFive').value)
    };

    try {
        await gameRef.set({
            ticketPrice: price,
            totalTicketsAvailable: total,
            prizes: prizes,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        showMessage("Draw configuration saved successfully!", "success");
    } catch (error) {
        console.error("Error saving setup:", error);
        showMessage("Failed to save configuration: " + error.message, "error");
    }
});


/* GAME LISTENER */

function listenToGame() {

    gameRef.onSnapshot((doc) => {

        if (!doc.exists) {

            showMessage(
                "Game document does not exist.",
                "error"
            );

            return;

        }

        const data = doc.data();

        // Populate Setup Inputs if values exist in Firestore
        if (data.ticketPrice) document.getElementById("ticketPrice").value = data.ticketPrice;
        if (data.totalTicketsAvailable) document.getElementById("totalTickets").value = data.totalTicketsAvailable;
        if (data.prizes) {
            if (data.prizes.fullHouse !== undefined) document.getElementById("prizeFullHouse").value = data.prizes.fullHouse;
            if (data.prizes.topLine !== undefined) document.getElementById("prizeTopLine").value = data.prizes.topLine;
            if (data.prizes.middleLine !== undefined) document.getElementById("prizeMiddleLine").value = data.prizes.middleLine;
            if (data.prizes.bottomLine !== undefined) document.getElementById("prizeBottomLine").value = data.prizes.bottomLine;
            if (data.prizes.earlyFive !== undefined) document.getElementById("prizeEarlyFive").value = data.prizes.earlyFive;
        }

        updateAdminScreen(data);

    });

}


/* UPDATE ADMIN SCREEN */

function updateAdminScreen(data) {

    const drawn =
        data.drawnNumbers || [];

    document.getElementById("lastNumber")
        .textContent =
        data.lastDrawn || "--";

    document.getElementById("drawnCount")
        .textContent =
        drawn.length;

    document.getElementById("gameStatus")
        .textContent =
        (data.status || "ready").toUpperCase();


    if (data.isFirstDrawDone) {

        document.getElementById(
            "firstPickControls"
        ).style.display = "none";

        document.getElementById(
            "drawControls"
        ).style.display = "block";

    } else {

        document.getElementById(
            "firstPickControls"
        ).style.display = "block";

        document.getElementById(
            "drawControls"
        ).style.display = "none";

    }


    renderDrawnNumbers(drawn);


    if (drawn.length >= 90) {

        stopAutoDraw();

    }

}


/* CREATE SHUFFLED SEQUENCE */

function shuffledNumbers() {

    const numbers =
        Array.from(
            { length: 90 },
            (_, i) => i + 1
        );


    for (
        let i = numbers.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            numbers[i],
            numbers[j]
        ] = [
            numbers[j],
            numbers[i]
        ];

    }

    return numbers;

}


/* START GAME */

async function startGame() {

    const selected =
        Number(
            document.getElementById(
                "firstNumber"
            ).value
        );


    if (
        !selected ||
        selected < 1 ||
        selected > 90
    ) {

        showMessage(
            "Enter a number from 1 to 90.",
            "error"
        );

        return;

    }


    try {

        const sequence =
            shuffledNumbers();


        const index =
            sequence.indexOf(selected);


        [
            sequence[0],
            sequence[index]
        ] = [
            sequence[index],
            sequence[0]
        ];


        const first =
            sequence[0];


        await gameRef.set({

            status: "running",

            drawSequence:
                sequence,

            drawnNumbers:
                [first],

            lastDrawn:
                first,

            currentIndex:
                1,

            isFirstDrawDone:
                true,

            updatedAt:
                firebase.firestore.FieldValue
                    .serverTimestamp()

        }, { merge: true });


        document.getElementById(
            "firstNumber"
        ).value = "";


        showMessage(
            "Game started. First number: " +
            first,
            "success"
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "Unable to start game: " +
            error.message,
            "error"
        );

    }

}


/* DRAW NEXT */

async function drawNext() {

    try {

        await db.runTransaction(
            async (transaction) => {

                const doc =
                    await transaction.get(gameRef);


                if (!doc.exists) {

                    throw new Error(
                        "Game has not been initialized."
                    );

                }


                const data =
                    doc.data();


                if (!data.isFirstDrawDone) {

                    throw new Error(
                        "Start the game first."
                    );

                }


                const sequence =
                    data.drawSequence || [];


                const drawn =
                    data.drawnNumbers || [];


                const index =
                    data.currentIndex || 0;


                if (
                    index >= 90 ||
                    drawn.length >= 90
                ) {

                    throw new Error(
                        "All 90 numbers have been drawn."
                    );

                }


                const nextNumber =
                    sequence[index];


                const updatedDrawn =
                    [...drawn, nextNumber];


                transaction.update(
                    gameRef,
                    {

                        drawnNumbers:
                            updatedDrawn,

                        lastDrawn:
                            nextNumber,

                        currentIndex:
                            index + 1,

                        status:
                            updatedDrawn.length >= 90
                                ? "completed"
                                : "running",

                        updatedAt:
                            firebase.firestore.FieldValue
                                .serverTimestamp()

                    }
                );

            }
        );

    }

    catch (error) {

        console.error(error);

        stopAutoDraw();

        showMessage(
            error.message,
            "error"
        );

    }

}


/* AUTO DRAW */

function startAutoDraw() {

    if (autoTimer) return;


    document.getElementById(
        "autoButton"
    ).style.display = "none";


    document.getElementById(
        "stopButton"
    ).style.display = "inline-block";


    drawNext();


    autoTimer =
        setInterval(
            drawNext,
            4000
        );

}


/* STOP */

function stopAutoDraw() {

    if (autoTimer) {

        clearInterval(autoTimer);

        autoTimer = null;

    }


    document.getElementById(
        "autoButton"
    ).style.display = "inline-block";


    document.getElementById(
        "stopButton"
    ).style.display = "none";

}


/* RESET */

async function resetGame() {

    if (
        !confirm(
            "Reset the current game?"
        )
    ) {

        return;

    }


    stopAutoDraw();


    try {

        await gameRef.set({

            status:
                "ready",

            drawSequence:
                shuffledNumbers(),

            drawnNumbers:
                [],

            lastDrawn:
                null,

            currentIndex:
                0,

            isFirstDrawDone:
                false,

            updatedAt:
                firebase.firestore.FieldValue
                    .serverTimestamp()

        }, { merge: true });


        showMessage(
            "Game reset successfully.",
            "success"
        );

    }

    catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* DRAWN NUMBERS */

function renderDrawnNumbers(numbers) {

    const container =
        document.getElementById(
            "drawnNumbers"
        );


    if (!numbers.length) {

        container.innerHTML =
            '<span class="info">No numbers drawn yet.</span>';

        return;

    }


    container.innerHTML =
        numbers.map(
            (number, index) => {

                const latest =
                    index === numbers.length - 1
                        ? "latest"
                        : "";

                return `
                    <span class="number ${latest}">
                        ${number}
                    </span>
                `;

            }
        ).join("");

}


/* MESSAGE */

function showMessage(text, type) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent = text;

    element.className =
        "message show " + type;


    setTimeout(() => {

        element.classList.remove("show");

    }, 4000);

}

</script>

</body>
</html>
