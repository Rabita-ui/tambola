<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tambola House</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px 30px;
            background: #2d1f14;
            color: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
        }

        .back-btn {
            color: #e8e0d8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* SECTIONS */
        .panel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0d5c8;
        }

        .panel-title {
            font-size: 1.2rem;
            color: #2d1f14;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0ebe6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* TABLES */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        th {
            background: #f8f4f0;
            color: #7b6856;
            font-weight: 700;
        }

        /* BUTTONS & INPUTS */
        .btn-action {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn-approve {
            background: #1f7a4b;
            color: white;
        }

        .btn-approve:hover {
            opacity: 0.9;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"] {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
        }

        .btn-submit {
            background: #b35e2e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-completed {
            background: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h2><i class="fas fa-user-shield"></i> Admin Control Panel</h2>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <!-- MANUAL TOKEN CREDIT PANEL -->
    <div class="panel">
        <div class="panel-title"><i class="fas fa-coins" style="color: #b35e2e;"></i> Direct Token Adjustment</div>
        <p style="color: #7b6856; font-size: 0.9rem;">Manually add tokens to a specific user using their Firebase User ID (UID).</p>
        <div class="input-group">
            <input type="text" id="targetUid" placeholder="Enter User UID">
            <input type="number" id="tokenAmount" placeholder="Amount (e.g. 100)">
            <button class="btn-submit" onclick="addTokensToUser()">Add Tokens</button>
        </div>
    </div>

    <!-- DEPOSIT REQUESTS PANEL -->
    <div class="panel">
        <div class="panel-title"><i class="fas fa-file-invoice-dollar" style="color: #1f7a4b;"></i> Deposit Requests</div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>TXN ID</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="depositsTable">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #7b6856;">Loading deposit requests...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TICKET POOL SEEDER -->
    <div class="panel">
        <div class="panel-title"><i class="fas fa-ticket-alt" style="color: #b35e2e;"></i> Ticket Pool Management</div>
        <p style="color: #7b6856; font-size: 0.9rem; margin-bottom: 15px;">Generate 5 new random unbooked tickets for the market.</p>
        <button class="btn-submit" onclick="generateNewTickets()">Generate 5 New Tickets</button>
    </div>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    /* FIREBASE CONFIGURATION */
    const firebaseConfig = {
        apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
        authDomain: "tambola-house-3dc56.firebaseapp.com",
        projectId: "tambola-house-3dc56",
        storageBucket: "tambola-house-3dc56.firebasestorage.app",
        messagingSenderId: "267918174188",
        appId: "1:267918174188:web:ec27684544c286c044c2c9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    /* AUTH CHECK */
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        loadDepositRequests();
    });

    /* LOAD PENDING DEPOSIT REQUESTS */
    function loadDepositRequests() {
        db.collection("deposits").onSnapshot((snapshot) => {
            const table = document.getElementById("depositsTable");
            table.innerHTML = "";

            if (snapshot.empty) {
                table.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #7b6856;">No deposit requests found.</td></tr>`;
                return;
            }

            snapshot.forEach((doc) => {
                const dep = doc.data();
                const depId = doc.id;
                const isPending = dep.status === "pending";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${dep.userId || 'N/A'}</td>
                    <td><strong>${dep.amount} Tokens</strong></td>
                    <td>${dep.txnId || 'N/A'}</td>
                    <td><span class="${isPending ? 'badge-pending' : 'badge-completed'}">${dep.status.toUpperCase()}</span></td>
                    <td>
                        ${isPending ? `<button class="btn-action btn-approve" onclick="approveDeposit('${depId}', '${dep.userId}', ${dep.amount})">Approve</button>` : 'Approved'}
                    </td>
                `;
                table.appendChild(row);
            });
        });
    }

    /* APPROVE DEPOSIT REQUEST */
    async function approveDeposit(depId, userId, amount) {
        if (!confirm(`Approve deposit of ${amount} tokens for user ${userId}?`)) return;

        try {
            const userRef = db.collection("users").doc(userId);
            const depRef = db.collection("deposits").doc(depId);

            await db.runTransaction(async (transaction) => {
                const userDoc = await transaction.get(userRef);
                const currentTokens = userDoc.exists ? (userDoc.data().tokens || 0) : 0;

                transaction.update(userRef, { tokens: currentTokens + Number(amount) });
                transaction.update(depRef, { status: "approved" });
            });

            alert("Deposit approved and tokens credited successfully!");
        } catch (err) {
            console.error("Approval error:", err);
            alert("Failed to approve deposit: " + err.message);
        }
    }

    /* ADD TOKENS DIRECTLY */
    async function addTokensToUser() {
        const uid = document.getElementById("targetUid").value.trim();
        const amount = Number(document.getElementById("tokenAmount").value);

        if (!uid || !amount || amount <= 0) {
            alert("Please provide a valid UID and Token Amount.");
            return;
        }

        try {
            const userRef = db.collection("users").doc(uid);
            const userDoc = await userRef.get();

            if (!userDoc.exists) {
                alert("User UID not found in Firestore.");
                return;
            }

            const currentTokens = userDoc.data().tokens || 0;
            await userRef.update({ tokens: currentTokens + amount });

            alert(`Successfully added ${amount} tokens. New balance: ${currentTokens + amount}`);
            document.getElementById("targetUid").value = "";
            document.getElementById("tokenAmount").value = "";
        } catch (err) {
            console.error("Token add error:", err);
            alert("Error updating tokens: " + err.message);
        }
    }

    /* GENERATE BATCH TICKETS */
    async function generateNewTickets() {
        try {
            const batch = db.batch();
            for (let i = 0; i < 5; i++) {
                const id = `TICKET-${Math.floor(1000 + Math.random() * 9000)}`;
                const ref = db.collection("tickets").doc(id);
                batch.set(ref, {
                    ownerId: null,
                    price: 10,
                    drawId: "draw_001",
                    numbers: generateTambolaNumbers()
                });
            }
            await batch.commit();
            alert("5 new tickets added to the booking pool!");
        } catch (err) {
            console.error("Ticket generation error:", err);
            alert("Error generating tickets: " + err.message);
        }
    }

    /* GENERATE TAMBOLA GRID */
    function generateTambolaNumbers() {
        const grid = [];
        for (let row = 0; row < 3; row++) {
            const rowData = Array(9).fill(null);
            const positions = [];
            while (positions.length < 5) {
                const pos = Math.floor(Math.random() * 9);
                if (!positions.includes(pos)) positions.push(pos);
            }
            positions.forEach(col => {
                let min = col === 0 ? 1 : col * 10;
                let max = col === 8 ? 90 : col * 10 + 9;
                rowData[col] = Math.floor(Math.random() * (max - min + 1)) + min;
            });
            grid.push(rowData);
        }
        return grid;
    }
</script>
</body>
</html>
