<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tambola House</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f3ee, #e9e1d7);
            color: #2d1f14;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header h1 i {
            color: #b35e2e;
        }

        .nav a {
            text-decoration: none;
            color: #7b6856;
            font-weight: 600;
            margin-left: 15px;
        }

        .nav a:hover {
            color: #b35e2e;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #2d1f14;
        }

        .current-number {
            font-size: 4rem;
            font-weight: 800;
            color: #b35e2e;
            text-align: center;
            padding: 10px;
            background: #f6f1eb;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: .9rem;
            background: #b35e2e;
            color: white;
            flex: 1;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background: #c0392b;
        }

        .btn-approve {
            background: #1f7a4b;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-reject {
            background: #c0392b;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        /* CLAIM LIST STYLES */
        .claim-card {
            background: #faf8f5;
            border: 1px solid #ded4c9;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .claim-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .claim-title {
            font-weight: 800;
            color: #b35e2e;
        }

        .claim-user {
            font-size: 0.85rem;
            color: #7b6856;
        }

        .empty-claims {
            text-align: center;
            color: #a89a8c;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 850px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>
            <i class="fas fa-shield-alt"></i>
            Tambola House — Admin Panel
        </h1>

        <div class="nav">
            <a href="game.html">
                <i class="fas fa-gamepad"></i> Game Room
            </a>
            <a href="dashboard.html">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="grid-layout">
        
        <!-- LEFT PANEL: DRAW CONTROLS -->
        <div>
            <div class="card">
                <h2><i class="fas fa-play-circle"></i> Live Controller</h2>
                
                <div class="current-number" id="lastDrawn">--</div>

                <div class="btn-group">
                    <button onclick="drawNextNumber()"><i class="fas fa-dice"></i> Draw Number</button>
                    <button class="btn-reset" onclick="resetGame()"><i class="fas fa-redo"></i> Reset Game</button>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-history"></i> Recent Drawn Numbers</h2>
                <div id="drawnList" style="word-break: break-all; line-height: 1.6; font-weight: 600; color: #7b6856;">
                    None yet.
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: CLAIM APPROVAL INBOX -->
        <div>
            <div class="card">
                <h2><i class="fas fa-bell"></i> Live Player Claims (<span id="claimCount">0</span>)</h2>
                <div id="claimsContainer">
                    <div class="empty-claims">No pending claims.</div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
    authDomain: "tambola-house-3dc56.firebaseapp.com",
    projectId: "tambola-house-3dc56",
    storageBucket: "tambola-house-3dc56.firebasestorage.app",
    messagingSenderId: "267918174188",
    appId: "1:267918174188:web:ec27684544c286c044c2c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const gameRef = db.collection("games").doc("active_game");

let activeDrawn = [];
let activeClaims = [];

window.addEventListener('DOMContentLoaded', () => {
    listenToGame();
});

/* FIRESTORE REALTIME LISTENER */
function listenToGame() {
    gameRef.onSnapshot((doc) => {
        if (!doc.exists) {
            initGameDoc();
            return;
        }

        const data = doc.data();
        activeDrawn = data.drawnNumbers || [];
        activeClaims = data.claims || [];

        document.getElementById("lastDrawn").textContent = data.lastDrawn || "--";
        document.getElementById("drawnList").textContent = activeDrawn.join(", ") || "None yet.";

        renderClaims();
    });
}

/* INITIALIZE GAME DOC IF MISSING */
async function initGameDoc() {
    await gameRef.set({
        drawnNumbers: [],
        lastDrawn: null,
        status: "active",
        claims: [],
        prizes: {
            fullHouse: 100,
            topLine: 30,
            middleLine: 30,
            bottomLine: 30,
            earlyFive: 20
        }
    });
}

/* DRAW RANDOM NUMBER (1-90) */
async function drawNextNumber() {
    if (activeDrawn.length >= 90) {
        alert("All numbers have been drawn!");
        return;
    }

    let next;
    do {
        next = Math.floor(Math.random() * 90) + 1;
    } while (activeDrawn.includes(next));

    await gameRef.update({
        drawnNumbers: firebase.firestore.FieldValue.arrayUnion(next),
        lastDrawn: next,
        status: "active"
    });
}

/* RESET GAME STATE */
async function resetGame() {
    if (confirm("Are you sure you want to reset the current game state?")) {
        await gameRef.update({
            drawnNumbers: [],
            lastDrawn: null,
            status: "ready",
            claims: []
        });
    }
}

/* RENDER PENDING CLAIMS */
function renderClaims() {
    const container = document.getElementById("claimsContainer");
    document.getElementById("claimCount").textContent = activeClaims.length;

    if (activeClaims.length === 0) {
        container.innerHTML = '<div class="empty-claims">No pending claims.</div>';
        return;
    }

    container.innerHTML = "";
    activeClaims.forEach((claim, idx) => {
        const div = document.createElement("div");
        div.className = "claim-card";
        div.innerHTML = `
            <div class="claim-info">
                <span class="claim-title">${claim.claimName}</span>
                <span class="claim-user">${claim.userEmail}</span>
            </div>
            <div style="display: flex; gap: 5px;">
                <button class="btn-approve" onclick="resolveClaim(${idx}, true)">Approve</button>
                <button class="btn-reject" onclick="resolveClaim(${idx}, false)">Reject</button>
            </div>
        `;
        container.appendChild(div);
    });
}

/* APPROVE OR REJECT CLAIM */
async function resolveClaim(index, isApproved) {
    const targetClaim = activeClaims[index];
    
    // Remove claim from array
    await gameRef.update({
        claims: firebase.firestore.FieldValue.arrayRemove(targetClaim)
    });

    if (isApproved) {
        alert(`Claim approved for ${targetClaim.userEmail} (${targetClaim.claimName})!`);
    } else {
        alert(`Claim rejected for ${targetClaim.userEmail}.`);
    }
}
</script>

</body>
</html>
