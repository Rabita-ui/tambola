<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola House - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }
        .navbar h1 { font-size: 1.8em; }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .admin-card h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .create-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .create-btn:hover { transform: scale(1.02); }
        .game-list {
            margin-top: 20px;
        }
        .game-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-item .status {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-active { background: #27ae60; color: white; }
        .status-waiting { background: #f39c12; color: white; }
        .status-ended { background: #95a5a6; color: white; }
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .action-btn:hover { transform: scale(1.05); }
        .btn-start { background: #27ae60; color: white; }
        .btn-end { background: #e74c3c; color: white; }
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .no-access {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }
        .no-access h2 { font-size: 2em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 Tambola House</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="game.html">Join Game</a>
            <a href="book.html">My Books</a>
            <a href="deposit.html">Deposit</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <div id="adminContent">
            <div class="admin-card">
                <h2>🎮 Create New Game</h2>
                <div class="form-group">
                    <label>Game Name</label>
                    <input type="text" id="gameName" placeholder="Enter game name" value="Tambola Game">
                </div>
                <div class="form-group">
                    <label>Ticket Price (₹)</label>
                    <input type="number" id="ticketPrice" value="10" min="1">
                </div>
                <div class="form-group">
                    <label>Prize Pool (₹)</label>
                    <input type="number" id="prizePool" value="100" min="10">
                </div>
                <button class="create-btn" id="createGameBtn">🚀 Create Game</button>
            </div>

            <div class="admin-card">
                <h2>📋 Active Games</h2>
                <div id="gameList" class="game-list"></div>
            </div>
        </div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, db, collection, addDoc, getDocs, updateDoc, doc, query, where, onSnapshot, Timestamp } from './firebase-config.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Check if user is admin
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists() || userDoc.data().role !== 'admin') {
                document.getElementById('adminContent').innerHTML = `
                    <div class="no-access">
                        <h2>⛔ Access Denied</h2>
                        <p>You don't have admin privileges.</p>
                    </div>
                `;
                return;
            }

            loadGames();
        });

        document.getElementById('createGameBtn').addEventListener('click', async () => {
            const name = document.getElementById('gameName').value;
            const ticketPrice = parseInt(document.getElementById('ticketPrice').value);
            const prizePool = parseInt(document.getElementById('prizePool').value);

            if (!name || !ticketPrice || !prizePool) {
                alert('Please fill in all fields');
                return;
            }

            try {
                await addDoc(collection(db, 'game_session'), {
                    name: name,
                    ticketPrice: ticketPrice,
                    prizePool: prizePool,
                    status: 'waiting',
                    players: 0,
                    createdAt: Timestamp.now(),
                    createdBy: auth.currentUser.uid
                });

                alert('✅ Game created successfully!');
                document.getElementById('gameName').value = 'Tambola Game';
                document.getElementById('ticketPrice').value = '10';
                document.getElementById('prizePool').value = '100';
                loadGames();

            } catch (error) {
                console.error('Error creating game:', error);
                alert('Error creating game: ' + error.message);
            }
        });

        function loadGames() {
            const gamesRef = collection(db, 'game_session');
            const q = query(gamesRef, where('status', 'in', ['waiting', 'active']));
            
            onSnapshot(q, (snapshot) => {
                const gameList = document.getElementById('gameList');
                gameList.innerHTML = '';

                if (snapshot.empty) {
                    gameList.innerHTML = '<p style="color:#666;text-align:center;">No active games</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const game = doc.data();
                    const gameId = doc.id;
                    
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.innerHTML = `
                        <div>
                            <strong>${game.name}</strong>
                            <span class="status status-${game.status}">${game.status.toUpperCase()}</span>
                            <div style="font-size:0.9em;color:#666;margin-top:5px;">
                                👥 ${game.players || 0} players | 💰 ₹${game.prizePool || 0}
                            </div>
                        </div>
                        <div>
                            ${game.status === 'waiting' ? `
                                <button class="action-btn btn-start" data-gameid="${gameId}">▶ Start</button>
                            ` : ''}
                            ${game.status === 'active' ? `
                                <button class="action-btn btn-end" data-gameid="${gameId}">⏹ End</button>
                            ` : ''}
                        </div>
                    `;
                    gameList.appendChild(item);
                });

                // Add event listeners
                document.querySelectorAll('.btn-start').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const gameId = btn.dataset.gameid;
                        if (confirm('Start this game?')) {
                            await updateDoc(doc(db, 'game_session', gameId), {
                                status: 'active',
                                startedAt: Timestamp.now()
                            });
                            loadGames();
                        }
                    });
                });

                document.querySelectorAll('.btn-end').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const gameId = btn.dataset.gameid;
                        if (confirm('End this game?')) {
                            await updateDoc(doc(db, 'game_session', gameId), {
                                status: 'ended',
                                endedAt: Timestamp.now()
                            });
                            loadGames();
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
