<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Host Control - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .board-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; max-width: 100%; }
        .board-cell { aspect-ratio: 1; background: #fff; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; border-radius: 3px; }
        .board-cell.called { background: #28a745; color: white; }
        .board-cell.current { background: #ffc107; color: black; font-size: 1.1rem; }
        .current-call-box { font-size: 2.5rem; font-weight: bold; background: #343a40; color: #ffc107; text-align: center; border-radius: 8px; padding: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Dashboard & Host Panel</h2>
            <button id="btn-logout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>

        <div class="row">
            <!-- Left Column: Game Creation & Requests -->
            <div class="col-lg-5">
                <!-- Game Creation Form -->
                <div class="card p-3">
                    <h4>Create New Game</h4>
                    <div class="mb-3">
                        <label for="game-start-time" class="form-label">Start Time</label>
                        <input type="datetime-local" id="game-start-time" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="game-prizes" class="form-label">Prizes (e.g. 10,10,10,50)</label>
                        <input type="text" id="game-prizes" placeholder="10,10,10,50" class="form-control">
                    </div>
                    <button id="btn-create-game" class="btn btn-primary w-100">Create & Initialize Game</button>
                </div>

                <!-- Approvals Section -->
                <div class="card p-3">
                    <h4>Token Requests Approval</h4>
                    <div id="token-requests-container">
                        <p class="text-muted">Loading requests...</p>
                    </div>
                </div>

                <div class="card p-3">
                    <h4>Withdrawal Requests Approval</h4>
                    <div id="withdrawal-requests-container">
                        <p class="text-muted">Loading requests...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Host Controls & Master Board -->
            <div class="col-lg-7">
                <div class="card p-3 border-danger">
                    <h4 class="text-danger">Live Game Host Controls</h4>
                    
                    <div class="current-call-box mb-3">
                        <div style="font-size: 0.9rem; color: #fff;">CURRENT NUMBER</div>
                        <div id="current-number-display">--</div>
                    </div>

                    <div id="game-status-text" class="fw-bold mb-3 text-center text-muted">GAME PAUSED / STOPPED</div>

                    <div class="mb-3">
                        <label for="start-number-select" class="form-label">Start Position in Sequence</label>
                        <select id="start-number-select" class="form-control"></select>
                    </div>

                    <div class="mb-3">
                        <label for="call-interval" class="form-label">Call Interval (Seconds)</label>
                        <input type="number" id="call-interval" value="5" min="1" max="30" class="form-control">
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <button id="btn-start-game" class="btn btn-success">▶ Start Draw</button>
                        <button id="btn-pause-game" class="btn btn-warning">⏸ Pause Draw</button>
                        <button id="btn-reset-game" class="btn btn-danger">🔄 Reset Board</button>
                    </div>

                    <h5 class="text-center">Master Board (1-90)</h5>
                    <div id="master-board" class="board-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, doc, setDoc, getDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let callTimer = null;

        function generateFixedSequence() {
            let nums = Array.from({length: 90}, (_, i) => i + 1);
            let seed = 987654321;
            for (let i = nums.length - 1; i > 0; i--) {
                let x = Math.sin(seed++) * 10000;
                let j = Math.floor((x - Math.floor(x)) * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            return nums;
        }

        const FIXED_SEQUENCE = generateFixedSequence();

        // Build Master Board UI
        const boardEl = document.getElementById('master-board');
        for (let i = 1; i <= 90; i++) {
            const cell = document.createElement('div');
            cell.className = 'board-cell';
            cell.id = `board-${i}`;
            cell.innerText = i;
            boardEl.appendChild(cell);
        }

        // Populate Sequence Select Dropdown
        const selectEl = document.getElementById('start-number-select');
        FIXED_SEQUENCE.forEach((num, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `Number ${num} (Position #${index + 1})`;
            selectEl.appendChild(opt);
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                listenToGameState();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        });

        document.getElementById('btn-create-game').addEventListener('click', async () => {
            const startTime = document.getElementById('game-start-time').value;
            const prizes = document.getElementById('game-prizes').value;

            if (!startTime || !prizes) {
                alert("Please fill out all game fields.");
                return;
            }

            try {
                await setDoc(doc(db, "games", "active_game"), {
                    startTime: startTime,
                    prizes: prizes,
                    status: "upcoming",
                    createdAt: new Date().toISOString(),
                    currentNumber: "--",
                    calledNumbers: [],
                    isRunning: false
                }, { merge: true });

                alert("Game created and initialized successfully!");
            } catch (err) {
                console.error("Error creating game:", err);
                alert("Failed to create game: " + err.message);
            }
        });

        function listenToGameState() {
            onSnapshot(doc(db, "games", "active_game"), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                const calledNumbers = data.calledNumbers || [];
                const currentNum = data.currentNumber || "--";
                const isRunning = data.isRunning || false;

                document.getElementById('current-number-display').innerText = currentNum;
                document.getElementById('game-status-text').innerText = isRunning ? "🔴 GAME IN PROGRESS" : "⏸ GAME PAUSED / STOPPED";

                for (let i = 1; i <= 90; i++) {
                    const el = document.getElementById(`board-${i}`);
                    el.classList.remove('called', 'current');
                    if (calledNumbers.includes(i)) {
                        el.classList.add('called');
                    }
                }

                if (currentNum !== "--" && document.getElementById(`board-${currentNum}`)) {
                    document.getElementById(`board-${currentNum}`).classList.add('current');
                }
            });
        }

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            try {
                const startIndex = parseInt(selectEl.value) || 0;
                const intervalSec = parseInt(document.getElementById('call-interval').value) || 5;
                let currentIndex = startIndex;
                let calledNumbers = [];

                clearInterval(callTimer);
                
                await setDoc(doc(db, "games", "active_game"), {
                    isRunning: true,
                    startIndex: startIndex,
                    intervalSec: intervalSec,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });

                callTimer = setInterval(async () => {
                    if (currentIndex >= FIXED_SEQUENCE.length) {
                        clearInterval(callTimer);
                        alert("All 90 numbers called!");
                        return;
                    }

                    const numToCall = FIXED_SEQUENCE[currentIndex];
                    calledNumbers.push(numToCall);

                    await setDoc(doc(db, "games", "active_game"), {
                        currentNumber: numToCall,
                        calledNumbers: calledNumbers,
                        isRunning: true
                    }, { merge: true });

                    currentIndex++;
                }, intervalSec * 1000);
            } catch (error) {
                console.error("Start Game Error:", error);
                alert("Failed to start game: " + error.message);
            }
        });

        document.getElementById('btn-pause-game').addEventListener('click', async () => {
            clearInterval(callTimer);
            await setDoc(doc(db, "games", "active_game"), { isRunning: false }, { merge: true });
        });

        document.getElementById('btn-reset-game').addEventListener('click', async () => {
            if (!confirm("Reset game board for everyone?")) return;
            clearInterval(callTimer);
            await setDoc(doc(db, "games", "active_game"), {
                currentNumber: "--",
                calledNumbers: [],
                isRunning: false
            });
        });

        // Load Token Requests
        const tokenContainer = document.getElementById('token-requests-container');
        onSnapshot(collection(db, "token_requests"), (snapshot) => {
            if (snapshot.empty) {
                tokenContainer.innerHTML = "<p class='text-muted'>No pending token requests.</p>";
                return;
            }
            tokenContainer.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const req = docSnap.data();
                const div = document.createElement('div');
                div.className = "d-flex justify-content-between align-items-center border-bottom py-2";
                div.innerHTML = `<span>User: ${req.userId || 'Unknown'} - Amt: ${req.amount || 0}</span>
                                 <button class="btn btn-success btn-sm" onclick="approveToken('${docSnap.id}', '${req.userId}', ${req.amount || 0})">Approve</button>`;
                tokenContainer.appendChild(div);
            });
        }, (error) => {
            console.error("Error loading token requests:", error);
            tokenContainer.innerHTML = `<p class='text-danger'>Error loading requests: ${error.message}</p>`;
        });

        window.approveToken = async function(reqId, userId, amount) {
            try {
                if (!userId || userId === 'undefined') {
                    alert("Error: User ID is missing from this request!");
                    return;
                }

                const userRef = doc(db, "users", userId);
                const userSnap = await getDoc(userRef);

                let currentWallet = 0;
                if (userSnap.exists()) {
                    currentWallet = Number(userSnap.data().wallet) || 0;
                }

                const newWalletBalance = currentWallet + Number(amount);

                await setDoc(userRef, {
                    wallet: newWalletBalance
                }, { merge: true });

                await deleteDoc(doc(db, "token_requests", reqId));

                alert(`Successfully approved and credited ${amount} tokens to user!`);
            } catch (err) {
                console.error("Approval & Credit Error:", err);
                alert("Failed to credit tokens: " + err.message);
            }
        };
    </script>
</body>
</html>
