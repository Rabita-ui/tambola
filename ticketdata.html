<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Data - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tickets-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-height: 500px; overflow-y: auto; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid #ddd; }
        .ticket-box { border: 1px solid #007bff; border-radius: 6px; padding: 10px; background: #fdfdfd; font-size: 0.8rem; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: #333; border: 1px solid #333; margin-top: 5px; }
        .cell { background: #fff; height: 22px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75rem; }
        .cell.empty { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Game Draws & Tickets</h2>
            <div class="d-flex gap-2">
                <a href="book.html" class="btn btn-primary btn-sm">Book Tickets</a>
                <a href="user.html" class="btn btn-secondary btn-sm">Dashboard</a>
            </div>
        </div>

        <div id="games-ticket-sections">
            <p class="text-muted">Loading game records...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadGamesAndTickets();
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadGamesAndTickets() {
            const container = document.getElementById('games-ticket-sections');
            const urlParams = new URLSearchParams(window.location.search);
            const targetGameId = urlParams.get('gameId');

            try {
                const gamesQuery = query(collection(db, "games"), orderBy("createdAt", "desc"));
                const gamesSnap = await getDocs(gamesQuery);

                if (gamesSnap.empty) {
                    container.innerHTML = "<p class='text-muted'>No games available.</p>";
                    return;
                }

                const ticketsSnap = await getDocs(collection(db, "booked_tickets"));
                const allTickets = ticketsSnap.docs.map(doc => doc.data());

                container.innerHTML = "";
                const now = new Date();

                gamesSnap.forEach(gameDoc => {
                    const gameData = gameDoc.data();
                    const gameId = gameDoc.id;

                    // If a specific gameId was clicked from book.html, highlight or filter it
                    if (targetGameId && targetGameId !== gameId) return;

                    const startTime = new Date(gameData.startTime);
                    const isPast = startTime <= now;
                    const headerColor = isPast ? "text-danger" : "text-primary";
                    const badgeText = isPast ? "<span class='badge bg-danger'>Past / Finished</span>" : "<span class='badge bg-primary'>Upcoming</span>";

                    const gameTickets = allTickets.filter(t => t.gameId === gameId);

                    let section = document.createElement('div');
                    section.className = "card p-3 mb-4";
                    
                    let ticketsHtml = "";
                    if (gameTickets.length === 0) {
                        ticketsHtml = "<p class='text-muted'>No tickets booked for this game yet.</p>";
                    } else {
                        ticketsHtml = `<div class="tickets-container">`;
                        gameTickets.forEach(ticket => {
                            const numbersArray = ticket.numbersString ? ticket.numbersString.split(',') : Array(27).fill(0);
                            ticketsHtml += `
                                <div class="ticket-box">
                                    <div class="fw-bold text-danger mb-1">Ticket #${ticket.ticketNo} <span class="text-muted fw-normal" style="font-size: 0.7rem;">(${ticket.email || 'User'})</span></div>
                                    <div class="ticket-grid">
                            `;
                            for (let idx = 0; idx < 27; idx++) {
                                let val = numbersArray[idx];
                                let displayVal = (val === "0" || !val) ? "" : val;
                                ticketsHtml += `<div class="cell ${displayVal === "" ? "empty" : ""}">${displayVal}</div>`;
                            }
                            ticketsHtml += `</div></div>`;
                        });
                        ticketsHtml += `</div>`;
                    }

                    section.innerHTML = `
                        <h4 class="${headerColor}">Draw Time: ${startTime.toLocaleString()} ${badgeText}</h4>
                        <p class="mb-2"><strong>Prizes:</strong> ${gameData.prizes} | <strong>Total Booked Tickets:</strong> ${gameTickets.length}</p>
                        ${ticketsHtml}
                    `;
                    container.appendChild(section);
                });

                if (targetGameId && container.innerHTML === "") {
                    container.innerHTML = "<p class='text-warning'>Selected game not found or has expired.</p>";
                }

            } catch (err) {
                console.error("Error loading ticket data:", err);
                container.innerHTML = "<p class='text-danger'>Failed to load ticket records.</p>";
            }
        }
    </script>
</body>
</html>
