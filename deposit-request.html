<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Request - Tambola House</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 215, 175, 0.2);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #7b6856;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .back-btn:hover {
            color: #2d1f14;
        }

        h2 {
            color: #2d1f14;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7b6856;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2d1f14;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0d5c8;
            border-radius: 16px;
            font-size: 1rem;
            transition: 0.3s;
            background: #faf8f6;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #b35e2e;
            outline: none;
            box-shadow: 0 0 0 4px rgba(179, 94, 46, 0.1);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #1f7a4b;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #16633b;
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info-box {
            background: #f0faf5;
            border: 1px solid #d4edc9;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-box i {
            color: #1f7a4b;
            font-size: 1.5rem;
        }

        .info-box .info-text {
            color: #1f5a3b;
            font-size: 0.95rem;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0ebe6;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .amount {
            font-weight: 700;
            color: #2d1f14;
        }

        .history-item .status {
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.approved {
            background: #d4edc9;
            color: #1f5a3b;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            background: #1f7a4b;
            color: white;
        }

        .toast.error {
            background: #b13e3e;
            color: white;
        }

        .toast.info {
            background: #2d1f14;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>

            <h2><i class="fas fa-coins"></i> Request Deposit</h2>
            <p class="subtitle">Submit a deposit request for admin approval</p>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <div class="info-text">
                    <strong>How it works:</strong> Submit a deposit request with the amount. Admin will review and approve it. You'll receive tokens once approved.
                </div>
            </div>

            <form id="depositForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Your Email</label>
                    <input type="email" id="userEmail" readonly style="background: #f0ebe6;">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Amount (Tokens)</label>
                    <input type="number" id="amount" placeholder="Enter amount (e.g., 100)" required min="10" step="10">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-credit-card"></i> Payment Method</label>
                    <select id="paymentMethod" required>
                        <option value="">Select payment method</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="PayPal">PayPal</option>
                        <option value="Google Pay">Google Pay</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-comment"></i> Notes (Optional)</label>
                    <textarea id="notes" placeholder="Any additional information..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Submit Request
                </button>
            </form>

            <div class="history-section">
                <h3 style="margin-bottom: 15px; color: #2d1f14;">Recent Requests</h3>
                <div id="historyList">
                    <p style="color: #7b6856; text-align: center; padding: 20px;">Loading history...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTGFdmmimUbpm1zrTqaSQBO0kr2LcWs8M",
            authDomain: "mbolahouse.firebaseapp.com",
            projectId: "mbolahouse",
            storageBucket: "mbolahouse.firebasestorage.app",
            messagingSenderId: "842446053948",
            appId: "1:842446053948:web:b977bef8d84e85375f9939",
            measurementId: "G-DP949M05J1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMessage.textContent = message;
            
            toast.className = 'toast';
            if (type === 'success') {
                toast.classList.add('success');
                toastIcon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                toast.classList.add('error');
                toastIcon.className = 'fas fa-exclamation-circle';
            } else {
                toast.classList.add('info');
                toastIcon.className = 'fas fa-info-circle';
            }
            
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmail').value = user.email;
                loadHistory();
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseInt(document.getElementById('amount').value);
            const paymentMethod = document.getElementById('paymentMethod').value;
            const notes = document.getElementById('notes').value;

            if (!amount || amount < 10) {
                showToast('Please enter a valid amount (minimum 10 tokens)', 'error');
                return;
            }

            if (!paymentMethod) {
                showToast('Please select a payment method', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            try {
                await db.collection('depositRequests').add({
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    amount: amount,
                    paymentMethod: paymentMethod,
                    notes: notes,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('✅ Deposit request submitted! Awaiting admin approval.', 'success');
                document.getElementById('depositForm').reset();
                loadHistory();

            } catch (error) {
                console.error('Error submitting deposit:', error);
                showToast('Error submitting request: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
            }
        });

        async function loadHistory() {
            try {
                const snapshot = await db.collection('depositRequests')
                    .where('userId', '==', currentUser?.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .get();

                const historyList = document.getElementById('historyList');
                
                if (snapshot.empty) {
                    historyList.innerHTML = '<p style="color: #7b6856; text-align: center; padding: 20px;">No deposit requests yet</p>';
                    return;
                }

                historyList.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    
                    const statusClass = data.status || 'pending';
                    const statusText = data.status === 'pending' ? 'Pending' : 
                                     data.status === 'approved' ? '✅ Approved' : '❌ Rejected';
                    
                    item.innerHTML = `
                        <div>
                            <div class="amount">${data.amount} Tokens</div>
                            <div style="font-size: 0.85rem; color: #7b6856;">${data.paymentMethod}</div>
                        </div>
                        <div>
                            <span class="status ${statusClass}">${statusText}</span>
                            <div style="font-size: 0.7rem; color: #7b6856; margin-top: 4px;">
                                ${data.createdAt?.toDate?.()?.toLocaleDateString() || 'Just now'}
                            </div>
                        </div>
                    `;
                    historyList.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Refresh history every 30 seconds
        setInterval(loadHistory, 30000);
    </script>
</body>
</html>
