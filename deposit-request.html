<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Request - Tambola House</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; 
        }

        body { 
            background: #121417; 
            color: #e1e3e6; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        .card { 
            background: #1c1f24; 
            border: 1px solid #2d3239; 
            border-radius: 12px; 
            padding: 30px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .card h2 { 
            margin-bottom: 8px; 
            color: #ffffff; 
            font-size: 1.4rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .card p { 
            color: #8b949e; 
            font-size: 0.9rem; 
            margin-bottom: 20px; 
            line-height: 1.4;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #a0a6b0; 
            margin-bottom: 6px; 
            font-weight: 600; 
        }

        input { 
            width: 100%; 
            background: #121417; 
            border: 1px solid #2d3239; 
            color: #ffffff; 
            padding: 12px 14px; 
            border-radius: 6px; 
            outline: none; 
            font-size: 0.95rem; 
            transition: border-color 0.2s;
        }

        input:focus { 
            border-color: #388bfd; 
        }

        .btn-submit { 
            width: 100%; 
            background: #238636; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 1rem; 
            margin-top: 10px; 
            transition: background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover { 
            background: #2ea043; 
        }

        .btn-submit:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
        }

        .back-link { 
            display: inline-flex; 
            align-items: center;
            gap: 6px;
            margin-top: 20px; 
            color: #388bfd; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600;
        }

        .back-link:hover { 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-coins" style="color: #238636;"></i> Request Token Deposit</h2>
    <p>Provide your payment details to submit a token deposit request for admin approval.</p>

    <form id="depositForm">
        <div class="form-group">
            <label for="depositAmount">Amount of Tokens</label>
            <input type="number" id="depositAmount" placeholder="e.g. 50" min="1" required>
        </div>
        <div class="form-group">
            <label for="txnId">Transaction ID / UTR / Ref No.</label>
            <input type="text" id="txnId" placeholder="Enter Transaction ID" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Submit Deposit Request
        </button>
    </form>

    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    /* FIREBASE INITIALIZATION */
    const firebaseConfig = {
        apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
        authDomain: "tambola-house-3dc56.firebaseapp.com",
        projectId: "tambola-house-3dc56",
        storageBucket: "tambola-house-3dc56.firebasestorage.app",
        messagingSenderId: "267918174188",
        appId: "1:267918174188:web:ec27684544c286c044c2c9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    /* AUTHENTICATION GUARD */
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "login.html";
        }
    });

    /* FORM SUBMISSION EVENT LISTENER */
    document.getElementById("depositForm").addEventListener("submit", async (e) => {
        e.preventDefault(); // Prevents page reload

        const user = auth.currentUser;
        if (!user) {
            alert("Session expired. Please log in again.");
            window.location.href = "login.html";
            return;
        }

        const amountInput = document.getElementById("depositAmount");
        const txnInput = document.getElementById("txnId");
        const submitBtn = document.getElementById("submitBtn");

        const amount = Number(amountInput.value);
        const txnId = txnInput.value.trim();

        if (!amount || amount <= 0 || !txnId) {
            alert("Please provide a valid token amount and transaction ID.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Submitting...`;

        try {
            /* WRITE TO FIRESTORE DEPOSITS COLLECTION */
            await db.collection("deposits").add({
                userId: user.uid,
                userEmail: user.email || "N/A",
                amount: amount,
                txnId: txnId,
                status: "pending",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Deposit request submitted successfully! It will now appear in admin.html for approval.");
            document.getElementById("depositForm").reset();

        } catch (err) {
            console.error("Submission Error:", err);
            alert("Failed to submit request: " + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fas fa-paper-plane"></i> Submit Deposit Request`;
        }
    });
</script>
</body>
</html>
