<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Tambola House</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input, button { padding: 12px; margin: 8px 0; display: block; width: 100%; box-sizing: border-box; border-radius: 4px; }
        input { border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .register-btn { background: #28a745; }
        .register-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to Tambola House</h1>
        <p>Your ultimate destination for live Housie games! Please log in or register to join the fun.</p>
        <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-password" placeholder="Password">
        <button id="btn-login">Login</button>
        <button id="btn-register" class="register-btn">Register New Account</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
            authDomain: "tambola-house-3dc56.firebaseapp.com",
            projectId: "tambola-house-3dc56",
            storageBucket: "tambola-house-3dc56.firebasestorage.app",
            messagingSenderId: "267918174188",
            appId: "1:267918174188:web:0bf6b47282f1b14d44c2c9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Auto-redirect if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "user.html";
            }
        });

        // Register Action
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            if(!email || !pass) return alert("Please enter email and password.");
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", cred.user.uid), { 
                    email: email, 
                    role: 'user',
                    tokens: 0,
                    createdAt: new Date().toISOString()
                });
                window.location.href = "user.html";
            } catch (err) { alert(err.message); }
        });

        // Login Action
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            if(!email || !pass) return alert("Please enter email and password.");
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "user.html";
            } catch (err) { alert(err.message); }
        });
    </script>
</body>
</html>
