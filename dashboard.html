<!-- FIREBASE COMPAT SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<!-- IMMEDIATE BOARD RENDERER -->
<script>
    function renderBoardGrid() {
        const board = document.getElementById('board');
        if (!board) return;
        board.innerHTML = '';

        for (let i = 1; i <= 90; i++) {
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.id = `num-${i}`;
            cell.textContent = i;
            board.appendChild(cell);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderBoardGrid);
    } else {
        renderBoardGrid();
    }
</script>

<!-- DASHBOARD MAIN & REALTIME GAME SYNC SCRIPT -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
        authDomain: "tambola-house-3dc56.firebaseapp.com",
        projectId: "tambola-house-3dc56",
        storageBucket: "tambola-house-3dc56.firebasestorage.app",
        messagingSenderId: "267918174188",
        appId: "1:267918174188:web:ec27684544c286c044c2c9"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userData = null;

    /* TOAST */
    function showToast(message, type = "info") {
        const toast = document.getElementById("toast");
        const messageElement = document.getElementById("toastMessage");
        const icon = document.getElementById("toastIcon");

        messageElement.textContent = message;
        toast.className = "toast show";

        if (type === "success") {
            toast.classList.add("success");
            icon.className = "fas fa-check-circle";
        } else if (type === "error") {
            toast.classList.add("error");
            icon.className = "fas fa-exclamation-circle";
        } else {
            toast.classList.add("info");
            icon.className = "fas fa-info-circle";
        }

        setTimeout(() => { toast.classList.remove("show"); }, 3000);
    }

    /* LOGOUT */
    function logout() {
        auth.signOut().then(() => {
            window.location.href = "login.html";
        }).catch((error) => {
            console.error(error);
            showToast("Logout failed", "error");
        });
    }

    /* AUTHENTICATION CHECK */
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUser = user;
        await loadUserData();
        loadTicketStats();
        listenToActiveGame();
    });

    /* LOAD USER DATA */
    async function loadUserData() {
        try {
            const userRef = db.collection("users").doc(currentUser.uid);
            const userDoc = await userRef.get();

            if (!userDoc.exists) {
                showToast("User profile not found", "error");
                return;
            }

            userData = userDoc.data();
            const name = userData.fullName || currentUser.displayName || currentUser.email;

            document.getElementById("userName").innerHTML = `<i class="fas fa-user"></i> ${name}`;
            document.getElementById("tokenCount").textContent = Number(userData.tokens || 0);

            const deposits = Array.isArray(userData.depositRequests) ? userData.depositRequests : [];
            const pending = deposits.filter(item => item.status === "pending").length;

            document.getElementById("pendingDeposits").textContent = pending + " Pending";
            document.getElementById("winsCount").textContent = Number(userData.wins || 0);

        } catch (error) {
            console.error("Error loading user:", error);
            showToast("Could not load your account", "error");
        }
    }

    /* FETCH TICKET STATS (Reads all game tickets without hardcoded drawId) */
    function loadTicketStats() {
        db.collection("tickets")
            .onSnapshot((snapshot) => {
                let total = 0;
                let available = 0;
                let mine = 0;

                snapshot.forEach((doc) => {
                    total++;
                    const data = doc.data();
                    if (data.status === "available" || !data.ownerId) available++;
                    if (data.ownerId === currentUser.uid) {
                        mine++;
                    }
                });

                document.getElementById("totalTickets").textContent = total;
                document.getElementById("availableTickets").textContent = available;
                document.getElementById("myTickets").textContent = mine;
            }, (error) => {
                console.error("Ticket stats error:", error);
            });
    }

    /* DIRECT REALTIME GAME SYNC (Listens to games/active_game) */
    function listenToActiveGame() {
        db.collection("games").doc("active_game").onSnapshot((doc) => {
            if (!doc.exists) return;

            const data = doc.data();
            const drawnNumbers = data.drawnNumbers || [];
            const lastDrawn = data.lastDrawn || "--";

            // Update Big Display
            document.getElementById("currentNum").textContent = lastDrawn;

            // Update 1-90 Grid Highlights
            for (let i = 1; i <= 90; i++) {
                const cell = document.getElementById(`num-${i}`);
                if (!cell) continue;

                if (drawnNumbers.includes(i)) {
                    cell.classList.add("drawn");
                } else {
                    cell.classList.remove("drawn");
                }

                if (i === lastDrawn) {
                    cell.classList.add("last-drawn");
                } else {
                    cell.classList.remove("last-drawn");
                }
            }
        }, (error) => {
            console.error("Live sync error:", error);
        });
    }
</script>
