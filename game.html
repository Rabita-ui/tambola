<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola House - Join Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }
        .navbar h1 { font-size: 1.8em; }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .game-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .game-card:hover { transform: translateY(-3px); }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-title { font-size: 1.3em; color: #333; font-weight: 600; }
        .game-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .status-active { background: #27ae60; color: white; }
        .status-waiting { background: #f39c12; color: white; }
        .game-details { color: #666; margin: 15px 0; }
        .join-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .join-btn:hover { transform: scale(1.05); }
        .join-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .no-games {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .no-games h2 { font-size: 2em; margin-bottom: 10px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h2 { margin-bottom: 20px; color: #333; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .confirm-btn { background: #27ae60; color: white; }
        .cancel-btn { background: #e74c3c; color: white; }
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .price-detail {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 Tambola House</h1>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="game.html">Join Game</a>
            <a href="book.html">My Books</a>
            <a href="deposit.html">Deposit</a>
        </div>
    </nav>

    <div class="container">
        <h2>🎮 Available Games</h2>
        <div id="gamesList"></div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    </div>

    <div id="joinModal" class="modal">
        <div class="modal-content">
            <h2>🎯 Join Game</h2>
            <p>How many tickets would you like to buy?</p>
            <input type="number" id="ticketCount" min="1" max="10" value="1">
            <div class="price-detail">
                <p>Price per ticket: ₹<span id="ticketPrice">10</span></p>
                <p><strong>Total: ₹<span id="totalPrice">10</span></strong></p>
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="confirm-btn" id="confirmJoin">Confirm Purchase</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, db, collection, getDocs, doc, getDoc, updateDoc, addDoc, Timestamp, query, where, onSnapshot } from './firebase-config.js';

        let currentGameId = null;
        let currentGameData = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            loadGames();
        });

        function loadGames() {
            const gamesRef = collection(db, 'game_session');
            const q = query(gamesRef, where('status', 'in', ['waiting', 'active']));
            
            onSnapshot(q, (snapshot) => {
                const gamesList = document.getElementById('gamesList');
                gamesList.innerHTML = '';
                
                if (snapshot.empty) {
                    gamesList.innerHTML = `
                        <div class="no-games">
                            <h2>🎯 No Active Games</h2>
                            <p>Check back later for new games!</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((doc) => {
                    const game = doc.data();
                    const gameId = doc.id;
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="game-header">
                            <span class="game-title">Game #${gameId.slice(0, 8)}</span>
                            <span class="game-status status-${game.status}">${game.status.toUpperCase()}</span>
                        </div>
                        <div class="game-details">
                            <p>👥 Players: ${game.players || 0}</p>
                            <p>💰 Prize Pool: ₹${game.prizePool || 0}</p>
                            <p>📅 Created: ${game.createdAt ? new Date(game.createdAt.seconds * 1000).toLocaleString() : 'N/A'}</p>
                        </div>
                        <button class="join-btn" data-gameid="${gameId}" ${game.status === 'active' ? '' : 'disabled'}>
                            ${game.status === 'active' ? 'Join Game' : '⏳ Waiting to start'}
                        </button>
                    `;
                    gamesList.appendChild(card);
                });

                document.querySelectorAll('.join-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const gameId = e.target.dataset.gameid;
                        openJoinModal(gameId);
                    });
                });
            });
        }

        async function openJoinModal(gameId) {
            currentGameId = gameId;
            const gameDoc = await getDoc(doc(db, 'game_session', gameId));
            if (gameDoc.exists()) {
                currentGameData = gameDoc.data();
                document.getElementById('ticketPrice').textContent = currentGameData.ticketPrice || 10;
                document.getElementById('totalPrice').textContent = currentGameData.ticketPrice || 10;
                document.getElementById('joinModal').style.display = 'flex';
            }
        }

        window.closeModal = function() {
            document.getElementById('joinModal').style.display = 'none';
        };

        document.getElementById('ticketCount').addEventListener('change', function() {
            const price = parseInt(document.getElementById('ticketPrice').textContent) || 10;
            const total = this.value * price;
            document.getElementById('totalPrice').textContent = total;
        });

        document.getElementById('confirmJoin').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                alert('Please login first');
                return;
            }

            const ticketCount = parseInt(document.getElementById('ticketCount').value);
            const totalPrice = ticketCount * (currentGameData.ticketPrice || 10);

            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (!userDoc.exists()) {
                    alert('User data not found');
                    return;
                }

                const userData = userDoc.data();
                if (userData.wallet < totalPrice) {
                    alert(`Insufficient balance! You need ₹${totalPrice}. Current balance: ₹${userData.wallet}`);
                    return;
                }

                await updateDoc(doc(db, 'users', user.uid), {
                    wallet: userData.wallet - totalPrice
                });

                const ticketNumbers = [];
                for (let i = 0; i < ticketCount; i++) {
                    const numbers = generateTicketNumbers();
                    const ticketData = {
                        bookedAt: new Date().toISOString(),
                        email: user.email,
                        numbersString: numbers.join(','),
                        ticketNo: i + 1,
                        userId: user.uid,
                        gameId: currentGameId,
                        claimed: false
                    };
                    
                    const ticketRef = await addDoc(collection(db, 'booked_tickets'), ticketData);
                    ticketNumbers.push(ticketRef.id);
                }

                await updateDoc(doc(db, 'game_session', currentGameId), {
                    players: (currentGameData.players || 0) + 1,
                    prizePool: (currentGameData.prizePool || 0) + totalPrice
                });

                alert(`✅ Successfully joined the game! Purchased ${ticketCount} ticket(s).`);
                closeModal();
                loadGames();

            } catch (error) {
                console.error('Error joining game:', error);
                alert('Error joining game: ' + error.message);
            }
        });

        function generateTicketNumbers() {
            const ticket = [];
            const columns = Array.from({length: 9}, () => []);
            
            for (let col = 0; col < 9; col++) {
                const min = col * 10 + 1;
                const max = col === 8 ? 90 : (col + 1) * 10;
                const nums = [];
                while (nums.length < 3) {
                    const num = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (!nums.includes(num)) {
                        nums.push(num);
                    }
                }
                columns[col] = nums.sort((a, b) => a - b);
            }

            const rows = [[], [], []];
            for (let col = 0; col < 9; col++) {
                const colNums = columns[col];
                const positions = [0, 1, 2];
                for (let i = 0; i < 3; i++) {
                    const idx = Math.floor(Math.random() * positions.length);
                    const row = positions.splice(idx, 1)[0];
                    rows[row].push(colNums[i]);
                }
                for (let i = 0; i < 3; i++) {
                    if (rows[i].length <= col) {
                        rows[i].push(0);
                    }
                }
            }

            return rows.flat();
        }

        document.getElementById('joinModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('joinModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
