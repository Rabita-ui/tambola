<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Game - Tambola House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding: 20px; font-family: Arial, sans-serif; }
        .board-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 500px; margin: 0 auto; }
        .board-cell { aspect-ratio: 1; background: #fff; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; }
        .board-cell.called { background: #28a745; color: white; }
        .board-cell.current { background: #ffc107; color: black; font-size: 1.2rem; }
        .current-call-box { font-size: 3rem; font-weight: bold; background: #343a40; color: #ffc107; text-align: center; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .ticket-card { background: white; border: 2px solid #000; border-radius: 8px; padding: 10px; margin-bottom: 15px; max-width: 400px; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; }
        .cell { aspect-ratio: 1; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; background: #fdfdfd; cursor: pointer; }
        .cell.empty { background: #e9ecef; cursor: default; }
        .cell.marked { background: #ffc107 !important; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Tambola Live Game</h2>
            <div>
                <span id="player-role" class="badge bg-secondary p-2">LOADING...</span>
                <a href="user.html" id="dashboard-link" class="btn btn-outline-primary btn-sm ms-2">Dashboard</a>
            </div>
        </div>

        <!-- Host Control Box (Hidden for regular players) -->
        <div id="admin-controls" class="card p-3 mb-4 bg-light border-danger" style="display:none;">
            <h4 class="text-danger">Host Game Controls</h4>
            <div class="row align-items-end">
                <div class="col-md-6 mb-2">
                    <label for="start-number-select" class="form-label">Start Position in Sequence</label>
                    <select id="start-number-select" class="form-control"></select>
                </div>
                <div class="col-md-6 mb-2">
                    <button id="btn-start-game" class="btn btn-success w-100 mb-1">▶ Start Draw</button>
                    <button id="btn-pause-game" class="btn btn-warning w-100 mb-1">⏸ Pause Draw</button>
                    <button id="btn-reset-game" class="btn btn-danger w-100">🔄 Reset Board</button>
                </div>
            </div>
        </div>

        <!-- Main Display -->
        <div class="row">
            <div class="col-md-5 text-center">
                <div class="current-call-box">
                    <div style="font-size: 1rem; color: #fff;">CURRENT NUMBER</div>
                    <div id="current-number-display">--</div>
                </div>
                <div id="game-status-text" class="fw-bold mb-3 text-muted">WAITING FOR HOST</div>
                
                <h5>Master Board (1-90)</h5>
                <div id="master-board" class="board-grid mb-4"></div>
            </div>

            <div class="col-md-7">
                <h4>My Booked Tickets</h4>
                <div id="my-game-tickets">
                    <p>Loading your tickets...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUser = null;
        let callTimer = null;

        function generateFixedSequence() {
            let nums = Array.from({length: 90}, (_, i) => i + 1);
            let seed = 987654321;
            for (let i = nums.length - 1; i > 0; i--) {
                let x = Math.sin(seed++) * 10000;
                let j = Math.floor((x - Math.floor(x)) * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            return nums;
        }

        const FIXED_SEQUENCE = generateFixedSequence();

        const boardEl = document.getElementById('master-board');
        for (let i = 1; i <= 90; i++) {
            const cell = document.createElement('div');
            cell.className = 'board-cell';
            cell.id = `board-${i}`;
            cell.innerText = i;
            boardEl.appendChild(cell);
        }

        const selectEl = document.getElementById('start-number-select');
        FIXED_SEQUENCE.forEach((num, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `Number ${num} (Position #${index + 1})`;
            selectEl.appendChild(opt);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const urlParams = new URLSearchParams(window.location.search);
                const isHost = urlParams.get('role') === 'host';

                if (isHost) {
                    document.getElementById('player-role').innerText = "HOST / ADMIN";
                    document.getElementById('player-role').className = "badge bg-danger p-2";
                    document.getElementById('admin-controls').style.display = "block";
                    document.getElementById('dashboard-link').href = "admin.html";
                } else {
                    document.getElementById('player-role').innerText = "PLAYER";
                    document.getElementById('admin-controls').style.display = "none";
                    document.getElementById('dashboard-link').href = "user.html";
                }

                loadUserTickets(user.uid);
                listenToGameState();
            } else {
                window.location.href = "index.html";
            }
        });

        function listenToGameState() {
            onSnapshot(doc(db, "games", "active_game"), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                const calledNumbers = data.calledNumbers || [];
                const currentNum = data.currentNumber || "--";
                const isRunning = data.isRunning || false;

                document.getElementById('current-number-display').innerText = currentNum;
                document.getElementById('game-status-text').innerText = isRunning ? "🔴 GAME IN PROGRESS" : "⏸ GAME PAUSED / STOPPED";

                for (let i = 1; i <= 90; i++) {
                    const el = document.getElementById(`board-${i}`);
                    el.classList.remove('called', 'current');
                    if (calledNumbers.includes(i)) {
                        el.classList.add('called');
                    }
                }

                if (currentNum !== "--" && document.getElementById(`board-${currentNum}`)) {
                    document.getElementById(`board-${currentNum}`).classList.add('current');
                }
            });
        }

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            try {
                const startIndex = parseInt(selectEl.value) || 0;
                const intervalSec = parseInt(document.getElementById('call-interval').value) || 5;
                let currentIndex = startIndex;
                let calledNumbers = [];

                clearInterval(callTimer);
                
                await setDoc(doc(db, "games", "active_game"), {
                    isRunning: true,
                    startIndex: startIndex,
                    intervalSec: intervalSec,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });

                callTimer = setInterval(async () => {
                    if (currentIndex >= FIXED_SEQUENCE.length) {
                        clearInterval(callTimer);
                        alert("All 90 numbers called!");
                        return;
                    }

                    const numToCall = FIXED_SEQUENCE[currentIndex];
                    calledNumbers.push(numToCall);

                    await setDoc(doc(db, "games", "active_game"), {
                        currentNumber: numToCall,
                        calledNumbers: calledNumbers,
                        isRunning: true
                    }, { merge: true });

                    currentIndex++;
                }, intervalSec * 1000);
            } catch (error) {
                console.error("Start Game Error:", error);
                alert("Failed to start game: " + error.message);
            }
        });

        document.getElementById('btn-pause-game').addEventListener('click', async () => {
            clearInterval(callTimer);
            await setDoc(doc(db, "games", "active_game"), { isRunning: false }, { merge: true });
        });

        document.getElementById('btn-reset-game').addEventListener('click', async () => {
            if (!confirm("Reset game board for everyone?")) return;
            clearInterval(callTimer);
            await setDoc(doc(db, "games", "active_game"), {
                currentNumber: "--",
                calledNumbers: [],
                isRunning: false
            });
        });

        function loadUserTickets(uid) {
            const container = document.getElementById('my-game-tickets');
            const ticketsQuery = query(collection(db, "booked_tickets"), where("userId", "==", uid));

            onSnapshot(ticketsQuery, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = "<p>No booked tickets found for live game.</p>";
                    return;
                }

                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const ticket = docSnap.data();
                    const numbersArray = ticket.numbersString ? ticket.numbersString.split(',') : Array(27).fill(0);

                    const card = document.createElement('div');
                    card.className = "ticket-card";

                    let gridHtml = `
                        <div class="ticket-header mb-2 fw-bold text-primary">
                            <span>Ticket #${ticket.ticketNo || 'N/A'}</span>
                        </div>
                        <div class="ticket-grid">
                    `;

                    for (let idx = 0; idx < 27; idx++) {
                        let val = numbersArray[idx];
                        let displayVal = (val === "0" || !val) ? "" : val;
                        gridHtml += `<div class="cell ${displayVal === "" ? "empty" : ""}" onclick="this.classList.toggle('marked')">${displayVal}</div>`;
                    }

                    gridHtml += `</div>`;
                    card.innerHTML = gridHtml;
                    container.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
