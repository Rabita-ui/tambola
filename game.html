<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola House - Play Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(145deg, #f7f3ee, #e9e1d7); color: #2d1f14; min-height: 100vh; padding: 20px; }
        .container { max-width: 950px; margin: auto; }

        .header { background: white; border-radius: 20px; padding: 20px 25px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 1.5rem; color: #b35e2e; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.9rem; display: inline-block; }
        .btn-primary { background: #b35e2e; color: white; }
        .btn-secondary { background: #7b6856; color: white; }
        .btn-success { background: #27ae60; color: white; }

        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,.07); margin-bottom: 25px; }
        .card h2 { font-size: 1.3rem; margin-bottom: 15px; color: #b35e2e; border-bottom: 2px solid #f6f1eb; padding-bottom: 10px; }

        /* LIVE CALLER DISPLAY */
        .caller-box { text-align: center; background: #f6f1eb; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .current-num { font-size: 3.5rem; font-weight: 800; color: #b35e2e; }

        /* TAMBOLA TICKET GRID (3x9) */
        .ticket-container { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; background: #2d1f14; padding: 12px; border-radius: 14px; max-width: 550px; margin: 20px auto; }
        .ticket-cell { background: white; height: 50px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; border-radius: 6px; cursor: pointer; user-select: none; }
        .ticket-cell.empty { background: #ded4c9; cursor: default; }
        .ticket-cell.marked { background: #e74c3c; color: white; text-decoration: line-through; }

        /* LIVE 1-90 BOARD */
        .board-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
        .board-cell { background: #f6f1eb; padding: 6px 0; border-radius: 4px; text-align: center; font-weight: bold; font-size: 0.8rem; color: #ded4c9; }
        .board-cell.active { background: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-gamepad"></i> Game Room</h1>
        <div>
            <span style="margin-right: 15px; font-weight: 600;"><i class="fas fa-coins" style="color: #f39c12;"></i> Balance: <strong id="userTokens">0</strong></span>
            <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Home</a>
        </div>
    </div>

    <!-- LIVE CALLER PANEL -->
    <div class="card">
        <div class="caller-box">
            <div style="font-size: 0.9rem; font-weight: bold; color: #7b6856;">CURRENT NUMBER</div>
            <div class="current-num" id="liveNum">--</div>
        </div>

        <div style="text-align: center;">
            <button class="btn btn-success" id="buyBtn" onclick="buyTicket()"><i class="fas fa-ticket-alt"></i> Buy Ticket (10 Tokens)</button>
        </div>

        <!-- TICKET RENDER AREA -->
        <div id="ticketWrapper" style="display: none;">
            <h3 style="text-align: center; margin-top: 20px; color: #7b6856;" id="ticketNumLabel">Your Ticket</h3>
            <div class="ticket-container" id="ticketGrid"></div>
        </div>
    </div>

    <!-- LIVE 1-90 BOARD -->
    <div class="card">
        <h2><i class="fas fa-th"></i> Drawn Numbers Board</h2>
        <div class="board-grid" id="mainBoard"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
    authDomain: "tambola-house-3dc56.firebaseapp.com",
    projectId: "tambola-house-3dc56",
    storageBucket: "tambola-house-3dc56.firebasestorage.app",
    messagingSenderId: "267918174188",
    appId: "1:267918174188:web:ec27684544c286c044c2c9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let activeGameId = null;
let currentUserId = null;

// Build 1-90 board UI
const mainBoard = document.getElementById("mainBoard");
for (let i = 1; i <= 90; i++) {
    mainBoard.innerHTML += `<div class="board-cell" id="b-${i}">${i}</div>`;
}

/* AUTH & INITIALIZATION */
auth.onAuthStateChanged((user) => {
    if (!user) {
        alert("Please log in on index.html first!");
        window.location.href = "index.html";
    } else {
        currentUserId = user.uid;
        
        // Listen to User Tokens
        db.collection("users").doc(user.uid).onSnapshot(doc => {
            if (doc.exists) document.getElementById("userTokens").textContent = doc.data().tokens || 0;
        });

        // Listen to Active Game
        listenToActiveGame();
    }
});

/* LISTEN TO ACTIVE GAME SESSION */
function listenToActiveGame() {
    db.collection("games").where("status", "==", "active").limit(1).onSnapshot(snapshot => {
        if (snapshot.empty) {
            document.getElementById("liveNum").textContent = "NO GAME";
            return;
        }

        const gameDoc = snapshot.docs[0];
        activeGameId = gameDoc.id;
        const gameData = gameDoc.data();

        document.getElementById("liveNum").textContent = gameData.currentNumber || "--";

        // Highlight board cells
        for (let i = 1; i <= 90; i++) {
            const cell = document.getElementById(`b-${i}`);
            if (gameData.drawnNumbers && gameData.drawnNumbers.includes(i)) {
                cell.classList.add("active");
            } else {
                cell.classList.remove("active");
            }
        }

        // Check if user already owns a ticket in this game
        checkUserTicket();
    });
}

/* BUY TICKET FOR ACTIVE GAME */
async function buyTicket() {
    if (!activeGameId) {
        alert("No active game session found! Ask Admin to start a game.");
        return;
    }

    const availableRef = db.collection("games").doc(activeGameId).collection("gameTickets");
    const snapshot = await availableRef.where("isPurchased", "==", false).limit(1).get();

    if (snapshot.empty) {
        alert("All tickets for this game are sold out!");
        return;
    }

    const ticketDoc = snapshot.docs[0];

    try {
        await db.runTransaction(async (transaction) => {
            const userRef = db.collection("users").doc(currentUserId);
            const userDoc = await transaction.get(userRef);
            const tokens = userDoc.data().tokens || 0;

            if (tokens < 10) throw new Error("Not enough tokens! You need 10 tokens.");

            transaction.update(userRef, { tokens: tokens - 10 });
            transaction.update(ticketDoc.ref, {
                ownerUid: currentUserId,
                isPurchased: true,
                purchasedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        alert(`Ticket #${ticketDoc.data().ticketNumber} purchased!`);
        renderTicket(ticketDoc.data().grid, ticketDoc.data().ticketNumber);
    } catch (err) {
        alert("Error: " + err.message);
    }
}

/* CHECK IF USER ALREADY HAS A TICKET IN THIS GAME */
async function checkUserTicket() {
    if (!activeGameId || !currentUserId) return;
    
    const userTicketSnapshot = await db.collection("games").doc(activeGameId)
        .collection("gameTickets")
        .where("ownerUid", "==", currentUserId)
        .limit(1)
        .get();

    if (!userTicketSnapshot.empty) {
        const tData = userTicketSnapshot.docs[0].data();
        renderTicket(tData.grid, tData.ticketNumber);
        document.getElementById("buyBtn").style.display = "none";
    }
}

/* RENDER 3x9 TICKET GRID FROM 27-ITEM FLAT ARRAY */
function renderTicket(flatGrid, ticketNum) {
    document.getElementById("ticketWrapper").style.display = "block";
    document.getElementById("ticketNumLabel").textContent = `Your Ticket (#${ticketNum})`;
    const gridDiv = document.getElementById("ticketGrid");
    gridDiv.innerHTML = "";

    flatGrid.forEach(val => {
        if (val === 0) {
            gridDiv.innerHTML += `<div class="ticket-cell empty"></div>`;
        } else {
            gridDiv.innerHTML += `<div class="ticket-cell" onclick="this.classList.toggle('marked')">${val}</div>`;
        }
    });
}
</script>

</body>
</html>
