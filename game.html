<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room - Tambola House</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f3ee, #e9e1d7);
            color: #2d1f14;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header h1 i {
            color: #b35e2e;
        }

        .nav a {
            text-decoration: none;
            color: #7b6856;
            font-weight: 600;
            margin-left: 15px;
        }

        .nav a:hover {
            color: #b35e2e;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #2d1f14;
        }

        .status-box {
            background: #f6f1eb;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .status-box .label {
            color: #7b6856;
            font-size: .85rem;
            margin-bottom: 5px;
        }

        .status-box .value {
            font-size: 2rem;
            font-weight: 800;
            color: #2d1f14;
        }

        .last-number {
            font-size: 4.5rem !important;
            color: #b35e2e !important;
        }

        /* 1-90 BOARD GRID STYLES */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .board-cell {
            aspect-ratio: 1;
            border-radius: 8px;
            background: #faf8f5;
            border: 1px solid #ded4c9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #a89a8c;
            transition: all 0.2s ease;
        }

        .board-cell.drawn {
            background: #b35e2e;
            color: white;
            border-color: #b35e2e;
        }

        .board-cell.latest {
            background: #1f7a4b;
            color: white;
            border-color: #1f7a4b;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(31, 122, 75, 0.4);
        }

        /* TAMBOLA TICKET STYLES */
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            background: #f7f3ee;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #ded4c9;
            margin-top: 15px;
        }

        .ticket-cell {
            aspect-ratio: 1;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #2d1f14;
            cursor: pointer;
            user-select: none;
            border: 1px solid #e2d7ca;
        }

        .ticket-cell.empty {
            background: #eae3d9;
            cursor: default;
        }

        .ticket-cell.marked {
            background: #2b7a78;
            color: white;
            border-color: #205e5c;
        }

        .ticket-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: .9rem;
            background: #b35e2e;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .prize-list {
            list-style: none;
        }

        .prize-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        @media (max-width: 850px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>
            <i class="fas fa-gamepad"></i>
            Tambola House — Game Room
        </h1>

        <div class="nav">
            <a href="admin.html">
                <i class="fas fa-shield-alt"></i> Admin Panel
            </a>
            <a href="dashboard.html">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="grid-layout">
        
        <!-- LEFT SIDEBAR: LIVE CALL & PRIZES -->
        <div>
            <div class="card">
                <h2><i class="fas fa-bullhorn"></i> Live Call</h2>
                
                <div class="status-box">
                    <div class="label">Current Number</div>
                    <div class="value last-number" id="liveLastNumber">--</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="status-box" style="margin-bottom: 0;">
                        <div class="label">Drawn</div>
                        <div class="value" id="liveDrawnCount">0</div>
                    </div>
                    <div class="status-box" style="margin-bottom: 0;">
                        <div class="label">Status</div>
                        <div class="value" id="liveGameStatus" style="font-size: 1.1rem;">READY</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-trophy"></i> Prize Pool</h2>
                <ul class="prize-list">
                    <li class="prize-item"><span>Full House</span><strong id="prizeFullHouse">--</strong></li>
                    <li class="prize-item"><span>Top Line</span><strong id="prizeTopLine">--</strong></li>
                    <li class="prize-item"><span>Middle Line</span><strong id="prizeMiddleLine">--</strong></li>
                    <li class="prize-item"><span>Bottom Line</span><strong id="prizeBottomLine">--</strong></li>
                    <li class="prize-item"><span>Early 5</span><strong id="prizeEarlyFive">--</strong></li>
                </ul>
            </div>
        </div>

        <!-- RIGHT PANEL: BOARD & TICKET -->
        <div>
            <div class="card">
                <h2><i class="fas fa-th"></i> Draw Board (1 - 90)</h2>
                <div class="board-grid" id="boardGrid"></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-ticket-alt"></i> Your Live Ticket</h2>
                <div class="ticket-grid" id="ticketGrid"></div>
                
                <div class="ticket-actions">
                    <button onclick="generateNewTicket()"><i class="fas fa-sync-alt"></i> Get New Ticket</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
    authDomain: "tambola-house-3dc56.firebaseapp.com",
    projectId: "tambola-house-3dc56",
    storageBucket: "tambola-house-3dc56.firebasestorage.app",
    messagingSenderId: "267918174188",
    appId: "1:267918174188:web:ec27684544c286c044c2c9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const gameRef = db.collection("games").doc("active_game");

let playerTicket = [];

// Initialize Page
window.addEventListener('DOMContentLoaded', () => {
    buildBoardGrid();
    generateNewTicket();
    listenToGame();
});

/* BUILD 1-90 DISPLAY BOARD */
function buildBoardGrid() {
    const grid = document.getElementById("boardGrid");
    grid.innerHTML = "";
    for (let i = 1; i <= 90; i++) {
        const cell = document.createElement("div");
        cell.className = "board-cell";
        cell.id = `board-cell-${i}`;
        cell.textContent = i;
        grid.appendChild(cell);
    }
}

/* FIRESTORE REALTIME LISTENER */
function listenToGame() {
    gameRef.onSnapshot((doc) => {
        if (!doc.exists) return;

        const data = doc.data();
        const drawn = data.drawnNumbers || [];
        const last = data.lastDrawn || "--";

        document.getElementById("liveLastNumber").textContent = last;
        document.getElementById("liveDrawnCount").textContent = drawn.length;
        document.getElementById("liveGameStatus").textContent = (data.status || "READY").toUpperCase();

        // Update Prizes
        if (data.prizes) {
            document.getElementById("prizeFullHouse").textContent = (data.prizes.fullHouse || 0) + " Tokens";
            document.getElementById("prizeTopLine").textContent = (data.prizes.topLine || 0) + " Tokens";
            document.getElementById("prizeMiddleLine").textContent = (data.prizes.middleLine || 0) + " Tokens";
            document.getElementById("prizeBottomLine").textContent = (data.prizes.bottomLine || 0) + " Tokens";
            document.getElementById("prizeEarlyFive").textContent = (data.prizes.earlyFive || 0) + " Tokens";
        }

        // Update Board Visuals
        for (let i = 1; i <= 90; i++) {
            const el = document.getElementById(`board-cell-${i}`);
            el.className = "board-cell";
            if (drawn.includes(i)) {
                el.classList.add("drawn");
            }
        }
        if (last !== "--") {
            const latestEl = document.getElementById(`board-cell-${last}`);
            if (latestEl) latestEl.classList.add("latest");
        }
    });
}

/* GENERATE VALID 3x9 TAMBOLA TICKET */
function generateNewTicket() {
    playerTicket = Array.from({ length: 3 }, () => Array(9).fill(0));
    
    // Pick 5 numbers per row (total 15 numbers)
    for (let r = 0; r < 3; r++) {
        let cols = [];
        while (cols.length < 5) {
            let col = Math.floor(Math.random() * 9);
            if (!cols.includes(col)) cols.push(col);
        }
        cols.sort((a, b) => a - b);
        
        for (let col of cols) {
            let min = col * 10 + (col === 0 ? 1 : 0);
            let max = col * 10 + 9 + (col === 8 ? 1 : 0);
            let num;
            do {
                num = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (playerTicket.some(row => row[col] === num));
            
            playerTicket[r][col] = num;
        }
    }

    renderTicket();
}

/* RENDER PLAYER TICKET */
function renderTicket() {
    const grid = document.getElementById("ticketGrid");
    grid.innerHTML = "";

    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 9; c++) {
            const cell = document.createElement("div");
            const val = playerTicket[r][c];

            if (val === 0) {
                cell.className = "ticket-cell empty";
            } else {
                cell.className = "ticket-cell";
                cell.textContent = val;
                cell.onclick = () => cell.classList.toggle("marked");
            }
            grid.appendChild(cell);
        }
    }
}
</script>

</body>
</html>
