<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Game Room - Tambola House</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #121417;
            color: #e1e3e6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #1c1f24;
            border-radius: 12px;
            border: 1px solid #2d3239;
        }

        .header h2 {
            font-size: 1.2rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-links a {
            color: #a0a6b0;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 15px;
        }

        .header-links a:hover {
            color: #ffffff;
        }

        /* DISPLAY BANNER */
        .status-banner {
            background: #1c1f24;
            border: 1px solid #2d3239;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .last-number-box {
            background: #23272e;
            border: 2px solid #388bfd;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #3fb950;
        }

        .status-info h3 {
            font-size: 1rem;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .status-info p {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* BOARD GRID (1 to 90) */
        .board-card {
            background: #1c1f24;
            border: 1px solid #2d3239;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .board-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        @media (max-width: 600px) {
            .grid-board {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .grid-cell {
            background: #121417;
            border: 1px solid #2d3239;
            border-radius: 6px;
            padding: 12px 0;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: #57606a;
            transition: all 0.3s ease;
        }

        /* HIGHLIGHT FOR DRAWN NUMBERS */
        .grid-cell.drawn {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
            transform: scale(1.02);
            box-shadow: 0 0 8px rgba(46, 160, 67, 0.4);
        }

        /* HIGHLIGHT FOR LATEST DRAWN NUMBER */
        .grid-cell.latest {
            background: #388bfd !important;
            color: #ffffff !important;
            border-color: #58a6ff !important;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 4px #388bfd; }
            100% { transform: scale(1.1); box-shadow: 0 0 14px #58a6ff; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h2><i class="fas fa-gamepad" style="color: #3fb950;"></i> Tambola Game Room</h2>
        <div class="header-links">
            <a href="book-tickets.html"><i class="fas fa-ticket-alt"></i> My Tickets</a>
            <a href="dashboard.html"><i class="fas fa-desktop"></i> Dashboard</a>
        </div>
    </div>

    <!-- LIVE STATUS DISPLAY -->
    <div class="status-banner">
        <div class="status-info">
            <h3>CURRENT CALL</h3>
            <p id="currentStatus">Waiting for host...</p>
        </div>

        <div>
            <div class="last-number-box" id="lastDrawnNum">--</div>
        </div>

        <div class="status-info">
            <h3>TOTAL DRAWN</h3>
            <p><span id="drawnCount" style="color: #388bfd;">0</span> / 90</p>
        </div>
    </div>

    <!-- 1-90 LIVE BOARD -->
    <div class="board-card">
        <div class="board-title">
            <i class="fas fa-th" style="color: #388bfd;"></i> Live Number Board
        </div>
        <div class="grid-board" id="boardGrid">
            <!-- Dynamically populated 1-90 cells -->
        </div>
    </div>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
        authDomain: "tambola-house-3dc56.firebaseapp.com",
        projectId: "tambola-house-3dc56",
        storageBucket: "tambola-house-3dc56.firebasestorage.app",
        messagingSenderId: "267918174188",
        appId: "1:267918174188:web:ec27684544c286c044c2c9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Render initial grid elements (1 to 90)
    function buildBoardGrid() {
        const board = document.getElementById("boardGrid");
        board.innerHTML = "";
        for (let i = 1; i <= 90; i++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `cell-${i}`;
            cell.textContent = i;
            board.appendChild(cell);
        }
    }

    // Auth state check
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        buildBoardGrid();
        listenToLiveGame();
    });

    // Real-time listener for the active game state
    function listenToLiveGame() {
        db.collection("games").doc("active_game").onSnapshot((doc) => {
            if (!doc.exists) return;

            const data = doc.data();
            const drawnNumbers = data.drawnNumbers || [];
            const lastDrawn = data.lastDrawn;

            // Update UI Counters
            document.getElementById("lastDrawnNum").textContent = lastDrawn || "--";
            document.getElementById("drawnCount").textContent = drawnNumbers.length;
            
            if (data.status === "running") {
                document.getElementById("currentStatus").textContent = "Game in Progress";
            } else {
                document.getElementById("currentStatus").textContent = "Waiting for Next Round";
            }

            // Reset all cell highlights
            for (let i = 1; i <= 90; i++) {
                const cell = document.getElementById(`cell-${i}`);
                if (cell) {
                    cell.className = "grid-cell";
                }
            }

            // Apply highlights to drawn numbers
            drawnNumbers.forEach((num) => {
                const cell = document.getElementById(`cell-${num}`);
                if (cell) {
                    if (num === lastDrawn) {
                        cell.className = "grid-cell latest";
                    } else {
                        cell.className = "grid-cell drawn";
                    }
                }
            });
        });
    }
</script>
</body>
</html>
