<!-- Add this card into public/admin.html -->
<div class="card">
    <h3>Game Management</h3>
    <form id="createGameForm" style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-top: 10px;">
        <input type="text" id="gameTitle" placeholder="Game Title (e.g., Evening Bumper)" required>
        <input type="number" id="ticketPrice" placeholder="Price / Ticket" required min="1">
        <select id="gameStatusSelect">
            <option value="OPEN">OPEN</option>
            <option value="LIVE">LIVE</option>
            <option value="COMPLETED">COMPLETED</option>
        </select>
        <button type="submit" class="btn btn-primary">Create Game</button>
    </form>
</div>

<div class="card" id="liveControlCard">
    <h3>Live Number Board Controller</h3>
    <div style="margin: 15px 0;">
        <button id="drawNumberBtn" class="btn btn-success" style="font-size: 1.2rem; padding: 12px 24px;">Draw Next Number</button>
        <span style="font-size: 1.5rem; font-weight: bold; margin-left: 20px;">Last Drawn: <span id="lastDrawnDisplay" style="color: #e74c3c;">None</span></span>
    </div>

    <div>
        <h4>Drawn Numbers (<span id="drawnCount">0</span>/90):</h4>
        <div id="drawnNumbersGrid" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;"></div>
    </div>
</div>

<script>
let currentActiveGameId = null;

// Handle Game Creation
document.getElementById("createGameForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("gameTitle").value;
    const price = Number(document.getElementById("ticketPrice").value);
    const status = document.getElementById("gameStatusSelect").value;

    const gameRef = db.collection("games").doc();
    await gameRef.set({
        gameId: gameRef.id,
        title: title,
        ticketPrice: price,
        status: status,
        drawnNumbers: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Game Created Successfully!");
    currentActiveGameId = gameRef.id;
    listenToLiveGame(currentActiveGameId);
    document.getElementById("createGameForm").reset();
});

// Real-time Number Drawing Logic
function listenToLiveGame(gameId) {
    db.collection("games").doc(gameId).onSnapshot(doc => {
        if (!doc.exists) return;
        const game = doc.data();
        const drawn = game.drawnNumbers || [];

        document.getElementById("drawnCount").textContent = drawn.length;
        document.getElementById("lastDrawnDisplay").textContent = drawn.length > 0 ? drawn[drawn.length - 1] : "None";

        const grid = document.getElementById("drawnNumbersGrid");
        grid.innerHTML = drawn.map(n => `<span style="background: #3498db; color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold;">${n}</span>`).join('');
    });
}

document.getElementById("drawNumberBtn").addEventListener("click", async () => {
    if (!currentActiveGameId) return alert("Select or create a game first.");

    const gameRef = db.collection("games").doc(currentActiveGameId);
    const doc = await gameRef.get();
    const drawn = doc.data().drawnNumbers || [];

    if (drawn.length >= 90) return alert("All 90 numbers have been drawn!");

    let nextNum;
    do {
        nextNum = Math.floor(Math.random() * 90) + 1;
    } while (drawn.includes(nextNum));

    await gameRef.update({
        drawnNumbers: firebase.firestore.FieldValue.arrayUnion(nextNum)
    });
});
</script>
