<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Tambola House</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
  
  <!-- Local Config -->
  <script src="js/firebase-config.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f1217;
      color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #1a1d24;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      border: 1px solid #2a2e39;
    }
    h2 {
      margin-top: 0;
      color: #36b37e;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #222630;
      border: 1px solid #333846;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #2684ff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0065ff;
    }
    .btn-approve {
      background: #36b37e;
    }
    .btn-reject {
      background: #de350b;
      margin-left: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #2a2e39;
    }
    th {
      background-color: #222630;
    }
    #loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0f1217;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay while Auth check completes -->
  <div id="loading-overlay">Checking Admin Permissions...</div>

  <div class="admin-container" id="admin-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>⚙️ Admin Dashboard</h1>
      <a href="dashboard.html"><button style="background: #42526e;">Back to User Dashboard</button></a>
    </div>

    <!-- Section 1: Create New Game -->
    <div class="card">
      <h2>🎮 Create New Tambola Game</h2>
      <form id="create-game-form">
        <div class="form-group">
          <label for="game-title">Game Title</label>
          <input type="text" id="game-title" placeholder="e.g. Bumper Evening Game" required>
        </div>
        <div class="form-group">
          <label for="ticket-price">Ticket Price (Tokens)</label>
          <input type="number" id="ticket-price" min="1" placeholder="10" required>
        </div>
        <div class="form-group">
          <label for="game-time">Start Time</label>
          <input type="datetime-local" id="game-time" required>
        </div>
        <button type="submit">Publish Game</button>
      </form>
      <p id="game-status" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- Section 2: Manage Wallet Deposits -->
    <div class="card">
      <h2>💳 Pending Wallet Deposit Requests</h2>
      <table>
        <thead>
          <tr>
            <th>User Email</th>
            <th>Amount</th>
            <th>Transaction ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="deposits-table-body">
          <tr>
            <td colspan="4" style="text-align: center;">Loading requests...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- 1. Security Check & Role Access Guard ---
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const userDoc = await db.collection('users').doc(user.uid).get();

        if (userDoc.exists && userDoc.data().role === 'admin') {
          // Hide loading screen and display admin dashboard
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('admin-content').style.display = 'block';

          // Initialize Data Listeners
          loadPendingDeposits();
        } else {
          alert('Access denied: Admin privileges required.');
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('Permission check failed:', error);
        window.location.href = 'dashboard.html';
      }
    });

    // --- 2. Create Game Handler ---
    document.getElementById('create-game-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('game-title').value;
      const ticketPrice = Number(document.getElementById('ticket-price').value);
      const startTime = document.getElementById('game-time').value;
      const statusText = document.getElementById('game-status');

      try {
        statusText.style.color = '#36b37e';
        statusText.innerText = 'Creating game...';

        await db.collection('games').add({
          title: title,
          ticketPrice: ticketPrice,
          startTime: new Date(startTime),
          status: 'upcoming', // upcoming, active, completed
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusText.innerText = 'Game created successfully!';
        document.getElementById('create-game-form').reset();
      } catch (error) {
        statusText.style.color = '#de350b';
        statusText.innerText = 'Failed to create game: ' + error.message;
      }
    });

    // --- 3. Load & Process Deposit Requests ---
    function loadPendingDeposits() {
      db.collection('depositRequests')
        .where('status', '==', 'pending')
        .onSnapshot((snapshot) => {
          const tbody = document.getElementById('deposits-table-body');
          tbody.innerHTML = '';

          if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No pending deposit requests.</td></tr>';
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const row = document.createElement('tr');

            row.innerHTML = `
              <td>${data.userEmail || data.userId}</td>
              <td>${data.amount} Tokens</td>
              <td><code>${data.txnRef || 'N/A'}</code></td>
              <td>
                <button class="btn-approve" onclick="processDeposit('${doc.id}', '${data.userId}', ${data.amount}, true)">Approve</button>
                <button class="btn-reject" onclick="processDeposit('${doc.id}', '${data.userId}', ${data.amount}, false)">Reject</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        });
    }

    // Approve or Reject Deposit Batch Operation
    async function processDeposit(requestId, userId, amount, isApproved) {
      const batch = db.batch();
      const requestRef = db.collection('depositRequests').doc(requestId);
      const userRef = db.collection('users').doc(userId);

      if (isApproved) {
        // Increment user's wallet balance
        batch.update(userRef, {
          walletBalance: firebase.firestore.FieldValue.increment(amount)
        });
        batch.update(requestRef, { status: 'approved', processedAt: firebase.firestore.FieldValue.serverTimestamp() });
      } else {
        batch.update(requestRef, { status: 'rejected', processedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }

      try {
        await batch.commit();
        alert(isApproved ? 'Deposit approved and balance added!' : 'Deposit request rejected.');
      } catch (error) {
        alert('Error processing deposit: ' + error.message);
      }
    }
  </script>
</body>
</html>
