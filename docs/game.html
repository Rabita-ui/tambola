<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola - Live Game Room</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .tambola-ticket {
            display: inline-block;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 8px;
            background: #fff;
            margin-bottom: 20px;
        }
        .ticket-row {
            display: flex;
        }
        .ticket-cell {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .ticket-cell.marked {
            background-color: #2ecc71;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Live Game Room</h2>
        <div>
            <a href="dashboard.html" class="btn btn-primary">Dashboard</a>
        </div>
    </div>

    <!-- Live Board -->
    <div class="card">
        <h3>Live Call Board</h3>
        <p style="font-size: 1.5rem; margin: 10px 0;">Last Call: <span id="lastCallDisplay" style="color: #e74c3c; font-weight: bold;">--</span></p>
        <div id="drawnNumbersList" style="word-break: break-all; font-weight: bold;"></div>
    </div>

    <!-- My Tickets & Claim Actions -->
    <div class="card">
        <h3>My Tickets</h3>
        <div style="margin-bottom: 15px;">
            <button onclick="claimWin('EARLY_FIVE')" class="btn btn-primary">Claim Early 5</button>
            <button onclick="claimWin('TOP_LINE')" class="btn btn-primary">Claim Top Line</button>
            <button onclick="claimWin('MIDDLE_LINE')" class="btn btn-primary">Claim Middle Line</button>
            <button onclick="claimWin('BOTTOM_LINE')" class="btn btn-primary">Claim Bottom Line</button>
            <button onclick="claimWin('FULL_HOUSE')" class="btn btn-success">Claim Full House</button>
        </div>
        <div id="ticketsContainer">Loading tickets...</div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script>
let drawnNumbers = [];
let myTicketsData = [];
let activeGameId = null;

auth.onAuthStateChanged(async (user) => {
    if (!user) return window.location.href = "index.html";
    
    // Fetch active game
    const gameSnap = await db.collection("games").where("status", "==", "LIVE").limit(1).get();
    if (gameSnap.empty) {
        document.getElementById("ticketsContainer").textContent = "No live game active at the moment.";
        return;
    }

    activeGameId = gameSnap.docs[0].id;
    listenToLiveCalls(activeGameId);
    await loadUserTickets(user.uid, activeGameId);
});

function listenToLiveCalls(gameId) {
    db.collection("games").doc(gameId).onSnapshot(doc => {
        if (!doc.exists) return;
        drawnNumbers = doc.data().drawnNumbers || [];
        document.getElementById("lastCallDisplay").textContent = drawnNumbers.length > 0 ? drawnNumbers[drawnNumbers.length - 1] : "--";
        document.getElementById("drawnNumbersList").textContent = drawnNumbers.join(", ");
        
        renderTickets();
    });
}

async function loadUserTickets(userId, gameId) {
    const bookingSnap = await db.collection("bookings")
        .where("userId", "==", userId)
        .where("gameId", "==", gameId)
        .get();

    const ticketIds = [];
    bookingSnap.forEach(doc => doc.data().ticketIds.forEach(id => ticketIds.push(id)));

    myTicketsData = [];
    for (let tId of ticketIds) {
        const masterDoc = await db.collection("masterTickets").doc(tId).get();
        if (masterDoc.exists) {
            myTicketsData.push({ ticketId: tId, grid: masterDoc.data().grid });
        }
    }
    renderTickets();
}

function renderTickets() {
    const container = document.getElementById("ticketsContainer");
    if (myTicketsData.length === 0) {
        container.textContent = "You have no booked tickets for this game.";
        return;
    }

    container.innerHTML = myTicketsData.map(ticket => {
        let rowsHtml = '';
        for (let r = 0; r < 3; r++) {
            rowsHtml += '<div class="ticket-row">';
            for (let c = 0; c < 9; c++) {
                const val = ticket.grid[r * 9 + c];
                const isMarked = val !== 0 && drawnNumbers.includes(val);
                rowsHtml += `<div class="ticket-cell ${isMarked ? 'marked' : ''}">${val !== 0 ? val : ''}</div>`;
            }
            rowsHtml += '</div>';
        }
        return `<div class="tambola-ticket"><strong>Ticket ID: ${ticket.ticketId}</strong>${rowsHtml}</div>`;
    }).join('<br>');
}

// Win Validation Logic
async function claimWin(claimType) {
    const user = auth.currentUser;
    let isValidClaim = false;
    let winningTicketId = null;

    for (let ticket of myTicketsData) {
        const grid = ticket.grid;
        const markedGrid = grid.map(val => val !== 0 && drawnNumbers.includes(val));

        if (claimType === 'EARLY_FIVE') {
            const count = markedGrid.filter(Boolean).length;
            if (count >= 5) { isValidClaim = true; winningTicketId = ticket.ticketId; break; }
        } else if (claimType === 'TOP_LINE') {
            const topRow = markedGrid.slice(0, 9);
            const nonZeroCount = grid.slice(0, 9).filter(v => v !== 0).length;
            if (topRow.filter(Boolean).length === nonZeroCount) { isValidClaim = true; winningTicketId = ticket.ticketId; break; }
        } else if (claimType === 'FULL_HOUSE') {
            const nonZeroTotal = grid.filter(v => v !== 0).length;
            if (markedGrid.filter(Boolean).length === nonZeroTotal) { isValidClaim = true; winningTicketId = ticket.ticketId; break; }
        }
    }

    if (isValidClaim) {
        await db.collection("winners").add({
            gameId: activeGameId,
            userId: user.uid,
            userEmail: user.email,
            ticketId: winningTicketId,
            claimType: claimType,
            claimedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`Congratulations! Your claim for ${claimType} on ticket ${winningTicketId} was verified and recorded!`);
    } else {
        alert("Bogey / Invalid Claim! Your ticket does not satisfy the requirements based on drawn numbers.");
    }
}
</script>

</body>
</html>
