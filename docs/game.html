<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Game Room - Tambola House</title>

  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #172b4d; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 10px; border: 1px solid #dfe1e6; margin-bottom: 20px; }
    .current-num { font-size: 48px; font-weight: bold; color: #0052cc; text-align: center; }
    .board-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
    .board-cell { background: #fafbfc; border: 1px solid #dfe1e6; text-align: center; padding: 8px 0; font-weight: 600; border-radius: 4px; }
    .board-cell.called { background: #36b37e; color: white; border-color: #36b37e; }
    .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: #0052cc; padding: 8px; border-radius: 6px; margin-top: 10px; }
    .ticket-cell { background: white; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; border-radius: 3px; }
    .ticket-cell.matched { background: #36b37e; color: white; }
    .ticket-cell.empty { background: #deebff; }
    button { background: #0052cc; color: white; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 5px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" style="text-align: center;">
      <h2 style="margin: 0; color: #5e6c84;">Current Called Number</h2>
      <div class="current-num" id="current-number">--</div>
      <div id="admin-controls" style="display: none;">
        <button onclick="drawNextNumber()">🎲 Draw Next Number</button>
      </div>
    </div>

    <div class="card">
      <h3>🎟️ Your Ticket</h3>
      <div id="ticket-container" class="ticket-grid">Loading your ticket...</div>
      <div style="margin-top: 15px;">
        <button onclick="submitClaim('Early 5')">Claim Early 5</button>
        <button onclick="submitClaim('Top Line')">Claim Top Line</button>
        <button onclick="submitClaim('Middle Line')">Claim Middle Line</button>
        <button onclick="submitClaim('Bottom Line')">Claim Bottom Line</button>
        <button onclick="submitClaim('Full House')">Claim Full House</button>
      </div>
      <p id="claim-msg" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <div class="card">
      <h3>📋 Called Numbers Board</h3>
      <div class="board-grid" id="board-grid"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let activeGameId = null;
    let drawnNumbers = [];
    let playerTicket = null;
    let playerBookingId = null;

    // Render 1-90 board
    const board = document.getElementById('board-grid');
    for (let i = 1; i <= 90; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.id = `num-${i}`;
      cell.innerText = i;
      board.appendChild(cell);
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const userDoc = await db.collection('users').doc(user.uid).get();
      if (userDoc.exists && userDoc.data().role === 'admin') {
        document.getElementById('admin-controls').style.display = 'block';
      }

      loadActiveGame();
    });

    async function loadActiveGame() {
      const gamesSnap = await db.collection('games').where('status', '==', 'upcoming').limit(1).get();
      if (gamesSnap.empty) {
        document.getElementById('ticket-container').innerText = 'No live game active right now.';
        return;
      }

      activeGameId = gamesSnap.docs[0].id;

      // Listen to live drawn numbers
      db.collection('games').doc(activeGameId).onSnapshot((doc) => {
        if (!doc.exists) return;
        drawnNumbers = doc.data().drawnNumbers || [];
        updateBoard();
      });

      // Fetch player's ticket
      const bookingSnap = await db.collection('bookings')
        .where('gameId', '==', activeGameId)
        .where('userId', '==', currentUser.uid)
        .limit(1)
        .get();

      if (!bookingSnap.empty) {
        playerBookingId = bookingSnap.docs[0].id;
        playerTicket = bookingSnap.docs[0].data().numbers;
        renderTicket();
      } else {
        document.getElementById('ticket-container').innerText = 'You do not have a booked ticket for this game.';
      }
    }

    function updateBoard() {
      if (drawnNumbers.length > 0) {
        document.getElementById('current-number').innerText = drawnNumbers[drawnNumbers.length - 1];
      }
      for (let i = 1; i <= 90; i++) {
        const cell = document.getElementById(`num-${i}`);
        if (drawnNumbers.includes(i)) cell.classList.add('called');
      }
      if (playerTicket) renderTicket();
    }

    function renderTicket() {
      const grid = document.getElementById('ticket-container');
      grid.innerHTML = '';
      for (let i = 0; i < 27; i++) {
        const val = playerTicket[i];
        const cell = document.createElement('div');
        const isMatched = val && drawnNumbers.includes(val);
        cell.className = (val && val !== 0) ? (isMatched ? 'ticket-cell matched' : 'ticket-cell') : 'ticket-cell empty';
        cell.innerText = (val && val !== 0) ? val : '';
        grid.appendChild(cell);
      }
    }

    async function drawNextNumber() {
      if (!activeGameId) return;
      if (drawnNumbers.length >= 90) { alert('All 90 numbers have been drawn!'); return; }

      let nextNum;
      do { nextNum = Math.floor(Math.random() * 90) + 1; } while (drawnNumbers.includes(nextNum));

      await db.collection('games').doc(activeGameId).update({
        drawnNumbers: firebase.firestore.FieldValue.arrayUnion(nextNum)
      });
    }

    async function submitClaim(claimType) {
      if (!playerBookingId) { alert('No valid ticket found to submit a claim.'); return; }

      const msg = document.getElementById('claim-msg');
      msg.style.color = '#0052cc';
      msg.innerText = `Submitting ${claimType} claim...`;

      try {
        await db.collection('claims').add({
          gameId: activeGameId,
          ticketId: playerBookingId,
          userId: currentUser.uid,
          userEmail: currentUser.email,
          claimType: claimType,
          status: 'pending',
          submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        msg.style.color = '#36b37e';
        msg.innerText = `${claimType} claim submitted to host for verification!`;
      } catch (err) {
        msg.style.color = '#ff5630';
        msg.innerText = 'Failed to submit claim: ' + err.message;
      }
    }
  </script>
</body>
</html>
