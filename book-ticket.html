<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Ticket - Tambola House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back-btn {
            background: #ff6600;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .balance {
            background: #ff6600;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 8px;
        }

        .balance-number {
            font-size: 32px;
            font-weight: bold;
        }

        .ticket-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .tickets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .ticket {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
        }

        .ticket.booked {
            background: #eeeeee;
            border-color: #aaa;
        }

        .ticket-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ticket-grid {
            width: 100%;
            border-collapse: collapse;
        }

        .ticket-grid td {
            border: 1px solid #999;
            text-align: center;
            height: 35px;
            font-weight: bold;
            font-size: 15px;
        }

        .empty-cell {
            background: #f1f1f1;
        }

        .preview-btn,
        .book-btn,
        .close-btn {
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .preview-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            background: #1976d2;
        }

        .preview-btn:hover {
            background: #1565c0;
        }

        .book-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #ff6600;
        }

        .book-btn:hover {
            background: #e65c00;
        }

        .book-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .booked-label {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            background: #ddd;
            border-radius: 6px;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }

        .success {
            background: #dff0d8;
            color: #256029;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* =========================
           PREVIEW POPUP
           ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            overflow-y: auto;
            padding: 30px 15px;
        }

        .modal-content {
            background: white;
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .modal-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .preview-ticket {
            border: 3px solid #222;
            border-radius: 10px;
            padding: 15px;
            background: white;
            overflow-x: auto;
        }

        .preview-ticket .ticket-grid {
            width: 100%;
            min-width: 500px;
        }

        .preview-ticket .ticket-grid td {
            height: 55px;
            font-size: 20px;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .preview-actions button {
            flex: 1;
            padding: 13px;
        }

        .cancel-btn {
            border: none;
            border-radius: 6px;
            background: #777;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #555;
        }

        .close-x {
            position: absolute;
            right: 18px;
            top: 12px;
            font-size: 30px;
            cursor: pointer;
            color: #555;
        }

        .close-x:hover {
            color: #000;
        }

        .preview-price {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .modal-content {
                padding: 15px;
            }

            .preview-ticket {
                padding: 8px;
            }

            .preview-ticket .ticket-grid {
                min-width: 450px;
            }

            .preview-ticket .ticket-grid td {
                height: 45px;
                font-size: 16px;
            }

            .preview-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Tambola House</h1>

    <a href="dashboard.html" class="back-btn">
        Dashboard
    </a>

</header>


<div class="container">

    <div class="card">

        <h2>Book Your Ticket</h2>

        <p>
            Preview a ticket before booking it.
        </p>

        <div class="balance">

            <h2>Your Token Balance</h2>

            <div class="balance-number">
                <span id="tokenBalance">0</span> Tokens
            </div>

        </div>

        <div class="ticket-info">

            <div>
                <strong>Current Draw:</strong>
                <span id="drawName">Loading...</span>
            </div>

            <div class="price">
                Ticket Price: 10 Tokens
            </div>

        </div>

    </div>


    <div id="message" class="message"></div>


    <div class="card">

        <h2>Choose Your Ticket</h2>

        <p>
            Click <strong>Preview</strong> to see the complete ticket.
        </p>

        <div id="tickets" class="tickets">

            <div class="loading">
                Loading tickets...
            </div>

        </div>

    </div>

</div>


<!-- =========================
     PREVIEW MODAL
     ========================= -->

<div id="previewModal" class="modal">

    <div class="modal-content">

        <span
            class="close-x"
            id="closePreview">
            &times;
        </span>

        <h2
            class="modal-title"
            id="previewTitle">
            Ticket Preview
        </h2>

        <div
            id="previewTicket"
            class="preview-ticket">
        </div>

        <div class="preview-price">
            Price: 10 Tokens
        </div>

        <div class="preview-actions">

            <button
                id="confirmBookBtn"
                class="book-btn">
                Book This Ticket - 10 Tokens
            </button>

            <button
                id="cancelPreviewBtn"
                class="cancel-btn">
                Cancel
            </button>

        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where,
        runTransaction
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import { firebaseConfig }
        from "./firebase-config.js";


    // Firebase

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // Settings

    const TICKET_PRICE = 10;

    const CURRENT_DRAW_ID = "draw1";


    // Elements

    const tokenBalance =
        document.getElementById("tokenBalance");

    const ticketsContainer =
        document.getElementById("tickets");

    const message =
        document.getElementById("message");

    const drawName =
        document.getElementById("drawName");

    const previewModal =
        document.getElementById("previewModal");

    const previewTitle =
        document.getElementById("previewTitle");

    const previewTicket =
        document.getElementById("previewTicket");

    const confirmBookBtn =
        document.getElementById("confirmBookBtn");

    const closePreview =
        document.getElementById("closePreview");

    const cancelPreviewBtn =
        document.getElementById("cancelPreview");


    let currentUser = null;

    let currentUserData = null;

    let selectedTicketId = null;


    // Show message

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";

    }


    // Authentication

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }

        currentUser = user;

        try {

            await loadUser();

            await loadTickets();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to load booking system: " +
                error.message,
                "error"
            );

        }

    });


    // Load user

    async function loadUser() {

        const userRef =
            doc(db, "users", currentUser.uid);

        const snapshot =
            await getDoc(userRef);


        if (!snapshot.exists()) {

            throw new Error(
                "User profile not found."
            );

        }


        currentUserData =
            snapshot.data();


        const balance =
            Number(
                currentUserData.tokenBalance || 0
            );


        tokenBalance.textContent =
            balance;


        drawName.textContent =
            "Draw 1";

    }


    // Load tickets

    async function loadTickets() {

        ticketsContainer.innerHTML =
            '<div class="loading">Loading tickets...</div>';


        // Get all 300 fixed tickets

        const ticketsSnapshot =
            await getDocs(
                collection(db, "tickets")
            );


        // Get tickets already booked for this draw

        const bookingQuery =
            query(
                collection(db, "bookings"),
                where(
                    "drawId",
                    "==",
                    CURRENT_DRAW_ID
                )
            );


        const bookingsSnapshot =
            await getDocs(bookingQuery);


        const bookedTickets =
            new Set();


        bookingsSnapshot.forEach((bookingDoc) => {

            const data =
                bookingDoc.data();


            if (data.ticketId) {

                bookedTickets.add(
                    data.ticketId
                );

            }

        });


        if (ticketsSnapshot.empty) {

            ticketsContainer.innerHTML =
                '<div class="loading">No tickets found.</div>';

            return;

        }


        ticketsContainer.innerHTML = "";


        const tickets = [];


        ticketsSnapshot.forEach((ticketDoc) => {

            tickets.push({
                id: ticketDoc.id,
                data: ticketDoc.data()
            });

        });


        // Sort ticket numbers

        tickets.sort((a, b) => {

            const numberA =
                Number(
                    String(a.id).replace(/\D/g, "")
                );

            const numberB =
                Number(
                    String(b.id).replace(/\D/g, "")
                );

            return numberA - numberB;

        });


        // Display tickets

        tickets.forEach((ticket) => {

            const ticketId =
                ticket.id;

            const data =
                ticket.data;

            const isBooked =
                bookedTickets.has(ticketId);


            const div =
                document.createElement("div");

            div.className =
                "ticket" +
                (isBooked ? " booked" : "");


            const title =
                document.createElement("div");

            title.className =
                "ticket-number";

            title.textContent =
                ticketId;


            div.appendChild(title);


            const numbers =
                getTicketNumbers(data);


            const table =
                createTicketTable(numbers);


            div.appendChild(table);


            if (isBooked) {

                const booked =
                    document.createElement("div");

                booked.className =
                    "booked-label";

                booked.textContent =
                    "BOOKED";

                div.appendChild(booked);

            } else {

                const previewBtn =
                    document.createElement("button");

                previewBtn.className =
                    "preview-btn";

                previewBtn.textContent =
                    "Preview Ticket";


                previewBtn.addEventListener(
                    "click",
                    () => {

                        openPreview(
                            ticketId,
                            numbers
                        );

                    }
                );


                div.appendChild(previewBtn);

            }


            ticketsContainer.appendChild(div);

        });

    }


    // Get ticket numbers

    function getTicketNumbers(data) {

        let numbers =
            data.numbers;


        if (!Array.isArray(numbers)) {

            numbers =
                data.grid;

        }


        if (!Array.isArray(numbers)) {

            numbers =
                data.ticket;

        }


        if (!Array.isArray(numbers)) {

            numbers = [];

        }


        return numbers;

    }


    // Create ticket table

    function createTicketTable(numbers) {

        const table =
            document.createElement("table");

        table.className =
            "ticket-grid";


        if (
            Array.isArray(numbers) &&
            numbers.length > 0
        ) {

            numbers.forEach((row) => {

                const tr =
                    document.createElement("tr");


                if (Array.isArray(row)) {

                    row.forEach((value) => {

                        const td =
                            document.createElement("td");


                        if (
                            value === null ||
                            value === undefined ||
                            value === ""
                        ) {

                            td.textContent = "";

                            td.className =
                                "empty-cell";

                        } else {

                            td.textContent =
                                value;

                        }


                        tr.appendChild(td);

                    });

                }


                table.appendChild(tr);

            });

        } else {

            const tr =
                document.createElement("tr");

            const td =
                document.createElement("td");

            td.colSpan = 9;

            td.textContent =
                "Ticket design unavailable";

            tr.appendChild(td);

            table.appendChild(tr);

        }


        return table;

    }


    // Open preview

    function openPreview(
        ticketId,
        numbers
    ) {

        selectedTicketId =
            ticketId;


        previewTitle.textContent =
            "Ticket " + ticketId;


        previewTicket.innerHTML = "";


        const table =
            createTicketTable(numbers);


        previewTicket.appendChild(table);


        previewModal.style.display =
            "block";

    }


    // Close preview

    function closePreviewModal() {

        previewModal.style.display =
            "none";

        selectedTicketId =
            null;

    }


    closePreview.addEventListener(
        "click",
        closePreviewModal
    );


    cancelPreviewBtn.addEventListener(
        "click",
        closePreviewModal
    );


    // Close when clicking outside

    previewModal.addEventListener(
        "click",
        (event) => {

            if (
                event.target === previewModal
            ) {

                closePreviewModal();

            }

        }
    );


    // Confirm booking from preview

    confirmBookBtn.addEventListener(
        "click",
        async () => {

            if (!selectedTicketId) {

                return;

            }


            const ticketToBook =
                selectedTicketId;


            await bookTicket(
                ticketToBook
            );

        }
    );


    // Book ticket

    async function bookTicket(ticketId) {

        if (!currentUser) {

            showMessage(
                "Please login first.",
                "error"
            );

            return;

        }


        const currentBalance =
            Number(
                currentUserData.tokenBalance || 0
            );


        if (currentBalance < TICKET_PRICE) {

            closePreviewModal();

            showMessage(
                "You need at least 10 tokens to book a ticket.",
                "error"
            );

            return;

        }


        const confirmed =
            confirm(
                "Book " +
                ticketId +
                " for 10 tokens?"
            );


        if (!confirmed) {

            return;

        }


        try {

            confirmBookBtn.disabled =
                true;

            confirmBookBtn.textContent =
                "Booking...";


            await runTransaction(
                db,
                async (transaction) => {

                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    const bookingRef =
                        doc(
                            db,
                            "bookings",
                            CURRENT_DRAW_ID +
                            "_" +
                            ticketId
                        );


                    const userSnapshot =
                        await transaction.get(
                            userRef
                        );


                    const bookingSnapshot =
                        await transaction.get(
                            bookingRef
                        );


                    // Prevent double booking

                    if (bookingSnapshot.exists()) {

                        throw new Error(
                            "This ticket has already been booked."
                        );

                    }


                    const userData =
                        userSnapshot.data();


                    const balance =
                        Number(
                            userData.tokenBalance || 0
                        );


                    if (balance < TICKET_PRICE) {

                        throw new Error(
                            "Insufficient token balance."
                        );

                    }


                    // Deduct 10 tokens

                    transaction.update(
                        userRef,
                        {
                            tokenBalance:
                                balance -
                                TICKET_PRICE
                        }
                    );


                    // Create booking

                    transaction.set(
                        bookingRef,
                        {

                            drawId:
                                CURRENT_DRAW_ID,

                            ticketId:
                                ticketId,

                            userId:
                                currentUser.uid,

                            email:
                                currentUser.email || "",

                            price:
                                TICKET_PRICE,

                            status:
                                "booked",

                            bookedAt:
                                new Date()

                        }
                    );

                }
            );


            closePreviewModal();


            showMessage(
                "Ticket " +
                ticketId +
                " booked successfully!",
                "success"
            );


            // Refresh balance and tickets

            await loadUser();

            await loadTickets();


        } catch (error) {

            console.error(error);

            showMessage(
                "Booking failed: " +
                error.message,
                "error"
            );

        } finally {

            confirmBookBtn.disabled =
                false;

            confirmBookBtn.textContent =
                "Book This Ticket - 10 Tokens";

        }

    }

</script>

</body>
</html>
