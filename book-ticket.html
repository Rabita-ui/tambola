<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Ticket - Tambola House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back-btn {
            background: #ff6600;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .balance {
            background: #ff6600;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 8px;
        }

        .balance-number {
            font-size: 32px;
            font-weight: bold;
        }

        .ticket-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .tickets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .ticket {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
        }

        .ticket.booked {
            background: #eeeeee;
            border-color: #aaa;
        }

        .ticket-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ticket-grid {
            width: 100%;
            border-collapse: collapse;
        }

        .ticket-grid td {
            border: 1px solid #999;
            text-align: center;
            height: 35px;
            font-weight: bold;
            font-size: 15px;
        }

        .empty-cell {
            background: #f1f1f1;
        }

        .book-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #ff6600;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #e65c00;
        }

        .book-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .booked-label {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            background: #ddd;
            border-radius: 6px;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }

        .success {
            background: #dff0d8;
            color: #256029;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Tambola House</h1>

    <a href="dashboard.html" class="back-btn">
        Dashboard
    </a>
</header>


<div class="container">

    <div class="card">

        <h2>Book Your Ticket</h2>

        <p>
            Select one available ticket for the current draw.
        </p>

        <div class="balance">

            <h2>Your Token Balance</h2>

            <div class="balance-number">
                <span id="tokenBalance">0</span> Tokens
            </div>

        </div>

        <div class="ticket-info">

            <div>
                <strong>Current Draw:</strong>
                <span id="drawName">Loading...</span>
            </div>

            <div class="price">
                Ticket Price: 10 Tokens
            </div>

        </div>

    </div>


    <div id="message" class="message"></div>


    <div class="card">

        <h2>Available Tickets</h2>

        <p>
            Choose any available ticket.
            Each ticket costs <strong>10 tokens</strong>.
        </p>

        <div id="tickets" class="tickets">

            <div class="loading">
                Loading tickets...
            </div>

        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where,
        runTransaction
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import { firebaseConfig }
        from "./firebase-config.js";


    // Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Settings

    const TICKET_PRICE = 10;

    // Temporary fixed draw ID.
    // We will replace this with the admin-controlled
    // current draw system in the next step.

    const CURRENT_DRAW_ID = "draw1";


    // Elements

    const tokenBalance =
        document.getElementById("tokenBalance");

    const ticketsContainer =
        document.getElementById("tickets");

    const message =
        document.getElementById("message");

    const drawName =
        document.getElementById("drawName");


    let currentUser = null;

    let currentUserData = null;


    // Show message

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";

    }


    // Authentication

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href = "login.html";

            return;
        }

        currentUser = user;

        try {

            await loadUser();

            await loadTickets();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to load booking system: " +
                error.message,
                "error"
            );

        }

    });


    // Load user

    async function loadUser() {

        const userRef =
            doc(db, "users", currentUser.uid);

        const snapshot =
            await getDoc(userRef);


        if (!snapshot.exists()) {

            throw new Error(
                "User profile not found."
            );

        }


        currentUserData =
            snapshot.data();


        const balance =
            Number(
                currentUserData.tokenBalance || 0
            );


        tokenBalance.textContent =
            balance;


        drawName.textContent =
            "Draw 1";


    }


    // Load tickets

    async function loadTickets() {

        ticketsContainer.innerHTML =
            '<div class="loading">Loading tickets...</div>';


        /*
         * Read all 300 permanent tickets.
         */

        const ticketsSnapshot =
            await getDocs(
                collection(db, "tickets")
            );


        /*
         * Find tickets already booked
         * for the current draw.
         */

        const bookingQuery =
            query(
                collection(db, "bookings"),
                where(
                    "drawId",
                    "==",
                    CURRENT_DRAW_ID
                )
            );


        const bookingsSnapshot =
            await getDocs(bookingQuery);


        const bookedTickets =
            new Set();


        bookingsSnapshot.forEach((bookingDoc) => {

            const data =
                bookingDoc.data();


            if (data.ticketId) {

                bookedTickets.add(
                    data.ticketId
                );

            }

        });


        if (ticketsSnapshot.empty) {

            ticketsContainer.innerHTML =
                '<div class="loading">No tickets found.</div>';

            return;

        }


        ticketsContainer.innerHTML = "";


        /*
         * Sort tickets by ticket number.
         */

        const tickets = [];


        ticketsSnapshot.forEach((ticketDoc) => {

            tickets.push({
                id: ticketDoc.id,
                data: ticketDoc.data()
            });

        });


        tickets.sort((a, b) => {

            const numberA =
                Number(
                    String(a.id).replace(/\D/g, "")
                );

            const numberB =
                Number(
                    String(b.id).replace(/\D/g, "")
                );

            return numberA - numberB;

        });


        /*
         * Display tickets.
         */

        tickets.forEach((ticket) => {

            const ticketId =
                ticket.id;

            const data =
                ticket.data;

            const isBooked =
                bookedTickets.has(ticketId);


            const div =
                document.createElement("div");

            div.className =
                "ticket" +
                (isBooked ? " booked" : "");


            const title =
                document.createElement("div");

            title.className =
                "ticket-number";

            title.textContent =
                ticketId;


            div.appendChild(title);


            /*
             * Your ticket generator may store
             * the numbers in "numbers".
             */

            let numbers =
                data.numbers;


            /*
             * Support a few possible formats.
             */

            if (!Array.isArray(numbers)) {

                numbers =
                    data.grid ||
                    data.ticket ||
                    [];

            }


            const table =
                document.createElement("table");

            table.className =
                "ticket-grid";


            if (
                Array.isArray(numbers) &&
                numbers.length > 0
            ) {

                numbers.forEach((row) => {

                    const tr =
                        document.createElement("tr");


                    if (Array.isArray(row)) {

                        row.forEach((value) => {

                            const td =
                                document.createElement("td");


                            if (
                                value === null ||
                                value === undefined ||
                                value === ""
                            ) {

                                td.textContent = "";

                                td.className =
                                    "empty-cell";

                            } else {

                                td.textContent =
                                    value;

                            }


                            tr.appendChild(td);

                        });

                    }


                    table.appendChild(tr);

                });

            } else {

                const tr =
                    document.createElement("tr");

                const td =
                    document.createElement("td");

                td.colSpan = 9;

                td.textContent =
                    "Ticket design unavailable";

                tr.appendChild(td);

                table.appendChild(tr);

            }


            div.appendChild(table);


            if (isBooked) {

                const booked =
                    document.createElement("div");

                booked.className =
                    "booked-label";

                booked.textContent =
                    "BOOKED";

                div.appendChild(booked);

            } else {

                const button =
                    document.createElement("button");

                button.className =
                    "book-btn";

                button.textContent =
                    "Book for 10 Tokens";


                button.addEventListener(
                    "click",
                    () => bookTicket(ticketId)
                );


                div.appendChild(button);

            }


            ticketsContainer.appendChild(div);

        });

    }


    // Book ticket

    async function bookTicket(ticketId) {

        showMessage("", "success");

        message.style.display = "none";


        if (!currentUser) {

            showMessage(
                "Please login first.",
                "error"
            );

            return;

        }


        /*
         * Check the current displayed balance.
         */

        const currentBalance =
            Number(
                currentUserData.tokenBalance || 0
            );


        if (currentBalance < TICKET_PRICE) {

            showMessage(
                "You need at least 10 tokens to book a ticket.",
                "error"
            );

            return;

        }


        const confirmed =
            confirm(
                "Book " +
                ticketId +
                " for 10 tokens?"
            );


        if (!confirmed) {

            return;

        }


        try {

            /*
             * Firestore transaction prevents
             * two users from booking the same
             * ticket at the same time.
             */

            await runTransaction(
                db,
                async (transaction) => {

                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    const bookingRef =
                        doc(
                            db,
                            "bookings",
                            CURRENT_DRAW_ID +
                            "_" +
                            ticketId
                        );


                    /*
                     * Read both documents.
                     */

                    const userSnapshot =
                        await transaction.get(
                            userRef
                        );


                    const bookingSnapshot =
                        await transaction.get(
                            bookingRef
                        );


                    /*
                     * Check ticket already booked.
                     */

                    if (bookingSnapshot.exists()) {

                        throw new Error(
                            "This ticket has already been booked."
                        );

                    }


                    /*
                     * Get latest token balance.
                     */

                    const userData =
                        userSnapshot.data();


                    const balance =
                        Number(
                            userData.tokenBalance || 0
                        );


                    if (balance < TICKET_PRICE) {

                        throw new Error(
                            "Insufficient token balance."
                        );

                    }


                    /*
                     * Deduct 10 tokens.
                     */

                    transaction.update(
                        userRef,
                        {
                            tokenBalance:
                                balance -
                                TICKET_PRICE
                        }
                    );


                    /*
                     * Create booking.
                     */

                    transaction.set(
                        bookingRef,
                        {

                            drawId:
                                CURRENT_DRAW_ID,

                            ticketId:
                                ticketId,

                            userId:
                                currentUser.uid,

                            email:
                                currentUser.email || "",

                            price:
                                TICKET_PRICE,

                            status:
                                "booked",

                            bookedAt:
                                new Date()

                        }
                    );

                }
            );


            showMessage(
                "Ticket " +
                ticketId +
                " booked successfully!",
                "success"
            );


            /*
             * Reload balance and tickets.
             */

            await loadUser();

            await loadTickets();


        } catch (error) {

            console.error(error);

            showMessage(
                "Booking failed: " +
                error.message,
                "error"
            );

        }

    }

</script>

</body>
</html>
