<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola House - Book Ticket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(145deg, #f7f3ee, #e9e1d7); color: #2d1f14; min-height: 100vh; padding: 20px; }
        .container { max-width: 950px; margin: auto; }

        .header { background: white; border-radius: 20px; padding: 20px 25px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 1.5rem; color: #b35e2e; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.9rem; display: inline-block; }
        .btn-secondary { background: #7b6856; color: white; }
        .btn-primary { background: #b35e2e; color: white; }
        .btn-success { background: #27ae60; color: white; }

        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,.07); margin-bottom: 25px; }
        .card h2 { font-size: 1.3rem; margin-bottom: 15px; color: #b35e2e; border-bottom: 2px solid #f6f1eb; padding-bottom: 10px; }

        .game-select-box { padding: 10px 15px; border-radius: 10px; border: 1px solid #ded4c9; font-size: 1rem; font-weight: bold; width: 100%; margin-bottom: 20px; background: #fff; }

        .ticket-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
        .ticket-card { border: 2px solid #ded4c9; border-radius: 12px; padding: 12px; background: #fff; text-align: center; }
        .ticket-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background: #2d1f14; padding: 6px; border-radius: 8px; margin: 10px 0; }
        .t-cell { background: white; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; border-radius: 3px; }
        .t-cell.empty { background: #ded4c9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-ticket-alt"></i> Ticket Booking Counter</h1>
        <div>
            <span style="margin-right: 15px; font-weight: 600;"><i class="fas fa-coins" style="color: #f39c12;"></i> Balance: <strong id="userTokens">0</strong></span>
            <a href="game.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Game</a>
        </div>
    </div>

    <div class="card">
        <h2><i class="fas fa-play-circle"></i> Select Active or Upcoming Game</h2>
        <select id="gameSelect" class="game-select-box" onchange="loadGameTickets()">
            <option value="">-- Select a Game --</option>
        </select>

        <div id="ticketsContainer" class="ticket-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDV5yQ1F18vYtaaEy4ac31LXplCkTr2U6A",
    authDomain: "tambola-house-3dc56.firebaseapp.com",
    projectId: "tambola-house-3dc56",
    storageBucket: "tambola-house-3dc56.firebasestorage.app",
    messagingSenderId: "267918174188",
    appId: "1:267918174188:web:ec27684544c286c044c2c9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUserUid = null;
let currentTokens = 0;

auth.onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "index.html";
    } else {
        currentUserUid = user.uid;
        db.collection("users").doc(user.uid).onSnapshot(doc => {
            if (doc.exists) {
                currentTokens = doc.data().tokens || 0;
                document.getElementById("userTokens").textContent = currentTokens;
            }
        });
        fetchGames();
    }
});

function fetchGames() {
    const select = document.getElementById("gameSelect");

    db.collection("games")
        .where("status", "in", ["active", "upcoming"])
        .orderBy("scheduledAt", "asc")
        .onSnapshot(snapshot => {
            select.innerHTML = `<option value="">-- Select a Game --</option>`;

            if (snapshot.empty) {
                select.innerHTML = `<option value="">No Active/Upcoming Games Found</option>`;
                document.getElementById("ticketsContainer").innerHTML = `<p style="text-align:center;">No games available for booking.</p>`;
                return;
            }

            snapshot.forEach(doc => {
                const gData = doc.data();
                const schedTime = gData.scheduledAt ? new Date(gData.scheduledAt.toDate()).toLocaleString([], {dateStyle:'short', timeStyle:'short'}) : 'Immediate';
                select.innerHTML += `<option value="${doc.id}">Game #${doc.id.substring(0, 6)} [${gData.status.toUpperCase()}] - ${schedTime}</option>`;
            });

            if (select.options.length > 1) {
                select.selectedIndex = 1;
                loadGameTickets();
            }
        });
}

async function loadGameTickets() {
    const gameId = document.getElementById("gameSelect").value;
    const container = document.getElementById("ticketsContainer");
    container.innerHTML = "Loading available tickets...";

    if (!gameId) {
        container.innerHTML = "";
        return;
    }

    const snapshot = await db.collection("games").doc(gameId)
        .collection("gameTickets")
        .where("isPurchased", "==", false)
        .limit(12)
        .get();

    container.innerHTML = "";

    if (snapshot.empty) {
        container.innerHTML = "<p>No unpurchased tickets available for this game.</p>";
        return;
    }

    snapshot.forEach(doc => {
        const tData = doc.data();
        let gridHtml = '<div class="ticket-grid">';
        tData.grid.forEach(val => {
            gridHtml += val === 0 ? '<div class="t-cell empty"></div>' : `<div class="t-cell">${val}</div>`;
        });
        gridHtml += '</div>';

        container.innerHTML += `
            <div class="ticket-card">
                <strong>Ticket #${tData.ticketNumber}</strong>
                ${gridHtml}
                <button class="btn btn-success" style="width:100%;" onclick="buyTicket('${gameId}', '${doc.id}')">
                    Buy Ticket (10 Tokens)
                </button>
            </div>
        `;
    });
}

async function buyTicket(gameId, ticketDocId) {
    if (currentTokens < 10) return alert("Insufficient balance! Top up your tokens.");

    try {
        const ticketRef = db.collection("games").doc(gameId).collection("gameTickets").doc(ticketDocId);
        const userRef = db.collection("users").doc(currentUserUid);

        await db.runTransaction(async (transaction) => {
            const ticketDoc = await transaction.get(ticketRef);
            if (ticketDoc.data().isPurchased) throw "Ticket already purchased by someone else!";

            transaction.update(ticketRef, {
                isPurchased: true,
                ownerUid: currentUserUid
            });

            transaction.update(userRef, {
                tokens: currentTokens - 10
            });
        });

        alert("Ticket booked successfully!");
        window.location.href = "game.html";
    } catch (e) {
        alert("Booking failed: " + e);
    }
}
</script>

</body>
</html>
