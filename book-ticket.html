<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Ticket - Tambola House</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back-btn {
            background: #ff6600;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .balance {
            background: #ff6600;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 8px;
        }

        .balance-number {
            font-size: 32px;
            font-weight: bold;
        }

        .ticket-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        /*
        =====================================
        TICKET LIST
        =====================================
        */

        .tickets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .ticket {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            background: #fff;
        }

        .ticket.booked {
            background: #eeeeee;
            border-color: #aaa;
        }

        .ticket-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /*
        IMPORTANT:
        Ticket grid is NOT displayed here.
        It will only appear inside Preview popup.
        */

        .preview-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .preview-btn:hover {
            background: #1565c0;
        }

        .booked-label {
            text-align: center;
            padding: 11px;
            background: #ddd;
            border-radius: 6px;
            font-weight: bold;
        }

        /*
        =====================================
        MESSAGE
        =====================================
        */

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }

        .success {
            background: #dff0d8;
            color: #256029;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /*
        =====================================
        PREVIEW MODAL
        =====================================
        */

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            overflow-y: auto;
            padding: 30px 15px;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .modal-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .preview-ticket {
            border: 3px solid #222;
            border-radius: 10px;
            padding: 15px;
            background: white;
            overflow-x: auto;
        }

        /*
        =====================================
        TICKET GRID - ONLY IN PREVIEW
        =====================================
        */

        .ticket-grid {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .ticket-grid td {
            border: 1px solid #777;
            text-align: center;
            height: 60px;
            font-weight: bold;
            font-size: 20px;
            background: white;
        }

        .ticket-grid .empty-cell {
            background: #eeeeee;
        }

        .preview-price {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .preview-actions button {
            flex: 1;
            padding: 13px;
        }

        .book-btn {
            border: none;
            border-radius: 6px;
            background: #ff6600;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .book-btn:hover {
            background: #e65c00;
        }

        .book-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .cancel-btn {
            border: none;
            border-radius: 6px;
            background: #777;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background: #555;
        }

        .close-x {
            position: absolute;
            right: 18px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
            color: #555;
        }

        .close-x:hover {
            color: #000;
        }

        @media (max-width: 600px) {

            .modal-content {
                padding: 15px;
            }

            .preview-ticket {
                padding: 8px;
            }

            .ticket-grid td {
                height: 45px;
                font-size: 16px;
            }

            .preview-actions {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>


<header>

    <h1>Tambola House</h1>

    <a href="dashboard.html" class="back-btn">
        Dashboard
    </a>

</header>


<div class="container">


    <!-- ACCOUNT / BALANCE -->

    <div class="card">

        <h2>Book Your Ticket</h2>

        <p>
            Select a ticket and preview it before booking.
        </p>


        <div class="balance">

            <h2>Your Token Balance</h2>

            <div class="balance-number">
                <span id="tokenBalance">0</span>
                Tokens
            </div>

        </div>


        <div class="ticket-info">

            <div>

                <strong>Current Draw:</strong>

                <span id="drawName">
                    Loading...
                </span>

            </div>


            <div class="price">

                Ticket Price:
                10 Tokens

            </div>

        </div>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- TICKET LIST -->

    <div class="card">

        <h2>Choose Your Ticket</h2>

        <p>
            Click <strong>Preview Ticket</strong>
            to see the complete ticket.
        </p>

        <div
            id="tickets"
            class="tickets">

            <div class="loading">
                Loading tickets...
            </div>

        </div>

    </div>


</div>


<!-- =====================================
     PREVIEW POPUP
===================================== -->

<div
    id="previewModal"
    class="modal">


    <div class="modal-content">


        <span
            class="close-x"
            id="closePreview">

            &times;

        </span>


        <h2
            class="modal-title"
            id="previewTitle">

            Ticket Preview

        </h2>


        <!-- FULL TICKET APPEARS HERE -->

        <div
            id="previewTicket"
            class="preview-ticket">

        </div>


        <div class="preview-price">

            Price:
            10 Tokens

        </div>


        <div class="preview-actions">


            <button
                id="confirmBookBtn"
                class="book-btn">

                Book This Ticket - 10 Tokens

            </button>


            <button
                id="cancelPreviewBtn"
                class="cancel-btn">

                Cancel

            </button>


        </div>


    </div>

</div>



<script type="module">


    /*
    =====================================
    FIREBASE IMPORTS
    =====================================
    */


    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        where,
        runTransaction
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    import {
        firebaseConfig
    }
    from "./firebase-config.js";


    /*
    =====================================
    FIREBASE INITIALIZATION
    =====================================
    */


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /*
    =====================================
    SETTINGS
    =====================================
    */


    const TICKET_PRICE = 10;

    const CURRENT_DRAW_ID = "draw1";


    /*
    =====================================
    PAGE ELEMENTS
    =====================================
    */


    const tokenBalance =
        document.getElementById("tokenBalance");


    const ticketsContainer =
        document.getElementById("tickets");


    const message =
        document.getElementById("message");


    const drawName =
        document.getElementById("drawName");


    const previewModal =
        document.getElementById("previewModal");


    const previewTitle =
        document.getElementById("previewTitle");


    const previewTicket =
        document.getElementById("previewTicket");


    const confirmBookBtn =
        document.getElementById("confirmBookBtn");


    const closePreview =
        document.getElementById("closePreview");


    const cancelPreviewBtn =
        document.getElementById("cancelPreview");


    /*
    =====================================
    VARIABLES
    =====================================
    */


    let currentUser = null;

    let currentUserData = null;

    let selectedTicketId = null;


    /*
    =====================================
    SHOW MESSAGE
    =====================================
    */


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

    }


    /*
    =====================================
    LOGIN CHECK
    =====================================
    */


    onAuthStateChanged(
        auth,
        async (user) => {


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            currentUser = user;


            try {

                await loadUser();

                await loadTickets();

            }
            catch (error) {

                console.error(error);


                showMessage(
                    "Unable to load booking system: " +
                    error.message,
                    "error"
                );

            }

        }
    );


    /*
    =====================================
    LOAD USER
    =====================================
    */


    async function loadUser() {


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snapshot =
            await getDoc(userRef);


        if (!snapshot.exists()) {

            throw new Error(
                "User profile not found."
            );

        }


        currentUserData =
            snapshot.data();


        const balance =
            Number(
                currentUserData.tokenBalance || 0
            );


        tokenBalance.textContent =
            balance;


        drawName.textContent =
            "Draw 1";

    }


    /*
    =====================================
    LOAD 300 FIXED TICKETS
    =====================================
    */


    async function loadTickets() {


        ticketsContainer.innerHTML =
            '<div class="loading">Loading tickets...</div>';


        /*
        Get the permanent 300 tickets.
        */


        const ticketsSnapshot =
            await getDocs(
                collection(
                    db,
                    "tickets"
                )
            );


        /*
        Get tickets already booked
        for the current draw.
        */


        const bookingQuery =
            query(
                collection(
                    db,
                    "bookings"
                ),
                where(
                    "drawId",
                    "==",
                    CURRENT_DRAW_ID
                )
            );


        const bookingsSnapshot =
            await getDocs(
                bookingQuery
            );


        const bookedTickets =
            new Set();


        bookingsSnapshot.forEach(
            (bookingDoc) => {


                const data =
                    bookingDoc.data();


                if (data.ticketId) {

                    bookedTickets.add(
                        data.ticketId
                    );

                }

            }
        );


        if (ticketsSnapshot.empty) {

            ticketsContainer.innerHTML =
                '<div class="loading">No tickets found.</div>';

            return;

        }


        ticketsContainer.innerHTML =
            "";


        const tickets = [];


        ticketsSnapshot.forEach(
            (ticketDoc) => {


                tickets.push({

                    id:
                        ticketDoc.id,

                    data:
                        ticketDoc.data()

                });

            }
        );


        /*
        Sort:
        ticket001
        ticket002
        ticket003
        ...
        ticket300
        */


        tickets.sort(
            (a, b) => {


                const numberA =
                    Number(
                        String(a.id)
                            .replace(/\D/g, "")
                    );


                const numberB =
                    Number(
                        String(b.id)
                            .replace(/\D/g, "")
                    );


                return numberA - numberB;

            }
        );


        /*
        =====================================
        CREATE TICKET CARDS
        =====================================

        IMPORTANT:

        We DO NOT create the ticket table here.

        Only ticket name and Preview button
        are displayed.
        */


        tickets.forEach(
            (ticket) => {


                const ticketId =
                    ticket.id;


                const data =
                    ticket.data;


                const isBooked =
                    bookedTickets.has(
                        ticketId
                    );


                /*
                Get ticket numbers.

                We keep them in memory so that
                Preview can show them later.
                */


                const numbers =
                    getTicketNumbers(
                        data
                    );


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "ticket" +
                    (
                        isBooked
                            ? " booked"
                            : ""
                    );


                /*
                Ticket name
                */


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "ticket-number";


                title.textContent =
                    ticketId;


                div.appendChild(
                    title
                );


                /*
                If already booked
                */


                if (isBooked) {


                    const booked =
                        document.createElement(
                            "div"
                        );


                    booked.className =
                        "booked-label";


                    booked.textContent =
                        "BOOKED";


                    div.appendChild(
                        booked
                    );


                }


                /*
                If available,
                show Preview button.
                */


                else {


                    const previewBtn =
                        document.createElement(
                            "button"
                        );


                    previewBtn.className =
                        "preview-btn";


                    previewBtn.textContent =
                        "Preview Ticket";


                    previewBtn.addEventListener(
                        "click",
                        () => {


                            openPreview(
                                ticketId,
                                numbers
                            );


                        }
                    );


                    div.appendChild(
                        previewBtn
                    );

                }


                ticketsContainer.appendChild(
                    div
                );


            }
        );

    }


    /*
    =====================================
    GET TICKET NUMBERS
    =====================================
    */


    function getTicketNumbers(data) {


        let numbers =
            data.numbers;


        if (!Array.isArray(numbers)) {

            numbers =
                data.grid;

        }


        if (!Array.isArray(numbers)) {

            numbers =
                data.ticket;

        }


        if (!Array.isArray(numbers)) {

            numbers = [];

        }


        return numbers;

    }


    /*
    =====================================
    CREATE TICKET TABLE
    =====================================
    */


    function createTicketTable(numbers) {


        const table =
            document.createElement(
                "table"
            );


        table.className =
            "ticket-grid";


        if (
            Array.isArray(numbers) &&
            numbers.length > 0
        ) {


            numbers.forEach(
                (row) => {


                    const tr =
                        document.createElement(
                            "tr"
                        );


                    if (
                        Array.isArray(row)
                    ) {


                        row.forEach(
                            (value) => {


                                const td =
                                    document.createElement(
                                        "td"
                                    );


                                if (
                                    value === null ||
                                    value === undefined ||
                                    value === ""
                                ) {


                                    td.textContent =
                                        "";


                                    td.className =
                                        "empty-cell";


                                }
                                else {


                                    td.textContent =
                                        value;

                                }


                                tr.appendChild(
                                    td
                                );


                            }
                        );

                    }


                    table.appendChild(
                        tr
                    );


                }
            );

        }
        else {


            const tr =
                document.createElement(
                    "tr"
                );


            const td =
                document.createElement(
                    "td"
                );


            td.colSpan = 9;


            td.textContent =
                "Ticket design unavailable";


            tr.appendChild(
                td
            );


            table.appendChild(
                tr
            );

        }


        return table;

    }


    /*
    =====================================
    OPEN PREVIEW
    =====================================
    */


    function openPreview(
        ticketId,
        numbers
    ) {


        selectedTicketId =
            ticketId;


        previewTitle.textContent =
            "Ticket " +
            ticketId;


        /*
        Clear previous preview.
        */


        previewTicket.innerHTML =
            "";


        /*
        Create the ticket grid
        ONLY NOW.
        */


        const table =
            createTicketTable(
                numbers
            );


        previewTicket.appendChild(
            table
        );


        /*
        Open popup.
        */


        previewModal.style.display =
            "block";

    }


    /*
    =====================================
    CLOSE PREVIEW
    =====================================
    */


    function closePreviewModal() {


        previewModal.style.display =
            "none";


        selectedTicketId =
            null;


        previewTicket.innerHTML =
            "";

    }


    closePreview.addEventListener(
        "click",
        closePreviewModal
    );


    cancelPreviewBtn.addEventListener(
        "click",
        closePreviewModal
    );


    /*
    Close when clicking
    outside popup.
    */


    previewModal.addEventListener(
        "click",
        (event) => {


            if (
                event.target ===
                previewModal
            ) {

                closePreviewModal();

            }

        }
    );


    /*
    =====================================
    BOOK FROM PREVIEW
    =====================================
    */


    confirmBookBtn.addEventListener(
        "click",
        async () => {


            if (!selectedTicketId) {

                return;

            }


            const ticketToBook =
                selectedTicketId;


            await bookTicket(
                ticketToBook
            );

        }
    );


    /*
    =====================================
    BOOK TICKET
    =====================================
    */


    async function bookTicket(
        ticketId
    ) {


        if (!currentUser) {


            showMessage(
                "Please login first.",
                "error"
            );


            return;

        }


        /*
        Check displayed balance first.
        */


        const currentBalance =
            Number(
                currentUserData.tokenBalance || 0
            );


        if (
            currentBalance <
            TICKET_PRICE
        ) {


            closePreviewModal();


            showMessage(
                "You need at least 10 tokens to book a ticket.",
                "error"
            );


            return;

        }


        /*
        Final confirmation.
        */


        const confirmed =
            confirm(
                "Book " +
                ticketId +
                " for 10 tokens?"
            );


        if (!confirmed) {

            return;

        }


        try {


            confirmBookBtn.disabled =
                true;


            confirmBookBtn.textContent =
                "Booking...";


            /*
            Firestore transaction.

            This prevents two users
            from booking the same ticket
            at the same time.
            */


            await runTransaction(
                db,
                async (transaction) => {


                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    const bookingRef =
                        doc(
                            db,
                            "bookings",
                            CURRENT_DRAW_ID +
                            "_" +
                            ticketId
                        );


                    /*
                    Read user.
                    */


                    const userSnapshot =
                        await transaction.get(
                            userRef
                        );


                    /*
                    Read booking.
                    */


                    const bookingSnapshot =
                        await transaction.get(
                            bookingRef
                        );


                    /*
                    Ticket already booked?
                    */


                    if (
                        bookingSnapshot.exists()
                    ) {


                        throw new Error(
                            "This ticket has already been booked."
                        );

                    }


                    if (
                        !userSnapshot.exists()
                    ) {


                        throw new Error(
                            "User account not found."
                        );

                    }


                    const userData =
                        userSnapshot.data();


                    const balance =
                        Number(
                            userData.tokenBalance || 0
                        );


                    /*
                    Check balance again
                    inside transaction.
                    */


                    if (
                        balance <
                        TICKET_PRICE
                    ) {


                        throw new Error(
                            "Insufficient token balance."
                        );

                    }


                    /*
                    Deduct 10 tokens.
                    */


                    transaction.update(
                        userRef,
                        {

                            tokenBalance:
                                balance -
                                TICKET_PRICE

                        }
                    );


                    /*
                    Create booking.
                    */


                    transaction.set(
                        bookingRef,
                        {

                            drawId:
                                CURRENT_DRAW_ID,

                            ticketId:
                                ticketId,

                            userId:
                                currentUser.uid,

                            email:
                                currentUser.email || "",

                            price:
                                TICKET_PRICE,

                            status:
                                "booked",

                            bookedAt:
                                new Date()

                        }
                    );


                }
            );


            /*
            Booking successful.
            */


            closePreviewModal();


            showMessage(
                "Ticket " +
                ticketId +
                " booked successfully!",
                "success"
            );


            /*
            Refresh balance
            and ticket availability.
            */


            await loadUser();

            await loadTickets();


        }
        catch (error) {


            console.error(error);


            showMessage(
                "Booking failed: " +
                error.message,
                "error"
            );


        }
        finally {


            confirmBookBtn.disabled =
                false;


            confirmBookBtn.textContent =
                "Book This Ticket - 10 Tokens";

        }

    }


</script>


</body>
</html>
