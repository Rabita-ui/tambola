<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tambola Ticket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .ticket-preview-container {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 2px solid #1f7a4b;
        }
        
        .ticket-preview-container.active {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .tambola-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            max-width: 600px;
            margin: 0 auto;
            background: #f8f4f0;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #d4c5b5;
        }
        
        .tambola-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #e0d5c8;
            min-height: 40px;
        }
        
        .tambola-cell.empty {
            background: #f0ebe6;
            border: 1px dashed #d4c5b5;
            color: #b8a89a;
        }
        
        .tambola-cell.filled {
            background: #fff;
            color: #2d1f14;
            border: 1px solid #b35e2e;
        }
        
        .tambola-cell.filled.highlight {
            background: #b35e2e;
            color: white;
            transform: scale(1.05);
        }
        
        .ticket-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        
        .ticket-info h3 {
            color: #2d1f14;
            font-size: 1.2rem;
        }
        
        .ticket-info .price-tag {
            background: #1f7a4b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .preview-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn-close-preview {
            background: #6c5a4a;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-close-preview:hover {
            background: #5a4a3a;
        }
        
        .btn-book-from-preview {
            background: #1f7a4b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-book-from-preview:hover {
            background: #16633b;
        }
        
        .preview-ticket-btn {
            background: #b35e2e;
            color: white;
        }
        
        .preview-ticket-btn:hover {
            background: #8f4a24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-ticket-alt"></i> Book Your Tambola Ticket</h1>
        
        <!-- Ticket Selection -->
        <div class="ticket-selection">
            <h2>Available Tickets</h2>
            <div class="ticket-list" id="ticketList">
                <!-- Tickets will be loaded here -->
            </div>
        </div>
        
        <!-- Ticket Preview Container -->
        <div class="ticket-preview-container" id="ticketPreviewContainer">
            <div class="ticket-info">
                <h3 id="previewTicketId">Ticket #002</h3>
                <span class="price-tag" id="previewTicketPrice">10 Tokens</span>
            </div>
            <div class="tambola-grid" id="tambolaGrid">
                <!-- Tambola numbers will be generated here -->
            </div>
            <div class="preview-actions">
                <button class="btn btn-book-from-preview" onclick="bookFromPreview()">
                    <i class="fas fa-check"></i> Book This Ticket
                </button>
                <button class="btn btn-close-preview" onclick="closePreview()">
                    <i class="fas fa-times"></i> Close Preview
                </button>
            </div>
        </div>
        
        <!-- Your existing ticket panels -->
        <div class="ticket-panel">
            <!-- Your existing ticket002 panel here -->
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        // Sample ticket data - replace with Firebase data
        const tickets = {
            'ticket001': { price: 5, numbers: generateTambolaNumbers() },
            'ticket002': { price: 10, numbers: generateTambolaNumbers() },
            'ticket003': { price: 8, numbers: generateTambolaNumbers() }
        };
        
        // Generate random Tambola numbers (3 rows x 9 columns)
        function generateTambolaNumbers() {
            const grid = [];
            const rows = 3;
            const cols = 9;
            
            for (let row = 0; row < rows; row++) {
                const rowData = [];
                const numbersInRow = 5; // Each row has 5 numbers
                const positions = [];
                
                // Choose 5 random positions for numbers
                while (positions.length < numbersInRow) {
                    const pos = Math.floor(Math.random() * cols);
                    if (!positions.includes(pos)) {
                        positions.push(pos);
                    }
                }
                positions.sort((a, b) => a - b);
                
                // Generate numbers for each column
                for (let col = 0; col < cols; col++) {
                    if (positions.includes(col)) {
                        // Generate number based on column range
                        const min = col * 10 + 1;
                        const max = col * 10 + 10;
                        const num = Math.floor(Math.random() * (max - min + 1)) + min;
                        rowData.push(num);
                    } else {
                        rowData.push(null); // Empty cell
                    }
                }
                grid.push(rowData);
            }
            return grid;
        }
        
        // Display ticket in preview
        function showTicketPreview(ticketId, price) {
            const container = document.getElementById('ticketPreviewContainer');
            const grid = document.getElementById('tambolaGrid');
            const ticketIdEl = document.getElementById('previewTicketId');
            const priceEl = document.getElementById('previewTicketPrice');
            
            // Update ticket info
            ticketIdEl.textContent = `Ticket #${ticketId}`;
            priceEl.textContent = `${price} Tokens`;
            
            // Clear existing grid
            grid.innerHTML = '';
            
            // Get ticket numbers
            const ticketData = tickets[ticketId] || { numbers: generateTambolaNumbers() };
            const numbers = ticketData.numbers;
            
            // Generate grid
            numbers.forEach((row, rowIndex) => {
                row.forEach((number, colIndex) => {
                    const cell = document.createElement('div');
                    cell.className = 'tambola-cell';
                    
                    if (number === null) {
                        cell.classList.add('empty');
                        cell.textContent = '';
                    } else {
                        cell.classList.add('filled');
                        cell.textContent = number;
                        // Highlight if number matches some condition (optional)
                        if (number % 10 === 0) {
                            cell.classList.add('highlight');
                        }
                    }
                    
                    grid.appendChild(cell);
                });
            });
            
            // Show container with animation
            container.classList.add('active');
            
            // Store current ticket for booking
            container.dataset.currentTicket = ticketId;
            container.dataset.currentPrice = price;
            
            // Scroll to preview
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        // Close preview
        function closePreview() {
            const container = document.getElementById('ticketPreviewContainer');
            container.classList.remove('active');
        }
        
        // Book from preview
        function bookFromPreview() {
            const container = document.getElementById('ticketPreviewContainer');
            const ticketId = container.dataset.currentTicket;
            const price = container.dataset.currentPrice;
            
            if (!ticketId) {
                alert('No ticket selected!');
                return;
            }
            
            // Here you would call your booking function
            alert(`Booking ${ticketId} for ${price} tokens...`);
            
            // Close preview after booking
            closePreview();
            
            // Update UI to show booked status
            const bookBtn = document.querySelector(`[data-ticket="${ticketId}"] .btn-book`);
            if (bookBtn) {
                bookBtn.innerHTML = '<i class="fas fa-check"></i> Booked';
                bookBtn.disabled = true;
                bookBtn.style.background = '#4a7b62';
            }
        }
        
        // Load tickets on page load
        document.addEventListener('DOMContentLoaded', function() {
            const ticketList = document.getElementById('ticketList');
            
            // Sample ticket display - replace with Firebase data
            const sampleTickets = [
                { id: 'ticket001', price: 5 },
                { id: 'ticket002', price: 10 },
                { id: 'ticket003', price: 8 }
            ];
            
            sampleTickets.forEach(ticket => {
                const ticketCard = document.createElement('div');
                ticketCard.className = 'ticket-card';
                ticketCard.dataset.ticket = ticket.id;
                ticketCard.innerHTML = `
                    <div class="ticket-card-header">
                        <span class="ticket-id">${ticket.id}</span>
                        <span class="ticket-price">${ticket.price} Tokens</span>
                    </div>
                    <div class="ticket-card-actions">
                        <button class="btn btn-primary btn-preview" onclick="showTicketPreview('${ticket.id}', ${ticket.price})">
                            <i class="fas fa-eye"></i> Preview
                        </button>
                        <button class="btn btn-primary btn-book" data-ticket="${ticket.id}">
                            <i class="fas fa-shopping-cart"></i> Book
                        </button>
                    </div>
                `;
                ticketList.appendChild(ticketCard);
                
                // Add book button functionality
                const bookBtn = ticketCard.querySelector('.btn-book');
                bookBtn.addEventListener('click', function() {
                    const ticketId = this.dataset.ticket;
                    const price = ticket.price;
                    alert(`Booking ${ticketId} for ${price} tokens...`);
                    // Implement actual booking logic here
                });
            });
        });
    </script>
</body>
</html>
